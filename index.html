<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Telegram</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%232AABEE'/><text y='.9em' font-size='60' x='18'>✈</text></svg>"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{height:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0e1621;color:#f5f5f5;}

/* THEMES */
:root{
  --bg:#0e1621;--panel:#17212b;--input:#1d2d3e;--hover:#1d2d3e;
  --border:rgba(255,255,255,0.08);--text:#f5f5f5;--hint:#708499;
  --bubble-in:#182533;--bubble-out:#2b5278;--accent:#2AABEE;
  --accent-dark:#229ED9;--green:#4CAF93;--red:#e74c3c;
  --shadow:0 4px 24px rgba(0,0,0,0.4);
}
[data-theme=light]{
  --bg:#f1f1f1;--panel:#fff;--input:#f1f1f1;--hover:#f1f1f1;
  --border:rgba(0,0,0,0.1);--text:#000;--hint:#999;
  --bubble-in:#fff;--bubble-out:#effdde;--shadow:0 4px 24px rgba(0,0,0,0.15);
}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}
[data-theme=light]::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);}

/* LAYOUT */
#root{display:flex;flex-direction:column;}
.app{display:flex;height:100vh;overflow:hidden;background:var(--bg);}

/* SIDEBAR */
.sidebar{width:340px;height:100%;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--border);flex-shrink:0;transition:transform 0.25s;}
.sidebar-header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);}
.search-wrap{flex:1;position:relative;}
.search-wrap input{width:100%;background:var(--input);border:none;border-radius:20px;padding:8px 12px 8px 36px;color:var(--text);font-size:14px;outline:none;}
.search-wrap input::placeholder{color:var(--hint);}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--hint);font-size:16px;}
.icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:transparent;cursor:pointer;color:var(--hint);display:flex;align-items:center;justify-content:center;font-size:18px;transition:background 0.15s;}
.icon-btn:hover{background:var(--hover);}
.folder-tabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--border);}
.folder-tab{padding:5px 12px;border-radius:20px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:transparent;color:var(--hint);transition:all 0.15s;}
.folder-tab.active{background:var(--accent);color:#fff;}
.chats-list{flex:1;overflow-y:auto;}
.chat-item{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;transition:background 0.15s;position:relative;}
.chat-item:hover{background:var(--hover);}
.chat-item.active{background:rgba(42,171,238,0.15);}
.chat-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);border-radius:0 2px 2px 0;}
.chat-meta{flex:1;min-width:0;}
.chat-name-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;}
.chat-name{font-size:15px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chat-time{font-size:12px;color:var(--hint);flex-shrink:0;margin-left:8px;}
.chat-last-row{display:flex;justify-content:space-between;align-items:center;}
.chat-last{font-size:13px;color:var(--hint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.badge{background:var(--accent);color:#fff;border-radius:12px;font-size:11px;font-weight:700;padding:2px 7px;min-width:20px;text-align:center;flex-shrink:0;}

/* AVATAR */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;position:relative;overflow:hidden;}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.online-dot{position:absolute;bottom:1px;right:1px;width:10px;height:10px;background:var(--green);border-radius:50%;border:2px solid var(--panel);}

/* CHAT AREA */
.chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.chat-header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;box-shadow:var(--shadow);}
.chat-header-info{flex:1;min-width:0;cursor:pointer;}
.chat-header-name{font-size:15px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chat-header-status{font-size:13px;color:var(--hint);}
.chat-header-status.online{color:var(--green);}
.chat-header-status.typing{color:var(--accent);}
.messages{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:2px;}
.date-divider{text-align:center;margin:12px 0;}
.date-divider span{background:rgba(42,171,238,0.15);color:var(--hint);font-size:12px;padding:4px 12px;border-radius:12px;}
.msg-wrap{display:flex;margin-bottom:2px;}
.msg-wrap.out{justify-content:flex-end;}
.msg-wrap.in{justify-content:flex-start;}
.bubble{max-width:72%;padding:8px 12px;border-radius:16px;position:relative;word-break:break-word;line-height:1.5;}
.bubble.out{background:var(--bubble-out);border-bottom-right-radius:4px;}
.bubble.in{background:var(--bubble-in);border-bottom-left-radius:4px;}
[data-theme=light] .bubble.in{box-shadow:0 1px 4px rgba(0,0,0,0.1);}
.bubble-text{font-size:14.5px;color:var(--text);white-space:pre-wrap;}
.bubble-time{display:flex;align-items:center;gap:3px;justify-content:flex-end;margin-top:4px;}
.bubble-time span{font-size:11px;color:var(--hint);}
.status-icon{font-size:11px;}
.status-icon.read{color:var(--accent);}
.reply-preview{background:rgba(42,171,238,0.15);border-left:3px solid var(--accent);border-radius:6px;padding:6px 8px;margin-bottom:6px;cursor:pointer;}
.reply-preview-name{font-size:12px;font-weight:600;color:var(--accent);}
.reply-preview-text{font-size:12px;color:var(--hint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.msg-actions{opacity:0;transition:opacity 0.15s;display:flex;gap:4px;align-items:center;align-self:flex-end;margin:0 4px;}
.msg-wrap:hover .msg-actions{opacity:1;}
.msg-action-btn{width:28px;height:28px;border-radius:50%;border:none;background:var(--panel);cursor:pointer;color:var(--hint);font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
.deleted-msg{font-style:italic;opacity:0.6;}
.typing-bubble{display:flex;align-items:center;gap:4px;padding:10px 12px;background:var(--bubble-in);border-radius:16px;border-bottom-left-radius:4px;width:fit-content;}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--hint);animation:typingAnim 1.2s infinite;}
.typing-dot:nth-child(2){animation-delay:0.2s;}
.typing-dot:nth-child(3){animation-delay:0.4s;}
@keyframes typingAnim{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-5px);}}
.typing-label{font-size:12px;color:var(--hint);padding:4px 12px;}

/* INPUT */
.input-area{background:var(--panel);border-top:1px solid var(--border);padding:10px 12px;flex-shrink:0;}
.reply-bar{display:flex;align-items:center;gap:8px;background:var(--input);border-radius:10px;padding:8px 10px;margin-bottom:8px;border-left:3px solid var(--accent);}
.reply-bar-content{flex:1;min-width:0;}
.reply-bar-name{font-size:12px;font-weight:600;color:var(--accent);}
.reply-bar-text{font-size:12px;color:var(--hint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.input-row{display:flex;align-items:flex-end;gap:8px;}
.input-box{flex:1;background:var(--input);border-radius:20px;padding:10px 14px;display:flex;align-items:flex-end;gap:8px;}
.input-box textarea{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:15px;resize:none;max-height:120px;font-family:inherit;line-height:1.5;}
.input-box textarea::placeholder{color:var(--hint);}
.send-btn{width:44px;height:44px;border-radius:50%;border:none;background:var(--accent);cursor:pointer;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s;box-shadow:0 2px 12px rgba(42,171,238,0.4);}
.send-btn:hover{background:var(--accent-dark);}
.send-btn:disabled{background:var(--hover);color:var(--hint);box-shadow:none;cursor:default;}
.emoji-btn{color:var(--hint);font-size:22px;cursor:pointer;background:none;border:none;padding:0 4px;}
.emoji-picker{position:absolute;bottom:calc(100% + 8px);left:0;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:10px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;box-shadow:var(--shadow);z-index:100;}
.emoji-picker button{background:none;border:none;cursor:pointer;font-size:20px;padding:5px;border-radius:6px;transition:background 0.1s;}
.emoji-picker button:hover{background:var(--hover);}

/* AUTH */
.auth-screen{height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:16px;}
.auth-card{background:var(--panel);border-radius:20px;padding:32px 28px;width:100%;max-width:400px;box-shadow:var(--shadow);}
.auth-logo{text-align:center;margin-bottom:28px;}
.auth-logo-icon{width:80px;height:80px;border-radius:50%;background:var(--accent);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 8px 32px rgba(42,171,238,0.4);}
.auth-title{font-size:24px;font-weight:800;color:var(--text);}
.auth-sub{font-size:14px;color:var(--hint);margin-top:4px;}
.auth-tabs{display:flex;background:var(--input);border-radius:12px;margin-bottom:20px;padding:3px;}
.auth-tab{flex:1;padding:9px;border:none;border-radius:10px;cursor:pointer;background:transparent;color:var(--hint);font-weight:600;font-size:13px;font-family:inherit;transition:all 0.2s;}
.auth-tab.active{background:rgba(42,171,238,0.2);color:var(--accent);}
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:12px;color:var(--hint);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px;font-weight:600;}
.form-input{width:100%;background:var(--input);border:1.5px solid transparent;border-radius:12px;padding:12px 14px;color:var(--text);font-size:14px;outline:none;font-family:inherit;transition:border-color 0.2s;}
.form-input:focus{border-color:rgba(42,171,238,0.5);}
.form-input::placeholder{color:var(--hint);}
.form-error{background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.3);border-radius:10px;padding:10px 12px;color:#FF6B6B;font-size:13px;margin-bottom:14px;}
.btn-primary{width:100%;padding:13px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.15s;}
.btn-primary:hover{background:var(--accent-dark);}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed;}

/* SETTINGS */
.settings-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);}
.settings-modal{background:var(--panel);border-radius:20px;width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);}
.settings-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0;}
.settings-header h2{font-size:18px;font-weight:700;color:var(--text);}
.settings-body{display:flex;flex:1;overflow:hidden;}
.settings-nav{width:180px;border-right:1px solid var(--border);padding:8px 0;flex-shrink:0;background:rgba(0,0,0,0.1);}
.settings-nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;border:none;border-left:3px solid transparent;background:transparent;cursor:pointer;color:var(--hint);font-size:13px;font-weight:600;font-family:inherit;transition:all 0.15s;text-align:left;}
.settings-nav-btn:hover{color:var(--text);background:var(--hover);}
.settings-nav-btn.active{color:var(--accent);border-left-color:var(--accent);background:rgba(42,171,238,0.08);}
.settings-nav-btn span:first-child{font-size:18px;}
.settings-content{flex:1;overflow-y:auto;padding:20px;}
.settings-section{margin-bottom:24px;}
.settings-section h3{font-size:12px;color:var(--hint);text-transform:uppercase;letter-spacing:0.8px;font-weight:700;margin-bottom:12px;}
.settings-card{background:var(--input);border-radius:14px;padding:16px;margin-bottom:12px;}
.profile-av-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:20px;}
.av-upload-btn{position:relative;cursor:pointer;}
.av-upload-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.av-edit-badge{position:absolute;bottom:0;right:0;width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid var(--panel);}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.theme-option{padding:14px;border-radius:12px;border:2px solid var(--border);cursor:pointer;transition:all 0.15s;background:transparent;}
.theme-option:hover{border-color:var(--hint);}
.theme-option.selected{border-color:var(--accent);background:rgba(42,171,238,0.08);}
.theme-option-label{font-size:14px;font-weight:600;color:var(--text);}
.theme-option-sub{font-size:12px;color:var(--hint);margin-top:2px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
.toggle-row:last-child{border-bottom:none;}
.toggle-row-label{font-size:14px;color:var(--text);}
.toggle{width:44px;height:24px;border-radius:12px;background:var(--accent);position:relative;cursor:pointer;transition:background 0.2s;border:none;}
.toggle-knob{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:right 0.2s;box-shadow:0 1px 4px rgba(0,0,0,0.3);}
.blocked-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.blocked-item:last-child{border-bottom:none;}
.unblock-btn{padding:6px 12px;border-radius:8px;border:none;background:rgba(231,76,60,0.1);color:var(--red);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.save-btn{padding:11px 22px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;transition:all 0.15s;}
.save-btn:hover{background:var(--accent-dark);}
.logout-btn{width:100%;padding:11px;border-radius:12px;border:none;background:rgba(231,76,60,0.1);color:var(--red);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px;}

/* CONTEXT MENU */
.ctx-menu{position:fixed;z-index:200;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;min-width:160px;}
.ctx-item{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;font-size:14px;color:var(--text);transition:background 0.1s;border:none;background:none;width:100%;text-align:left;font-family:inherit;}
.ctx-item:hover{background:var(--hover);}
.ctx-item.danger{color:var(--red);}

/* EMPTY STATE */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg);}
.empty-icon{width:100px;height:100px;border-radius:50%;background:rgba(42,171,238,0.1);display:flex;align-items:center;justify-content:center;font-size:44px;}
.empty-title{font-size:22px;font-weight:700;color:var(--text);}
.empty-sub{font-size:14px;color:var(--hint);text-align:center;max-width:280px;}

/* MOBILE */
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:30;transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .mobile-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:29;display:none;}
  .mobile-overlay.show{display:block;}
  .back-btn{display:flex!important;}
}
.back-btn{display:none;width:36px;height:36px;border-radius:50%;border:none;background:transparent;cursor:pointer;color:var(--hint);font-size:20px;align-items:center;justify-content:center;}

/* ANIMATIONS */
@keyframes fadeIn{from{opacity:0;transform:scale(0.96);}to{opacity:1;transform:scale(1);}}
.settings-overlay .settings-modal{animation:fadeIn 0.2s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.msg-wrap{animation:msgIn 0.15s ease;}
</style>

// ══════════════════════════════════════

const AVATAR_COLORS = ["#E17055","#6C5CE7","#00B894","#0984E3","#FDCB6E","#E84393","#00CEC9","#2AABEE"];
const getColor = name => AVATAR_COLORS[(name?.charCodeAt(0)||0) % AVATAR_COLORS.length];
const fmtTime = ts => {
  if (!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const now = new Date();
  const diff = now - d;
  if (diff < 86400000) return d.toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"});

};

};
const groupByDate = msgs => {

  msgs.forEach(m => {
    if (m.deletedFor?.includes(state.user?.uid)) return;

    if (!groups[d]) groups[d] = [];
    groups[d].push(m);
  });
  return groups;
};
const EMOJIS = ["😀","😂","😍","🥰","😎","🤔","😅","🙏","🔥","✅","❤️","👍","👎","🎉","💯","🚀","💡","⭐","🎯","💪","🤝","👋","✨","🌟","😭","💎","🌈","⚡","🎮","🍕","😤","🥳","😊","🤩","🫡","🫶","😴","🤑","😈","👑"];

// ══════════════════════════════════════
// RENDER ENGINE
// ══════════════════════════════════════
function setState(partial) {
  Object.assign(state, partial);
  render();
}

function render() {
  const root = document.getElementById("root");
  if (!root) return;
  // Apply theme
  document.documentElement.setAttribute("data-theme", state.theme === "light" ? "light" : "");

  attachEvents();

function buildAvatar(name, photo, size=46, showOnline=false) {
  const color = getColor(name);
  const s = `width:${size}px;height:${size}px;font-size:${Math.round(size*0.38)}px;background:${color};`;
  const inner = photo
    ? `<img src="${photo}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;"/>`
    : `<span>${(name||"?")[0].toUpperCase()}</span>`;
  const dot = showOnline ? `<div class="online-dot" style="width:${Math.round(size*0.23)}px;height:${Math.round(size*0.23)}px;"></div>` : "";
  return `<div class="av" style="${s}">${inner}${dot}</div>`;
}

function buildApp() {
  if (state.authLoading) return `<div style="height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);flex-direction:column;gap:16px;"><div class="av" style="width:80px;height:80px;font-size:36px;background:var(--accent);animation:typingAnim 1s infinite;">✈</div><div style="color:var(--hint);font-size:14px;">Загрузка...</div></div>`;
  if (!state.user) return buildAuth();
  return `
    <div class="app">
      <div class="mobile-overlay ${state.sidebarOpen?"show":""}" onclick="closeSidebar()"></div>
      ${buildSidebar()}
      ${state.activeChatId ? buildChatArea() : buildEmptyState()}
    </div>
    ${state.settingsOpen ? buildSettings() : ""}
    ${state.ctxMenu ? buildCtxMenu() : ""}
  `;
}

function buildAuth() {
  const {authTab,authForm,authError,authLoading2} = state;
  return `
  <div class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-icon">✈</div>
        <div class="auth-title">Telegram</div>
        <div class="auth-sub">${authTab==="login"?"Войдите в аккаунт":"Создайте аккаунт"}</div>
      </div>
      <div class="auth-tabs">
        <button class="auth-tab ${authTab==="login"?"active":""}" onclick="setAuthTab('login')">Войти</button>
        <button class="auth-tab ${authTab==="register"?"active":""}" onclick="setAuthTab('register')">Регистрация</button>
      </div>
      ${authTab==="register"?`<div class="form-group"><label class="form-label">Имя пользователя</label><input class="form-input" id="f-username" value="${authForm.username}" oninput="updAuthForm('username',this.value)" placeholder="username"/></div>`:""}
      <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="f-email" type="email" value="${authForm.email}" oninput="updAuthForm('email',this.value)" placeholder="you@example.com" onkeydown="if(event.key==='Enter')submitAuth()"/></div>
      <div class="form-group"><label class="form-label">Пароль</label><input class="form-input" id="f-password" type="password" value="${authForm.password}" oninput="updAuthForm('password',this.value)" placeholder="••••••••" onkeydown="if(event.key==='Enter')submitAuth()"/></div>
      ${authError?`<div class="form-error">${authError}</div>`:""}
      <button class="btn-primary" onclick="submitAuth()" ${authLoading2?"disabled":""}>${authLoading2?"Загрузка...":authTab==="login"?"Войти":"Создать аккаунт"}</button>
    </div>
  </div>`;
}

function buildSidebar() {
  const {chats,activeChatId,searchQ,searchResults,folder,user,profile} = state;
  let list = searchQ ? searchResults : chats;
  if (!searchQ) {
    if (folder==="dm") list = list.filter(c=>c.type==="dm");
    if (folder==="groups") list = list.filter(c=>c.type==="group");
  }
  const name = profile?.displayName || user?.displayName || user?.email || "";
  const photo = profile?.photoURL || user?.photoURL || "";
  return `
  <div class="sidebar ${state.sidebarOpen?"open":""}" id="sidebar">
    <div class="sidebar-header">
      <button class="icon-btn" onclick="toggleMenu()" id="menu-btn" style="font-size:20px;">☰</button>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input value="${searchQ}" oninput="handleSearch(this.value)" placeholder="Поиск" id="search-inp"/>
      </div>
      <button class="icon-btn" onclick="openSettings('profile')" title="Настройки">⚙️</button>
    </div>
    <div id="hamburger-menu" style="display:none;position:absolute;top:60px;left:8px;z-index:100;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;min-width:200px;">
      <div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);">
        ${buildAvatar(name,photo,40)}
        <div><div style="font-weight:700;font-size:14px;color:var(--text);">${esc(name)}</div><div style="font-size:12px;color:var(--hint);">${esc(user?.email||"")}</div></div>
      </div>
      <button class="ctx-item" onclick="openSettings('profile')">👤 Профиль</button>
      <button class="ctx-item" onclick="openSettings('appearance')">🎨 Оформление</button>
      <button class="ctx-item" onclick="openSettings('privacy')">🔒 Приватность</button>
      <button class="ctx-item" onclick="toggleTheme()">🌙 Сменить тему</button>
      <button class="ctx-item danger" onclick="doLogout()">🚪 Выйти</button>
    </div>
    <div class="folder-tabs">
      ${["all","dm","groups"].map(f=>`<button class="folder-tab ${folder===f?"active":""}" onclick="setFolder('${f}')">${f==="all"?"Все":f==="dm"?"Личные":"Группы"}</button>`).join("")}
    </div>
    <div class="chats-list">
      ${searchQ && !searchResults.length ? `<div style="padding:24px;text-align:center;color:var(--hint);font-size:14px;">Ничего не найдено</div>` : ""}
      ${searchQ && searchResults.length ? searchResults.map(u=>buildSearchResult(u)).join("") : list.map(c=>buildChatItem(c,activeChatId,user?.uid)).join("")}
      ${!searchQ && !list.length ? `<div style="padding:40px 16px;text-align:center;"><div style="font-size:40px;margin-bottom:12px;">💬</div><div style="color:var(--hint);font-size:14px;">Найдите друзей через поиск</div></div>` : ""}
    </div>
  </div>`;
}

function buildSearchResult(u) {
  const name = u.displayName || u.username || u.email;
  return `
  <div class="chat-item" onclick="openDM('${u.id}','${esc(u.displayName||u.username||"")}','${esc(u.email||"")}','${esc(u.photoURL||"")}')">
    ${buildAvatar(name, u.photoURL, 46)}
    <div class="chat-meta">
      <div class="chat-name-row"><span class="chat-name">${esc(name)}</span></div>
      <div class="chat-last">${esc(u.email||"")}</div>
    </div>
  </div>`;
}

function buildChatItem(chat, activeChatId, myUid) {
  const isActive = chat.id === activeChatId;
  const other = chat.type==="dm" ? chat.otherUser : null;
  const name = chat.type==="dm" ? (other?.displayName||other?.username||"Пользователь") : (chat.name||"Группа");
  const photo = chat.type==="dm" ? other?.photoURL : chat.photoURL;
  const last = chat.lastMessage;
  const isMine = last?.senderId === myUid;
  const unread = chat.unreadCount?.[myUid] || 0;
  const icon = chat.type==="group" ? "👥 " : "";
  return `
  <div class="chat-item ${isActive?"active":""}" onclick="selectChat('${chat.id}')">
    ${buildAvatar(name, photo, 48, chat.type==="dm" && other?.online)}
    <div class="chat-meta">
      <div class="chat-name-row">
        <span class="chat-name">${icon}${esc(name)}</span>
        <span class="chat-time">${last?fmtTime(last.createdAt):""}</span>
      </div>
      <div class="chat-last-row">
        <span class="chat-last">${isMine?'<span style="color:var(--accent)">Вы: </span>':""}${esc((last?.text||"Нет сообщений").replace(/\n/g," "))}</span>
        ${unread>0?`<span class="badge">${unread>99?"99+":unread}</span>`:""}
      </div>
    </div>
  </div>`;
}

function buildEmptyState() {
  return `
  <div class="empty-state">
    <div class="empty-icon">✈</div>
    <div class="empty-title">Telegram Web</div>
    <div class="empty-sub">Выберите чат слева или найдите пользователя через поиск</div>
  </div>`;
}

function buildChatArea() {
  const {activeChat,messages,user,replyTo,emojiOpen,typingUsers,loadingMsgs} = state;
  if (!activeChat) return buildEmptyState();
  const other = activeChat.type==="dm" ? activeChat.otherUser : null;
  const name = activeChat.type==="dm" ? (other?.displayName||other?.username||"Пользователь") : (activeChat.name||"Группа");
  const photo = activeChat.type==="dm" ? other?.photoURL : activeChat.photoURL;
  const isOnline = other?.online;
  const statusTxt = typingUsers.length ? `${typingUsers.join(", ")} печатает...` : isOnline ? "в сети" : "не в сети";
  const statusClass = typingUsers.length ? "typing" : isOnline ? "online" : "";
  const grouped = groupByDate(messages);

  return `
  <div class="chat-area">
    <div class="chat-header">
      <button class="back-btn" onclick="closeSidebar()" style="display:flex;">◀</button>
      ${buildAvatar(name,photo,40,other?.online)}
      <div class="chat-header-info" onclick="openSettings('profile')">
        <div class="chat-header-name">${esc(name)}</div>
        <div class="chat-header-status ${statusClass}">${esc(statusTxt)}</div>
      </div>
      <button class="icon-btn" onclick="openSettings('profile')">🔍</button>
      <button class="icon-btn" onclick="openSettings('profile')">☎️</button>
    </div>
    <div class="messages" id="msgs-container">
      ${loadingMsgs ? buildSkeleton() : Object.entries(grouped).map(([date,msgs])=>`
        <div class="date-divider"><span>${date}</span></div>
        ${msgs.map(m=>buildMessage(m,m.senderId===user?.uid)).join("")}
      `).join("")}
      ${typingUsers.length ? `<div class="msg-wrap in"><div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div><div class="typing-label">${esc(typingUsers[0])} печатает</div>` : ""}
    </div>
    <div class="input-area" style="position:relative;">
      ${replyTo ? `<div class="reply-bar"><div class="reply-bar-content"><div class="reply-bar-name">${esc(replyTo.senderName)}</div><div class="reply-bar-text">${esc(replyTo.text)}</div></div><button onclick="clearReply()" style="background:none;border:none;cursor:pointer;color:var(--hint);font-size:16px;">✕</button></div>` : ""}
      ${emojiOpen ? buildEmojiPicker() : ""}
      <div class="input-row">
        <button class="emoji-btn" onclick="toggleEmoji()">😊</button>
        <div class="input-box">
          <textarea id="msg-input" placeholder="Сообщение" rows="1" oninput="autoResize(this);handleTyping()" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
        </div>
        <button class="send-btn" id="send-btn" onclick="sendMsg()">▶</button>
      </div>
    </div>
  </div>`;
}

function buildMessage(msg, isOwn) {
  const deleted = msg.deleted;
  const time = fmtTime(msg.createdAt);
  const status = isOwn ? (msg.status==="read"?`<span class="status-icon read">✓✓</span>`:msg.status==="delivered"?`<span class="status-icon">✓✓</span>`:`<span class="status-icon">✓</span>`) : "";
  const replyHtml = msg.replyTo ? `<div class="reply-preview"><div class="reply-preview-name">${esc(msg.replyTo.senderName)}</div><div class="reply-preview-text">${esc(msg.replyTo.text)}</div></div>` : "";
  const actions = isOwn
    ? `<div class="msg-actions">${!deleted?`<button class="msg-action-btn" onclick="replyToMsg('${msg.id}')" title="Ответить">↩</button>`:""}<button class="msg-action-btn" onclick="showMsgCtx(event,'${msg.id}',true)" title="Ещё">⋯</button></div>`
    : `<div class="msg-actions"><button class="msg-action-btn" onclick="replyToMsg('${msg.id}')" title="Ответить">↩</button><button class="msg-action-btn" onclick="showMsgCtx(event,'${msg.id}',false)" title="Ещё">⋯</button></div>`;

  return `
  <div class="msg-wrap ${isOwn?"out":"in"}" data-id="${msg.id}">
    ${isOwn?actions:""}
    <div class="bubble ${isOwn?"out":"in"}">
      ${replyHtml}
      <div class="bubble-text ${deleted?"deleted-msg":""}">${deleted?"Сообщение удалено":esc(msg.text)}</div>
      <div class="bubble-time"><span>${time}</span>${status}</div>
    </div>
    ${!isOwn?actions:""}
  </div>`;
}

function buildSkeleton() {
  return Array.from({length:6}).map((_,i)=>`
    <div class="msg-wrap ${i%2===0?"out":"in"}">
      <div style="height:40px;border-radius:16px;background:var(--hover);width:${Math.random()*25+15}%;animation:typingAnim 1.5s infinite;"></div>
    </div>`).join("");
}

function buildEmojiPicker() {
  return `<div class="emoji-picker">${EMOJIS.map(e=>`<button onclick="addEmoji('${e}')">${e}</button>`).join("")}</div>`;
}

function buildSettings() {
  const {settingsTab,profile,user,theme,saving,saveOk,profileForm} = state;
  const name = profileForm.displayName || profile?.displayName || user?.displayName || "";
  const photo = profile?.photoURL || user?.photoURL || "";
  const tabs = [["profile","👤","Профиль"],["appearance","🎨","Оформление"],["privacy","🔒","Приватность"],["notifications","🔔","Уведомления"]];

  let content = "";
  if (settingsTab==="profile") {
    content = `
    <div class="profile-av-wrap">
      <label class="av-upload-btn">
        ${buildAvatar(name,photo,80)}
        <div class="av-edit-badge">📷</div>
        <input type="file" accept="image/*" onchange="uploadAvatar(this)"/>
      </label>
      <div style="font-size:13px;color:var(--hint);">Нажмите для смены фото</div>
    </div>
    <div class="settings-section">
      <h3>Личные данные</h3>
      <div class="settings-card">
        <div class="form-group"><label class="form-label">Отображаемое имя</label><input class="form-input" value="${esc(profileForm.displayName)}" oninput="updProfileForm('displayName',this.value)" maxlength="64" placeholder="Ваше имя"/></div>
        <div class="form-group"><label class="form-label">Bio</label><textarea class="form-input" oninput="updProfileForm('bio',this.value)" maxlength="200" rows="3" placeholder="Расскажите о себе..." style="resize:none;">${esc(profileForm.bio)}</textarea></div>
        <div class="form-group" style="margin-bottom:0;"><label class="form-label">Email</label><input class="form-input" value="${esc(user?.email||"")}" disabled style="opacity:0.5;"/></div>
      </div>
      <button class="save-btn" onclick="saveProfile()" ${saving?"disabled":""}>${saving?"⏳ Сохранение...":saveOk?"✅ Сохранено!":"💾 Сохранить"}</button>
    </div>
    <button class="logout-btn" onclick="doLogout()">🚪 Выйти из аккаунта</button>`;
  }
  if (settingsTab==="appearance") {
    content = `
    <div class="settings-section">
      <h3>Тема оформления</h3>
      <div class="theme-grid">
        <div class="theme-option ${theme==="dark"?"selected":""}" onclick="changeTheme('dark')">
          <div class="theme-option-label">🌙 Тёмная</div>
          <div class="theme-option-sub">Тёмный фон</div>
          ${theme==="dark"?"<div style='color:var(--accent);margin-top:6px;font-size:13px;'>✓ Активна</div>":""}
        </div>
        <div class="theme-option ${theme==="light"?"selected":""}" onclick="changeTheme('light')">
          <div class="theme-option-label">☀️ Светлая</div>
          <div class="theme-option-sub">Светлый фон</div>
          ${theme==="light"?"<div style='color:var(--accent);margin-top:6px;font-size:13px;'>✓ Активна</div>":""}
        </div>
      </div>
    </div>
    <div class="settings-section">
      <h3>Интерфейс</h3>
      <div class="settings-card">
        <div class="toggle-row"><span class="toggle-row-label">Компактный режим</span><button class="toggle"><div class="toggle-knob"></div></button></div>
        <div class="toggle-row"><span class="toggle-row-label">Анимации</span><button class="toggle"><div class="toggle-knob"></div></button></div>
      </div>
    </div>`;
  }
  if (settingsTab==="privacy") {
    const blocked = state.profile?.blockedUsers || [];
    content = `
    <div class="settings-section">
      <h3>Заблокированные (${blocked.length})</h3>
      <div class="settings-card">
        ${blocked.length===0?`<div style="text-align:center;padding:16px;color:var(--hint);font-size:14px;">🔒 Нет заблокированных</div>`:blocked.map(uid=>`<div class="blocked-item"><div style="flex:1;color:var(--text);font-size:14px;">${uid}</div><button class="unblock-btn" onclick="doUnblock('${uid}')">Разблокировать</button></div>`).join("")}
      </div>
    </div>
    <div class="settings-section">
      <h3>Безопасность</h3>
      <div class="settings-card" style="font-size:13px;color:var(--hint);line-height:1.8;">
        🔐 Firebase Authentication<br>
        🔒 Шифрование данных<br>
        🛡️ Защита от брутфорса<br>
        📱 Сессии по токенам
      </div>
    </div>`;
  }
  if (settingsTab==="notifications") {
    content = `
    <div class="settings-section">
      <h3>Уведомления</h3>
      <div class="settings-card">
        <div class="toggle-row"><span class="toggle-row-label">Push-уведомления</span><button class="toggle" onclick="reqNotif()"><div class="toggle-knob"></div></button></div>
        <div class="toggle-row"><span class="toggle-row-label">Звук сообщений</span><button class="toggle"><div class="toggle-knob"></div></button></div>
        <div class="toggle-row"><span class="toggle-row-label">Превью в уведомлении</span><button class="toggle"><div class="toggle-knob"></div></button></div>
      </div>
    </div>`;
  }

  return `
  <div class="settings-overlay" onclick="closeSettings()">
    <div class="settings-modal" onclick="event.stopPropagation()">
      <div class="settings-header">
        <h2>⚙️ Настройки</h2>
        <button class="icon-btn" onclick="closeSettings()">✕</button>
      </div>
      <div class="settings-body">
        <div class="settings-nav">
          ${tabs.map(([id,icon,label])=>`<button class="settings-nav-btn ${settingsTab===id?"active":""}" onclick="setSettingsTab('${id}')"><span>${icon}</span><span>${label}</span></button>`).join("")}
        </div>
        <div class="settings-content">${content}</div>
      </div>
    </div>
  </div>`;
}

function buildCtxMenu() {
  const {ctxMenu} = state;
  return `
  <div class="ctx-menu" style="top:${ctxMenu.y}px;left:${ctxMenu.x}px;" id="ctx-menu">
    <button class="ctx-item" onclick="replyToMsg('${ctxMenu.msgId}');closeCtx()">↩ Ответить</button>
    ${ctxMenu.isOwn?`<button class="ctx-item danger" onclick="deleteMsg('${ctxMenu.msgId}',true);closeCtx()">🗑 Удалить у всех</button>`:""}
    <button class="ctx-item danger" onclick="deleteMsg('${ctxMenu.msgId}',false);closeCtx()">🗑 Удалить у себя</button>
  </div>`;
}

function esc(str) {
  return String(str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ══════════════════════════════════════
// EVENTS
// ══════════════════════════════════════
function attachEvents() {
  // Focus message input
  const inp = document.getElementById("msg-input");
  if (inp) inp.focus();
  // Close ctx on outside click
  document.addEventListener("click", e => {
    if (state.ctxMenu && !document.getElementById("ctx-menu")?.contains(e.target)) {
      setState({ctxMenu:null});
    }
    if (!e.target.closest("#menu-btn") && !e.target.closest("#hamburger-menu")) {
      const menu = document.getElementById("hamburger-menu");
      if (menu) menu.style.display = "none";
    }
  }, {once:true});
}

// ══════════════════════════════════════
// GLOBAL FUNCTIONS (called from HTML)
// ══════════════════════════════════════
window.setAuthTab = tab => setState({authTab:tab,authError:""});
window.updAuthForm = (k,v) => { state.authForm[k]=v; };
window.updProfileForm = (k,v) => { state.profileForm[k]=v; };
window.setFolder = f => setState({folder:f});
window.toggleTheme = () => { const t = state.theme==="dark"?"light":"dark"; changeTheme(t); };
window.changeTheme = t => { localStorage.setItem("tg_theme",t); setState({theme:t}); };
window.openSettings = tab => {
  state.profileForm = { displayName: state.profile?.displayName||state.user?.displayName||"", bio: state.profile?.bio||"", phone: state.profile?.phone||"" };
  setState({settingsOpen:true, settingsTab:tab||"profile"});
};
window.closeSettings = () => setState({settingsOpen:false});
window.setSettingsTab = tab => setState({settingsTab:tab});
window.clearReply = () => setState({replyTo:null});
window.toggleEmoji = () => setState({emojiOpen:!state.emojiOpen});
window.addEmoji = e => { const inp=document.getElementById("msg-input"); if(inp){inp.value+=e;inp.focus();} setState({emojiOpen:false}); };
window.closeCtx = () => setState({ctxMenu:null});
window.closeSidebar = () => setState({sidebarOpen:false});
window.toggleMenu = () => { const m=document.getElementById("hamburger-menu"); if(m) m.style.display=m.style.display==="none"||!m.style.display?"block":"none"; };

window.autoResize = el => {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight,120)+"px";
};

window.reqNotif = async () => {
  if ("Notification" in window) await Notification.requestPermission();
};

window.submitAuth = async () => {
  const {authTab,authForm} = state;
  setState({authError:"",authLoading2:true});
  try {
    if (authTab==="register") {
      if (!authForm.username.trim()) throw {message:"Введите имя пользователя"};
      if (authForm.password.length<6) throw {message:"Пароль минимум 6 символов"};
      const cred = await createUserWithEmailAndPassword(auth,authForm.email,authForm.password);
      await updateProfile(cred.user,{displayName:authForm.username});
      await setDoc(doc(db,"users",cred.user.uid),{uid:cred.user.uid,email:authForm.email,username:authForm.username,displayName:authForm.username,photoURL:null,bio:"",createdAt:serverTimestamp(),lastSeen:serverTimestamp(),online:true,blockedUsers:[]});
    } else {
      await signInWithEmailAndPassword(auth,authForm.email,authForm.password);
    }
  } catch(e) {
    const msgs = {"auth/email-already-in-use":"Email уже используется","auth/invalid-email":"Неверный email","auth/weak-password":"Пароль минимум 6 символов","auth/user-not-found":"Пользователь не найден","auth/wrong-password":"Неверный пароль","auth/invalid-credential":"Неверный email или пароль"};
    setState({authError:msgs[e.code]||e.message,authLoading2:false});
  }
};

window.doLogout = async () => {
  if (unsubChats) unsubChats();
  if (unsubMsgs) unsubMsgs();
  if (unsubTyping) unsubTyping();
  await signOut(auth);
  setState({user:null,profile:null,chats:[],messages:[],activeChatId:null,activeChat:null,settingsOpen:false});
};

window.handleSearch = async q => {
  state.searchQ = q;
  if (!q.trim()) { setState({searchResults:[]}); return; }
  const q1 = query(collection(db,"users"),where("email",">=",q),where("email","<=",q+"\uf8ff"),limit(10));
  const q2 = query(collection(db,"users"),where("username",">=",q),where("username","<=",q+"\uf8ff"),limit(10));
  const [s1,s2] = await Promise.all([getDocs(q1),getDocs(q2)]);
  const map = new Map();
  [...s1.docs,...s2.docs].forEach(d=>{ if(d.id!==state.user?.uid) map.set(d.id,{id:d.id,...d.data()}); });
  setState({searchResults:Array.from(map.values())});
};

window.openDM = async (uid,name,email,photo) => {
  state.searchQ=""; state.searchResults=[];
  const existing = state.chats.find(c=>c.type==="dm"&&c.members?.includes(uid));
  if (existing) { selectChat(existing.id); return; }
  const chatRef = await addDoc(collection(db,"chats"),{type:"dm",members:[state.user.uid,uid],createdAt:serverTimestamp(),updatedAt:serverTimestamp(),lastMessage:null,unreadCount:{}});
  await selectChat(chatRef.id);
};

window.selectChat = async id => {
  if (unsubMsgs) unsubMsgs();
  if (unsubTyping) unsubTyping();
  const chat = state.chats.find(c=>c.id===id);
  setState({activeChatId:id,activeChat:chat,messages:[],loadingMsgs:true,replyTo:null,emojiOpen:false,sidebarOpen:false});
  // Messages
  const q = query(collection(db,"chats",id,"messages"),orderBy("createdAt","asc"));
  unsubMsgs = onSnapshot(q,snap=>{
    const msgs = snap.docs.map(d=>({id:d.id,...d.data()}));
    setState({messages:msgs,loadingMsgs:false});
    scrollToBottom();
    // mark read
    const unread = msgs.filter(m=>m.senderId!==state.user?.uid&&m.status!=="read");
    if (unread.length) {
      const batch = writeBatch(db);
      unread.forEach(m=>batch.update(doc(db,"chats",id,"messages",m.id),{status:"read"}));
      batch.commit();
    }
  });
  // Typing
  unsubTyping = onSnapshot(doc(db,"chats",id),snap=>{
    const data = snap.data();
    if (!data?.typing){setState({typingUsers:[]});return;}
    const now = Date.now();
    const active = Object.entries(data.typing).filter(([uid,v])=>uid!==state.user?.uid&&v&&(now-v.at?.toMillis?.()<4000)).map(([,v])=>v.name);
    setState({typingUsers:active});
  });
};

window.sendMsg = async () => {
  const inp = document.getElementById("msg-input");
  const text = inp?.value?.trim();
  if (!text || !state.activeChatId) return;
  inp.value=""; inp.style.height="auto";
  const {activeChatId,user,replyTo} = state;
  setState({replyTo:null,emojiOpen:false});
  const msgData = {text,senderId:user.uid,senderName:user.displayName||user.email,senderPhoto:user.photoURL||null,createdAt:serverTimestamp(),status:"sent",replyTo:replyTo?{id:replyTo.id,text:replyTo.text,senderName:replyTo.senderName}:null,deletedFor:[],deleted:false};
  const msgRef = await addDoc(collection(db,"chats",activeChatId,"messages"),msgData);
  await updateDoc(doc(db,"chats",activeChatId),{lastMessage:{text,senderId:user.uid,createdAt:new Date()},updatedAt:serverTimestamp()});
  setTimeout(async()=>{await updateDoc(doc(db,"chats",activeChatId,"messages",msgRef.id),{status:"delivered"});},600);
  // stop typing
  await updateDoc(doc(db,"chats",activeChatId),{[`typing.${user.uid}`]:null}).catch(()=>{});
};

window.handleTyping = async () => {
  if (!state.activeChatId || !state.user) return;
  await updateDoc(doc(db,"chats",state.activeChatId),{[`typing.${state.user.uid}`]:{name:state.user.displayName||state.user.email,at:serverTimestamp()}}).catch(()=>{});
  if (typingTimer) clearTimeout(typingTimer);
  typingTimer = setTimeout(async()=>{
    await updateDoc(doc(db,"chats",state.activeChatId),{[`typing.${state.user.uid}`]:null}).catch(()=>{});
  },3000);
};

window.replyToMsg = id => {
  const msg = state.messages.find(m=>m.id===id);
  if (msg) setState({replyTo:msg,ctxMenu:null});
  setTimeout(()=>document.getElementById("msg-input")?.focus(),50);
};

window.deleteMsg = async (id, forAll) => {
  if (!state.activeChatId) return;
  const ref = doc(db,"chats",state.activeChatId,"messages",id);
  if (forAll) await updateDoc(ref,{text:"Сообщение удалено",deleted:true,deletedFor:[]});
  else await updateDoc(ref,{deletedFor:arrayUnion(state.user.uid)});
};

window.showMsgCtx = (e, msgId, isOwn) => {
  e.preventDefault(); e.stopPropagation();
  const x = Math.min(e.clientX, window.innerWidth-180);
  const y = Math.min(e.clientY, window.innerHeight-120);
  setState({ctxMenu:{x,y,msgId,isOwn}});
};

window.saveProfile = async () => {
  if (!state.user) return;
  setState({saving:true});
  const {displayName,bio} = state.profileForm;
  await updateProfile(auth.currentUser,{displayName:displayName.trim()});
  await updateDoc(doc(db,"users",state.user.uid),{displayName:displayName.trim(),bio:bio.trim()});
  setState({saving:false,saveOk:true,profile:{...state.profile,displayName:displayName.trim(),bio:bio.trim()}});
  setTimeout(()=>setState({saveOk:false}),2500);
};

window.uploadAvatar = async input => {
  const file = input.files?.[0];
  if (!file||!state.user) return;
  setState({saving:true});
  try {
    const storageRef = ref(storage,`avatars/${state.user.uid}`);
    await uploadBytes(storageRef,file);
    const url = await getDownloadURL(storageRef);
    await updateProfile(auth.currentUser,{photoURL:url});
    await updateDoc(doc(db,"users",state.user.uid),{photoURL:url});
    setState({saving:false,profile:{...state.profile,photoURL:url}});
  } catch(e) { setState({saving:false}); alert("Ошибка загрузки: "+e.message); }
};

window.doUnblock = async uid => {
  await updateDoc(doc(db,"users",state.user.uid),{blockedUsers:arrayRemove(uid)});
  setState({profile:{...state.profile,blockedUsers:(state.profile?.blockedUsers||[]).filter(u=>u!==uid)}});
};

function scrollToBottom() {
  setTimeout(()=>{const c=document.getElementById("msgs-container");if(c)c.scrollTop=c.scrollHeight;},50);
}

// ══════════════════════════════════════
// FIREBASE AUTH LISTENER
// ══════════════════════════════════════
onAuthStateChanged(auth, async firebaseUser => {
  if (firebaseUser) {
    // Update online status
    await updateDoc(doc(db,"users",firebaseUser.uid),{online:true,lastSeen:serverTimestamp()}).catch(()=>{});
    const snap = await getDoc(doc(db,"users",firebaseUser.uid));
    const profile = snap.exists() ? snap.data() : null;
    setState({user:firebaseUser,profile,authLoading:false,authLoading2:false,
      profileForm:{displayName:profile?.displayName||firebaseUser.displayName||"",bio:profile?.bio||"",phone:profile?.phone||""}
    });
    // Subscribe to chats
    if (unsubChats) unsubChats();
    const q = query(collection(db,"chats"),where("members","array-contains",firebaseUser.uid),orderBy("updatedAt","desc"));
    unsubChats = onSnapshot(q, async snap2 => {
      const list = await Promise.all(snap2.docs.map(async d=>{
        const data={id:d.id,...d.data()};
        if (data.type==="dm") {
          const otherId = data.members.find(m=>m!==firebaseUser.uid);
          if (otherId) {
            const us = await getDoc(doc(db,"users",otherId));
            if (us.exists()) data.otherUser=us.data();
          }
        }
        return data;
      }));
      setState({chats:list});
    });
    // Set offline on page close
    window.addEventListener("beforeunload",()=>{
      updateDoc(doc(db,"users",firebaseUser.uid),{online:false,lastSeen:serverTimestamp()}).catch(()=>{});
    });
  } else {
    if (unsubChats) unsubChats();
    setState({user:null,profile:null,authLoading:false,chats:[],messages:[],activeChatId:null,activeChat:null});
  }
});

// Initial render
render();
</script>
</body>
</html>
