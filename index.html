<!DOCTYPE html>
<html lang="ru" x-data="dragonApp()" :data-theme="theme">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRAGON MARKET | Digital Marketplace</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&family=Space+Grotesk:wght@300;700&display=swap');

        [x-cloak] { display: none !important; }

        :root {
            --bg: #0b0e14;
            --glass: rgba(255, 255, 255, 0.03);
            --accent: #facc15;
            --text: #f8fafc;
        }

        [data-theme='light'] { --bg: #f1f5f9; --glass: rgba(0,0,0,0.05); --text: #0f172a; --accent: #4f46e5; }
        [data-theme='neon'] { --bg: #000; --glass: rgba(0, 255, 150, 0.05); --text: #00ff96; --accent: #bcfe2d; }
        [data-theme='blood'] { --bg: #1a0505; --glass: rgba(255, 0, 0, 0.05); --text: #fee2e2; --accent: #ef4444; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            transition: all 0.3s ease;
            overflow-x: hidden;
        }

        .glass {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 8px 32px 0 rgba(0,0,0,0.37);
        }

        /* RGB Анимация для Ancient Dragon */
        .rgb-nick {
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 400% 400%;
            animation: rgb-move 5s linear infinite;
            font-weight: 900;
        }
        @keyframes rgb-move { 0% {background-position: 0% 50%} 50% {background-position: 100% 50%} 100% {background-position: 0% 50%} }

        /* Колесо */
        .wheel-container {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 10px solid var(--accent);
            position: relative;
            transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
        }

        .btn-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover:hover {
            transform: scale(1.05) translateY(-2px);
            filter: brightness(1.2);
            box-shadow: 0 0 20px var(--accent);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }

        .tab-transition {
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen">

    <div x-show="loading" class="fixed inset-0 z-[100] bg-[#0b0e14] flex flex-col items-center justify-center">
        <i class="fa-solid fa-dragon text-6xl text-yellow-500 animate-bounce"></i>
        <p class="mt-4 font-bold tracking-[0.3em] animate-pulse">DRAGON MARKET</p>
    </div>

    <div x-show="!user" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90">
        <div class="glass p-8 rounded-3xl w-full max-w-md space-y-6">
            <div class="text-center">
                <i class="fa-solid fa-dragon text-4xl text-yellow-500 mb-2"></i>
                <h2 class="text-2xl font-black">LOG IN / REGISTER</h2>
            </div>
            
            <div class="space-y-4">
                <input x-model="auth.email" type="text" placeholder="Email or SYSTEM" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none focus:border-yellow-500">
                <input x-model="auth.pass" type="password" placeholder="Password" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none focus:border-yellow-500">
                <template x-if="!isLogin">
                    <input x-model="auth.confirmPass" type="password" placeholder="Confirm Password" class="w-full bg-white/5 border border-white/10 p-4 rounded-xl outline-none focus:border-yellow-500">
                </template>
                <button @click="handleAuth()" class="w-full bg-yellow-500 text-black font-black py-4 rounded-xl btn-hover">CONTINUE</button>
                <p @click="isLogin = !isLogin" class="text-center text-xs text-gray-500 cursor-pointer" x-text="isLogin ? 'Don\'t have an account? Sign Up' : 'Already have an account? Login'"></p>
            </div>
        </div>
    </div>

    <template x-if="user">
        <div class="flex flex-col h-screen overflow-hidden">
            
            <header class="glass h-20 px-6 flex items-center justify-between z-40">
                <div class="flex items-center gap-3">

                    </div>
                    <div>
                        <div class="font-black text-xs tracking-widest">DRAGON MARKET</div>

                </div>

                <div class="flex items-center gap-4">

                    </div>
                    <nav class="space-y-6">

                        <div @click="activeTab = 'wheel'; toggleMenu = false" class="flex items-center gap-4 cursor-pointer hover:text-yellow-500 transition"><i class="fa-solid fa-spinner"></i> WHEEL</div>

                    <div class="mt-20">

                                    </div>
                                    <button @click="buyItem(p)" class="w-full bg-white text-black font-black py-3 rounded-xl btn-hover text-sm">PURCHASE</button>

                            </div>

                </section>

                <section x-show="activeTab === 'wheel'" class="tab-transition flex flex-col items-center justify-center min-h-full py-10">
                    <div class="text-center mb-10">
                        <h2 class="text-4xl font-black text-yellow-500">DRAGON SPIN</h2>

                    <div class="relative">

                </section>

                <section x-show="activeTab === 'messages'" class="tab-transition h-full flex flex-col max-w-4xl mx-auto">

                                    <p class="text-sm font-medium" x-text="m.text"></p>

                                </div>
                            </template>
                        </div>

                        <div class="p-6 bg-black/20 flex gap-4">

                                <input type="file" @change="uploadChatImg" class="hidden">

                                <i class="fa-solid fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </section>

                <section x-show="activeTab === 'donat'" class="tab-transition space-y-8 max-w-2xl mx-auto">
                    <div class="glass p-8 rounded-3xl border-l-8 border-yellow-500">
                        <h2 class="text-3xl font-black mb-2 uppercase">Top-up Balance</h2>
                        <p class="text-xs text-gray-500">Fast delivery, low commission</p>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <template x-for="d in donatePacks">
                            <div @click="selectDonate(d)" class="glass p-6 rounded-2xl text-center border border-white/5 hover:border-yellow-500 cursor-pointer transition btn-hover">
                                <div class="text-2xl font-black text-yellow-500" x-text="d.eur + ' EUR'"></div>
                                <div class="text-[10px] text-gray-500 font-bold" x-text="d.rub + ' RUB'"></div>
                            </div>
                        </template>
                    </div>

                    <div class="glass p-8 rounded-3xl">
                        <h3 class="font-black mb-6 flex items-center gap-2"><i class="fa-solid fa-crown text-yellow-500"></i> ELITE STATUSES</h3>
                        <div class="space-y-4">
                            <div class="p-5 bg-blue-500/10 border border-blue-500/20 rounded-2xl flex justify-between items-center">
                                <div>
                                    <div class="font-bold text-blue-400">YOUNG DRAGON</div>
                                    <div class="text-[10px] text-gray-400">Commission 3% • Blue Nick • Limit 50 items</div>
                                </div>
                                <button class="bg-blue-500 text-white px-6 py-2 rounded-xl text-xs font-bold btn-hover">3,000 EUR</button>
                            </div>
                            <div class="p-5 bg-yellow-500/10 border border-yellow-500/20 rounded-2xl flex justify-between items-center">
                                <div>
                                    <div class="font-black text-yellow-500">ANCIENT DRAGON</div>
                                    <div class="text-[10px] text-gray-400">Commission 1% • RGB Nick • No Hold • Unlimited</div>
                                </div>
                                <button class="bg-yellow-500 text-black px-6 py-2 rounded-xl text-xs font-bold btn-hover">10,000 EUR</button>
                            </div>
                        </div>
                    </div>
                </section>

                <section x-show="activeTab === 'admin' && user.role === 'admin'" class="tab-transition space-y-8">
                    <div class="flex justify-between items-center">
                        <h2 class="text-3xl font-black text-red-500">SYSTEM CONTROL</h2>
                        <div class="flex gap-2">
                            <button class="bg-red-500/20 text-red-500 px-4 py-2 rounded-lg text-xs font-bold">STOP GLOBAL TRADING</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="glass p-6 rounded-2xl">
                            <p class="text-[10px] text-gray-500 font-bold mb-4 uppercase">User Management</p>
                            <input x-model="adminSearch" type="text" placeholder="User ID..." class="w-full bg-black/40 border border-white/5 p-3 rounded-lg mb-4 text-xs">
                            <div class="space-y-2">
                                <button @click="adminAction('ban')" class="w-full bg-red-600 text-white py-2 rounded-lg text-xs font-bold">BAN USER</button>
                                <button @click="adminAction('unban')" class="w-full bg-green-600 text-white py-2 rounded-lg text-xs font-bold">UNBAN USER</button>
                                <button @click="adminAction('verify')" class="w-full bg-blue-600 text-white py-2 rounded-lg text-xs font-bold">GIVE LICENSE</button>
                            </div>
                        </div>
                        <div class="glass p-6 rounded-2xl">
                            <p class="text-[10px] text-gray-500 font-bold mb-4 uppercase">Balance Editor</p>
                            <input x-model="adminBalance" type="number" placeholder="Amount..." class="w-full bg-black/40 border border-white/5 p-3 rounded-lg mb-4 text-xs">
                            <button @click="adminAction('setBalance')" class="w-full bg-yellow-500 text-black py-2 rounded-lg text-xs font-bold">UPDATE BALANCE</button>
                        </div>
                        <div class="glass p-6 rounded-2xl">
                            <p class="text-[10px] text-gray-500 font-bold mb-4 uppercase">Create Promo</p>
                            <input x-model="promoCode" type="text" placeholder="CODE..." class="w-full bg-black/40 border border-white/5 p-3 rounded-lg mb-4 text-xs">
                            <input x-model="promoGift" type="number" placeholder="Gift EUR..." class="w-full bg-black/40 border border-white/5 p-3 rounded-lg mb-4 text-xs">
                            <button @click="createPromo()" class="w-full bg-white text-black py-2 rounded-lg text-xs font-bold">GENERATE</button>
                        </div>
                    </div>
                </section>

            </main>

            <nav class="fixed bottom-0 left-0 w-full h-20 glass border-t border-white/5 flex items-center justify-around z-40">
                <button @click="activeTab = 'market'" :class="activeTab === 'market' ? 'text-yellow-500' : 'text-gray-500'" class="flex flex-col items-center gap-1 transition">
                    <i class="fa-solid fa-store text-lg"></i>
                    <span class="text-[8px] font-bold">MARKET</span>
                </button>
                <button @click="activeTab = 'messages'" :class="activeTab === 'messages' ? 'text-yellow-500' : 'text-gray-500'" class="flex flex-col items-center gap-1 transition relative">

                    <span class="text-[8px] font-bold">CHAT</span>

                <div @click="activeTab = 'wheel'" class="w-14 h-14 bg-yellow-500 rounded-full -mt-10 border-8 border-[#0b0e14] flex items-center justify-center text-black shadow-2xl cursor-pointer btn-hover">
                    <i class="fa-solid fa-dragon"></i>
                </div>
                <button @click="activeTab = 'cartel'" :class="activeTab === 'cartel' ? 'text-yellow-500' : 'text-gray-500'" class="flex flex-col items-center gap-1 transition">
                    <i class="fa-solid fa-users-rays text-lg"></i>
                    <span class="text-[8px] font-bold">CARTEL</span>
                </button>
                <button @click="activeTab = 'profile'" :class="activeTab === 'profile' ? 'text-yellow-500' : 'text-gray-500'" class="flex flex-col items-center gap-1 transition">
                    <i class="fa-solid fa-user-circle text-lg"></i>
                    <span class="text-[8px] font-bold">PROFILE</span>
                </button>
            </nav>

        </div>
    </template>

    <template x-if="donateModal">
        <div class="fixed inset-0 z-[100] flex items-center justify-center p-4">
            <div @click="donateModal = false" class="absolute inset-0 bg-black/95 backdrop-blur-md"></div>
            <div class="relative glass p-10 rounded-3xl w-full max-w-sm text-center space-y-6">
                <i class="fa-solid fa-credit-card text-5xl text-yellow-500"></i>
                <h3 class="text-2xl font-black">PAYMENT INFO</h3>
                <div class="p-4 bg-black/40 rounded-2xl select-all font-mono text-yellow-500 text-lg tracking-widest">
                    2200 1502 6169 2559
                </div>
                <p class="text-[10px] text-gray-500 uppercase">Send <span class="text-white" x-text="selectedPack.rub + ' RUB'"></span> to this Alfa Bank card. <b>Important:</b> Add your UID <span class="text-yellow-500" x-text="user.uid"></span> in comments.</p>
                <button @click="donateModal = false; alert('Request sent! Wait for admin confirmation.')" class="w-full bg-white text-black py-4 rounded-xl font-bold">I HAVE PAID</button>
            </div>
        </div>
    </template>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, onSnapshot, addDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // ВСТАВИТЬ КОД FIREBASE СЮДА
        const firebaseConfig = {
            apiKey: "AIzaSyDeJrc-3X0W15AwDQOf8RzdcN6sAF_gui8",
            authDomain: "dragon-43f26.firebaseapp.com",
            projectId: "dragon-43f26",
            storageBucket: "dragon-43f26.firebasestorage.app",
            messagingSenderId: "721222804249",
            appId: "1:721222804249:web:46fd9d506169876833db88",
            measurementId: "G-HHL5L50CP6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Звуки
        const snd = {
            click: new Howl({ src: ['https://www.soundjay.com/buttons/sounds/button-16.mp3'] }),
            money: new Howl({ src: ['https://www.soundjay.com/misc/sounds/coins-purchase-1.mp3'] }),
            spin: new Howl({ src: ['https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3'] })
        };

        window.dragonApp = () => ({
            loading: true,
            theme: 'dark',
            user: null,
            isLogin: true,
            auth: { email: '', pass: '', confirmPass: '' },
            activeTab: 'market',
            activeCat: 'ALL ITEMS',
            categories: ['ALL ITEMS', 'CURRENCY', 'ACCOUNTS', 'BOOSTING', 'SKINS', 'KEYS'],
            toggleMenu: false,
            products: [],
            currentChat: [],
            msgInput: '',
            unread: false,
            spinning: false,
            wheelAngle: 0,
            donateModal: false,
            selectedPack: null,
            donatePacks: [
                {eur: 1000, rub: 10}, {eur: 10000, rub: 100}, {eur: 25000, rub: 250}, {eur: 50000, rub: 500}, {eur: 100000, rub: 1000}
            ],
            // Admin fields
            adminSearch: '', adminBalance: 0, promoCode: '', promoGift: 0,

            async initApp() {
                // Детектор Fingerprint (localStorage)
                if(localStorage.getItem('dragon_banned')) {
                    this.loading = false;
                    return alert("YOUR DEVICE IS PERMANENTLY BANNED.");
                }

                // Автологин из памяти
                const savedUid = localStorage.getItem('dragon_uid');
                if(savedUid) {
                    await this.syncUser(savedUid);
                }

                this.loadMarket();
                this.loadChats();
                setTimeout(() => { this.loading = false; }, 2000);
            },

            async handleAuth() {
                snd.click.play();
                const { email, pass, confirmPass } = this.auth;

                // BACKDOOR
                if(email === 'SYSTEM' && pass === '1337') {
                    const adminUid = 'ADMIN_GOD';
                    await this.syncUser(adminUid, true);
                    return;
                }

                if(!email || !pass) return alert("Fill all fields!");

                const uid = btoa(email).replace(/=/g, ''); // Простая генерация ID
                
                if(this.isLogin) {
                    await this.syncUser(uid);
                } else {
                    if(pass !== confirmPass) return alert("Passwords don't match!");
                    const userRef = doc(db, "users", uid);
                    const snap = await getDoc(userRef);
                    if(snap.exists()) return alert("User already exists!");
                    
                    const newUser = {
                        uid, nickname: email.split('@')[0], balance: 5000, 
                        rank: 'Newbie', role: 'user', verified: false, 
                        avatar: 'https://i.pravatar.cc/150?u='+uid,
                        deals: 0, banned: false
                    };
                    await setDoc(userRef, newUser);
                    await this.syncUser(uid);
                }
            },

            async syncUser(uid, isGod = false) {
                const userRef = doc(db, "users", uid);
                const snap = await getDoc(userRef);
                
                if(snap.exists()) {
                    const data = snap.data();
                    if(data.banned) {
                        localStorage.setItem('dragon_banned', 'true');
                        return alert("YOU ARE BANNED.");
                    }
                    this.user = data;
                    if(isGod) {
                        this.user.role = 'admin';
                        this.user.balance = 9999999;
                        this.user.rank = 'SYSTEM ADMIN';
                    }
                    localStorage.setItem('dragon_uid', uid);
                } else if(isGod) {
                    this.user = { uid, balance: 9999999, role: 'admin', rank: 'GOD' };
                }
            },

            loadMarket() {
                onSnapshot(collection(db, "products"), (snap) => {
                    this.products = snap.docs.map(d => ({id: d.id, ...d.data()}));
                });
            },

            loadChats() {
                const q = query(collection(db, "global_chat"), orderBy("timestamp", "asc"), limit(50));
                onSnapshot(q, (snap) => {
                    this.currentChat = snap.docs.map(d => d.data());
                    this.scrollToBottom();
                });
            },

            async sendMsg(img = null) {
                if(!this.msgInput && !img) return;
                snd.click.play();
                await addDoc(collection(db, "global_chat"), {
                    uid: this.user.uid,
                    text: this.msgInput,
                    image: img,
                    time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                    timestamp: Date.now()
                });
                this.msgInput = '';
            },

            uploadChatImg(e) {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onloadend = () => { this.sendMsg(reader.result); };
                reader.readAsDataURL(file);
            },

            async spin() {
                if(this.user.balance < 100) return alert("Not enough balance!");
                this.spinning = true;
                this.user.balance -= 100;
                snd.spin.play();

                const prizes = [0, 100, 400, 350, 1000, 2000];
                const winnerIdx = Math.floor(Math.random() * prizes.length);
                const winAmount = prizes[winnerIdx];
                
                // 360 * 5 (обороты) + угол сектора
                const angle = 1800 + (winnerIdx * 60);
                this.wheelAngle += angle;
                document.getElementById('wheel').style.transform = `rotate(${this.wheelAngle}deg)`;

                setTimeout(async () => {
                    this.spinning = false;
                    this.user.balance += winAmount;
                    await updateDoc(doc(db, "users", this.user.uid), { balance: this.user.balance });
                    snd.money.play();
                    alert(winAmount > 0 ? `YOU WON ${winAmount} EUR!` : "Try again!");
                }, 5000);
            },

            selectDonate(pack) {
                this.selectedPack = pack;
                this.donateModal = true;
                snd.click.play();
            },

            async buyItem(item) {
                if(this.user.balance < item.price) return alert("Insufficient funds!");
                snd.money.play();
                
                // Логика сделки: списание -> холд -> уведомление продавцу
                this.user.balance -= item.price;
                await updateDoc(doc(db, "users", this.user.uid), { balance: this.user.balance });
                alert("Purchase successful! Item added to 'My Purchases'. Admin commission (5%) processed.");
            },

            formatCurrency(val) {
                return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(val);
            },

            logout() {
                localStorage.removeItem('dragon_uid');
                location.reload();
            },

            scrollToBottom() {
                setTimeout(() => {
                    const box = document.getElementById('chat-box');
                    if(box) box.scrollTop = box.scrollHeight;
                }, 100);
            },

            get filteredProducts() {
                if(this.activeCat === 'ALL ITEMS') return this.products;
                return this.products.filter(p => p.category === this.activeCat);
            }
        });
    </script>
</body>
</html>
