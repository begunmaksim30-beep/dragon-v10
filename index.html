<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRAGON MARKET | V31</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, update, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // ТВОЯ КОНФИГУРАЦИЯ
        const firebaseConfig = {
            apiKey: "AIzaSyBGz_5hQEOPOgZxob9cKQggeoMnGeODkPE",
            authDomain: "dragonmarket-ef97f.firebaseapp.com",
            projectId: "dragonmarket-ef97f",
            storageBucket: "dragonmarket-ef97f.firebasestorage.app",
            messagingSenderId: "733816628492",
            appId: "1:733816628492:web:58816f9330e9f5475d1529",
            measurementId: "G-82SSHP6H11",
            databaseURL: "https://dragonmarket-ef97f-default-rtdb.firebaseio.com" 
        };

        const appFB = initializeApp(firebaseConfig);
        const db = getDatabase(appFB);
        window.fb = { db, ref, set, onValue, push, update, remove, get };
    </script>

    <style>
        :root { --p: #d946ef; --bg: #050505; --c: #121212; --b: #1e1e1e; --t: #fff; --s: #22c55e; --err: #ef4444; --gold: #ffd700; }
        
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Courier New', monospace; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--t); height: 100vh; overflow: hidden; background-size: cover; background-position: center; transition: 0.5s; }
        
        /* Рамки уровней */
        .lvl-1 { border: 2px solid #888; }
        .lvl-5 { border: 2px solid var(--s); box-shadow: 0 0 10px var(--s); }
        .lvl-10 { border: 2px solid var(--p); box-shadow: 0 0 15px var(--p); }
        .lvl-50 { border: 3px solid var(--gold); box-shadow: 0 0 20px var(--gold); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        .screen { display:none; padding: 80px 10px 100px; height: 100vh; overflow-y: auto; }
        .active { display:block; }

        .card { background: var(--c); border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 10px; position: relative; }
        
        .btn { background: var(--p); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; margin-top: 5px; display:flex; align-items:center; justify-content:center; gap:10px; }
        .btn:active { opacity: 0.8; transform: scale(0.98); }
        .btn-sec { background: var(--b); border: 1px solid #444; }
        .btn-dang { background: var(--err); }

        input, textarea, select { background: #000; border: 1px solid #444; color: var(--t); padding: 12px; border-radius: 8px; width: 100%; margin-bottom: 10px; outline: none; }
        
        /* Авторизация */
        #scr-auth { position:fixed; inset:0; background:#000; z-index:9999; display:flex; align-items:center; justify-content:center; flex-direction: column; }
        
        /* Медиа и Аватары */
        .media-cont { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 10px; display:flex; align-items:center; justify-content:center; }
        .media-cont img, .media-cont video { width: 100%; height: 100%; object-fit: cover; }
        
        .ava-box { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; background: #000; position: relative; flex-shrink: 0; }
        .ava-box img, .ava-box video { width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; }

        /* Интерфейс */
        header { position:fixed; top:0; width:100%; height:70px; background: rgba(0,0,0,0.9); border-bottom: 1px solid #333; display:flex; justify-content:space-between; align-items:center; padding:0 15px; z-index:100; }
        nav { position:fixed; bottom:0; width:100%; height:70px; background: #080808; border-top: 1px solid #333; display:flex; justify-content:space-around; align-items:center; z-index:100; }
        .nav-i { font-size: 22px; color: #555; padding: 10px; transition: 0.3s; }
        .nav-i.act { color: var(--p); transform: translateY(-5px); text-shadow: 0 0 10px var(--p); }

        /* Чат */
        .msg-bubble { max-width: 80%; padding: 10px; border-radius: 10px; font-size: 13px; margin-bottom: 5px; word-break: break-word; }
        .msg-me { background: var(--p); align-self: flex-end; margin-left: auto; }
        .msg-them { background: var(--b); align-self: flex-start; }
        .chat-row { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid #222; cursor: pointer; }
    </style>
</head>
<body>

    <div id="scr-auth">
        <div class="card" style="width: 320px; border: 2px solid var(--p);">
            <h2 style="text-align: center; margin-bottom: 20px; color: var(--p);">DRAGON V31</h2>
            <div id="auth-err" style="color: var(--err); font-size: 12px; text-align: center; margin-bottom: 10px;"></div>
            
            <input id="in-nick" placeholder="НИКНЕЙМ">
            <input id="in-pass" type="password" placeholder="ПАРОЛЬ">
            <input id="in-pass2" type="password" placeholder="ПОВТОРИТЕ ПАРОЛЬ" style="display:none;">
            
            <button class="btn" id="btn-login" onclick="sys.login()">ВОЙТИ</button>
            <button class="btn btn-sec" id="btn-reg-mode" onclick="sys.toggleReg()">РЕГИСТРАЦИЯ</button>
        </div>
        <div style="margin-top:20px; font-size:10px; color:#444;">DATABASE: EF97F | STATUS: CONNECTING...</div>
    </div>

    <header id="ui-head" style="display:none;">
        <div style="display:flex; align-items:center; gap:10px;" onclick="sys.show('prof')">
            <div class="ava-box" id="h-ava"></div>
            <div>
                <div id="h-nick" style="font-weight:bold;"></div>
                <div id="h-bal" style="color:var(--s); font-size:12px;"></div>
            </div>
        </div>
        <div style="text-align:right;">
            <div id="online-count" style="font-size:10px; color:var(--s);">ОНЛАЙН: 1</div>
            <div style="font-size:10px; color:#555;">ID: <span id="h-uid"></span></div>
        </div>
    </header>

    <nav id="ui-nav" style="display:none;">
        <i class="fa fa-shopping-cart nav-i act" onclick="sys.show('market')"></i>
        <i class="fa fa-users nav-i" onclick="sys.show('cartel')"></i>
        <i class="fa fa-comments nav-i" onclick="sys.show('chat')"></i>
        <i class="fa fa-robot nav-i" onclick="sys.show('ai')"></i>
        <i class="fa fa-user-cog nav-i" onclick="sys.show('prof')"></i>
    </nav>

    <div id="scr-market" class="screen active">
        <div style="display:flex; gap:5px; margin-bottom:15px;">
            <button class="btn" onclick="document.getElementById('mod-sell').style.display='flex'">+ ВЫЛОЖИТЬ ТОВАР</button>
        </div>
        <div id="list-market"></div>
    </div>

    <div id="scr-chat" class="screen">
        <h3>МОИ ДИАЛОГИ</h3>
        <div id="chat-list" style="margin-top:15px;"></div>
    </div>

    <div id="scr-room" class="screen" style="z-index: 200; background: var(--bg);">
        <div style="display:flex; align-items:center; gap:10px; padding-bottom:10px; border-bottom:1px solid #333;">
            <button class="btn btn-sec" style="width:40px;" onclick="sys.show('chat')"><</button>
            <h3 id="room-name">ПОЛЬЗОВАТЕЛЬ</h3>
        </div>
        <div id="room-msgs" style="height: calc(100vh - 220px); overflow-y: auto; display:flex; flex-direction:column; padding:10px 0;"></div>
        <div style="position:fixed; bottom:80px; left:10px; right:10px; display:flex; gap:10px;">
            <label class="btn btn-sec" style="width:50px;"><i class="fa fa-paperclip"></i><input type="file" hidden id="msg-file" accept="image/*,video/*"></label>
            <input id="msg-text" placeholder="Сообщение..." style="margin:0;">
            <button class="btn" style="width:50px;" onclick="chat.send()"><i class="fa fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="scr-cartel" class="screen">
        <div id="ct-none">
            <div class="card" style="text-align:center; padding:30px;">
                <i class="fa fa-shield-cat" style="font-size:50px; margin-bottom:20px; color:var(--p);"></i>
                <h3>НЕТ ГРУППИРОВКИ</h3>
                <p>Создайте свой картель за 500 $</p>
                <input id="ct-new-name" placeholder="Название картеля">
                <button class="btn" onclick="cartel.create()">СОЗДАТЬ</button>
            </div>
        </div>
        <div id="ct-exist" style="display:none;">
            <div class="card" style="border-top: 3px solid var(--p);">
                <h2 id="ct-head">НАЗВАНИЕ</h2>
                <div style="font-size:12px; color:#666;">ЛИДЕР: <span id="ct-owner"></span></div>
                <button id="btn-del-ct" class="btn btn-dang" style="margin-top:10px;" onclick="cartel.dissolve()">РАСПУСТИТЬ</button>
            </div>
            <div class="card">
                <h4>УЧАСТНИКИ</h4>
                <div id="ct-mems"></div>
                <div id="ct-admin" style="margin-top:15px; border-top:1px solid #333; padding-top:10px;">
                    <input id="add-mem-nick" placeholder="Ник игрока">
                    <button class="btn btn-sec" onclick="cartel.add()">ПРИГЛАСИТЬ</button>
                </div>
            </div>
        </div>
    </div>

    <div id="scr-prof" class="screen">
        <div class="card" style="text-align:center;">
            <div class="ava-box" id="p-ava" style="width:100px; height:100px; margin:0 auto; border: 2px solid var(--p);"></div>
            <h2 id="p-nick" style="margin-top:10px;"></h2>
            <div id="p-lvl" style="color:var(--gold); margin:5px 0; font-weight:bold;">УРОВЕНЬ 1</div>
            
            <label class="btn btn-sec" style="margin-top:15px;">
                <i class="fa fa-camera"></i> ИЗМЕНИТЬ АВАТАР (WEB P/MP4)
                <input type="file" hidden onchange="sys.uploadAva(this)" accept="image/*,video/*">
            </label>
            
            <label class="btn btn-sec">
                <i class="fa fa-image"></i> ИЗМЕНИТЬ ФОН САЙТА
                <input type="file" hidden onchange="sys.uploadBG(this)" accept="image/*">
            </label>
        </div>

        <div class="card">
            <h4>НАСТРОЙКИ ЦВЕТА</h4>
            <select onchange="document.body.style.setProperty('--p', this.value)">
                <option value="#d946ef">Неоновый Пурпур</option>
                <option value="#ef4444">Кровавый Красный</option>
                <option value="#22c55e">Хакерский Зеленый</option>
                <option value="#eab308">Золотой Элитный</option>
            </select>
            <button class="btn btn-dang" onclick="sys.logout()">ВЫЙТИ ИЗ АККАУНТА</button>
        </div>
    </div>

    <div id="scr-ai" class="screen">
        <h3>НЕЙРО-ПОДДЕРЖКА</h3>
        <div id="ai-hist" style="height:300px; overflow-y:auto; border:1px solid #333; padding:10px; margin-bottom:10px; border-radius:10px;">
            <div class="msg-bubble msg-them">Система готова. Какой у вас вопрос по площадке?</div>
        </div>
        <div style="display:flex; gap:10px;">
            <input id="ai-in" placeholder="Запрос к ИИ...">
            <button class="btn" style="width:50px;" onclick="sys.askAI()"><i class="fa fa-terminal"></i></button>
        </div>
    </div>

    <div id="mod-sell" style="position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:500; display:none; align-items:center; justify-content:center;">
        <div class="card" style="width:90%; max-width:400px;">
            <h3>НОВЫЙ ТОВАР</h3>
            <input id="s-name" placeholder="Название товара">
            <div style="display:flex; gap:5px;">
                <input id="s-price" type="number" placeholder="Цена $">
                <input id="s-stock" type="number" placeholder="Кол-во">
            </div>
            <textarea id="s-desc" placeholder="Описание товара..."></textarea>
            <label class="btn btn-sec"><i class="fa fa-upload"></i> ФОТО/ВИДЕО <input type="file" hidden id="s-file" accept="image/*,video/*"></label>
            <div style="display:flex; gap:5px; margin-top:10px;">
                <button class="btn" onclick="market.sell()">ОПУБЛИКОВАТЬ</button>
                <button class="btn btn-dang" onclick="document.getElementById('mod-sell').style.display='none'">ОТМЕНА</button>
            </div>
        </div>
    </div>

    <script>
        // --- ЯДРО СИСТЕМЫ ---
        const sys = {
            u: null,
            regMode: false,
            
            init() {
                const sess = localStorage.getItem('dr_sess_v31');
                if(sess) {
                    window.fb.get(window.fb.ref(window.fb.db, 'users/' + sess)).then(snap => {
                        if(snap.exists()) { 
                            this.u = snap.val(); 
                            this.boot(); 
                        } else { 
                            this.showAuth();
                        }
                    }).catch(e => {
                        console.error("ОШИБКА БАЗЫ:", e);
                        document.getElementById('auth-err').innerText = "ОШИБКА БАЗЫ. ПРОВЕРЬТЕ RULES!";
                        this.showAuth();
                    });
                } else {
                    this.showAuth();
                }
                this.trackOnline();
            },

            showAuth() {
                document.getElementById('scr-auth').style.display='flex';
            },

            boot() {
                document.getElementById('scr-auth').style.display='none';
                document.getElementById('ui-head').style.display='flex';
                document.getElementById('ui-nav').style.display='flex';
                if(this.u.bg) document.body.style.backgroundImage = `url(${this.u.bg})`;
                this.updUI();
                market.listen();
                cartel.listen();
                chat.listenList();
            },

            updUI() {
                if(!this.u) return;
                const n = this.u.nick;
                document.getElementById('h-nick').innerText = n.toUpperCase();
                document.getElementById('p-nick').innerText = n.toUpperCase();
                document.getElementById('h-bal').innerText = (this.u.bal || 0) + ' $';
                document.getElementById('h-uid').innerText = this.u.uid || '0000';
                
                const renderAva = (url, elId) => {
                    const el = document.getElementById(elId);
                    if(!el) return;
                    el.className = `ava-box lvl-${this.calcLvl(this.u.xp)}`;
                    let src = url || 'https://api.dicebear.com/7.x/identicon/svg?seed='+n;
                    
                    if(src.includes('data:video') || src.includes('.mp4') || src.includes('.mov') || src.includes('.webm')) {
                        el.innerHTML = `<video src="${src}" autoplay loop muted playsinline></video>`;
                    } else {
                        el.innerHTML = `<img src="${src}">`;
                    }
                };
                renderAva(this.u.ava, 'h-ava');
                renderAva(this.u.ava, 'p-ava');
                
                const lvl = this.calcLvl(this.u.xp);
                document.getElementById('p-lvl').innerText = 'УРОВЕНЬ ' + lvl + ' | XP: ' + (this.u.xp||0);
            },

            calcLvl(xp) { return Math.floor(((xp||0)/10)) + 1; },

            toggleReg() {
                this.regMode = !this.regMode;
                document.getElementById('in-pass2').style.display = this.regMode ? 'block' : 'none';
                document.getElementById('btn-login').innerText = this.regMode ? 'СОЗДАТЬ АККАУНТ' : 'ВОЙТИ';
                document.getElementById('btn-reg-mode').innerText = this.regMode ? 'ЕСТЬ АККАУНТ?' : 'РЕГИСТРАЦИЯ';
            },

            async login() {
                const n = document.getElementById('in-nick').value.toLowerCase().trim().replace(/[\.\#\$\/\[\]]/g, "_");
                const p = document.getElementById('in-pass').value;
                const err = document.getElementById('auth-err');
                
                if(!n || !p) return err.innerText = "ЗАПОЛНИТЕ ВСЕ ПОЛЯ";

                try {
                    const ref = window.fb.ref(window.fb.db, 'users/' + n);
                    const snap = await window.fb.get(ref);

                    if (this.regMode) {
                        if (snap.exists()) return err.innerText = "НИК ЗАНЯТ";
                        const p2 = document.getElementById('in-pass2').value;
                        if (p !== p2) return err.innerText = "ПАРОЛИ НЕ СОВПАДАЮТ";
                        
                        const newUser = {
                            nick: n, pass: p, bal: 5000, 
                            uid: Math.floor(10000+Math.random()*90000), 
                            xp: 0, ava: '', bg: '', created: Date.now()
                        };
                        await window.fb.set(ref, newUser);
                        this.u = newUser;
                    } else {
                        if (!snap.exists()) return err.innerText = "ПОЛЬЗОВАТЕЛЬ НЕ НАЙДЕН";
                        if (snap.val().pass !== p) return err.innerText = "НЕВЕРНЫЙ ПАРОЛЬ";
                        this.u = snap.val();
                    }
                    
                    localStorage.setItem('dr_sess_v31', this.u.nick);
                    this.boot();
                } catch (e) {
                    console.error(e);
                    err.innerText = "ОШИБКА ПОДКЛЮЧЕНИЯ";
                }
            },

            logout() { localStorage.removeItem('dr_sess_v31'); location.reload(); },

            show(id) {
                document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
                const target = document.getElementById('scr-'+id);
                if(target) target.classList.add('active');
                
                document.querySelectorAll('.nav-i').forEach(i=>i.classList.remove('act'));
                const map = {market:0, cartel:1, chat:2, ai:3, prof:4};
                if(map[id]!==undefined) document.querySelectorAll('.nav-i')[map[id]].classList.add('act');
            },

            trackOnline() {
                // Имитация счетчика (для реального нужно записывать lastSeen каждого юзера)
                setInterval(() => {
                    const count = Math.floor(Math.random() * 5) + 1;
                    document.getElementById('online-count').innerText = "ОНЛАЙН: " + count;
                }, 10000);
            },

            askAI() {
                const q = document.getElementById('ai-in').value.toLowerCase();
                const h = document.getElementById('ai-hist');
                if(!q) return;
                h.innerHTML += `<div class="msg-bubble msg-me">${q}</div>`;
                document.getElementById('ai-in').value = "";
                
                let ans = "Запрос обрабатывается...";
                if(q.includes('привет')) ans = "Приветствую, агент " + this.u.nick;
                if(q.includes('баланс') || q.includes('деньги')) ans = "Ваш текущий баланс: " + this.u.bal + " $.";
                if(q.includes('товар')) ans = "Чтобы выложить товар, используйте кнопку [+] в разделе Рынок.";

                setTimeout(() => {
                    h.innerHTML += `<div class="msg-bubble msg-them">${ans}</div>`;
                    h.scrollTop = h.scrollHeight;
                }, 600);
            },

            fileToBase64(file, cb) {
                if(file.size > 4000000) return alert("ФАЙЛ СЛИШКОМ БОЛЬШОЙ (МАКС 4МБ)");
                const r = new FileReader();
                r.onload = e => cb(e.target.result);
                r.readAsDataURL(file);
            },

            uploadAva(inp) {
                if(inp.files[0]) this.fileToBase64(inp.files[0], res => {
                    this.u.ava = res;
                    this.sync();
                    this.updUI();
                });
            },
            
            uploadBG(inp) {
                if(inp.files[0]) this.fileToBase64(inp.files[0], res => {
                    this.u.bg = res;
                    this.sync();
                    document.body.style.backgroundImage = `url(${res})`;
                });
            },

            sync() { 
                if(!this.u) return;
                window.fb.update(window.fb.ref(window.fb.db, 'users/'+this.u.nick), this.u); 
            }
        };

        // --- ЛОГИКА РЫНКА ---
        const market = {
            sell() {
                const n = document.getElementById('s-name').value;
                const p = Number(document.getElementById('s-price').value);
                const s = Number(document.getElementById('s-stock').value);
                const d = document.getElementById('s-desc').value;
                const f = document.getElementById('s-file').files[0];

                if(!n || !p) return alert("УКАЖИТЕ НАЗВАНИЕ И ЦЕНУ");

                const publish = (url) => {
                    const k = window.fb.push(window.fb.ref(window.fb.db, 'market')).key;
                    window.fb.set(window.fb.ref(window.fb.db, 'market/'+k), {
                        id: k, name: n, price: p, stock: s||1, desc: d, media: url||'', seller: sys.u.nick
                    });
                    document.getElementById('mod-sell').style.display='none';
                    sys.u.xp = (sys.u.xp||0) + 1; sys.sync();
                    sys.updUI();
                };

                if(f) sys.fileToBase64(f, publish);
                else publish('');
            },

            listen() {
                window.fb.onValue(window.fb.ref(window.fb.db, 'market'), snap => {
                    const l = document.getElementById('list-market');
                    l.innerHTML = '';
                    if(!snap.exists()) return l.innerHTML = '<div style="text-align:center; opacity:0.3;">РЫНОК ПУСТ</div>';
                    
                    Object.values(snap.val()).reverse().forEach(it => {
                        let mHtml = '';
                        if(it.media) {
                            if(it.media.includes('video') || it.media.includes('mp4')) 
                                mHtml = `<div class="media-cont"><video src="${it.media}" autoplay loop muted playsinline></video></div>`;
                            else 
                                mHtml = `<div class="media-cont"><img src="${it.media}"></div>`;
                        }

                        const el = document.createElement('div'); el.className = 'card';
                        el.innerHTML = `
                            ${mHtml}
                            <h3 style="color:var(--p)">${it.name}</h3>
                            <div style="display:flex; justify-content:space-between; margin:10px 0;">
                                <b style="color:var(--s); font-size:18px;">${it.price} $</b>
                                <span style="font-size:12px; color:#666;">ЗАПАС: ${it.stock}</span>
                            </div>
                            <p style="font-size:13px; margin-bottom:10px;">${it.desc}</p>
                            <div style="font-size:11px; color:#555;">ПРОДАВЕЦ: ${it.seller}</div>
                            <div style="display:flex; gap:5px; margin-top:10px;">
                                <button class="btn" onclick="market.buy('${it.id}')">КУПИТЬ</button>
                                <button class="btn btn-sec" onclick="chat.start('${it.seller}')"><i class="fa fa-comment"></i></button>
                                ${sys.u.nick === it.seller ? `<button class="btn btn-dang" style="width:50px;" onclick="market.del('${it.id}')"><i class="fa fa-trash"></i></button>` : ''}
                            </div>
                        `;
                        l.appendChild(el);
                    });
                });
            },

            async buy(id) {
                const s = await window.fb.get(window.fb.ref(window.fb.db, 'market/'+id));
                const it = s.val();
                if(it.seller === sys.u.nick) return alert("СВОЙ ТОВАР КУПИТЬ НЕЛЬЗЯ");
                if(sys.u.bal < it.price) return alert("НЕДОСТАТОЧНО СРЕДСТВ");

                if(confirm(`Купить ${it.name} за ${it.price}$?`)) {
                    sys.u.bal -= it.price;
                    sys.u.xp = (sys.u.xp||0) + 1;
                    sys.sync();
                    sys.updUI();
                    
                    if(it.stock > 1) {
                        window.fb.update(window.fb.ref(window.fb.db, 'market/'+id), { stock: it.stock - 1 });
                    } else {
                        window.fb.remove(window.fb.ref(window.fb.db, 'market/'+id));
                    }
                    alert("УСПЕШНО! СВЯЖИТЕСЬ С ПРОДАВЦОМ В ЧАТЕ.");
                    chat.sendSys(it.seller, `Я купил ваш товар: ${it.name}`);
                }
            },
            
            del(id) { if(confirm("Удалить товар?")) window.fb.remove(window.fb.ref(window.fb.db, 'market/'+id)); }
        };

        // --- ЛОГИКА ЧАТА ---
        const chat = {
            curr: null,
            
            start(user) {
                if(user === sys.u.nick) return;
                this.curr = [sys.u.nick, user].sort().join('_');
                this.openRoom(user);
            },

            openRoom(name) {
                sys.show('room');
                document.getElementById('room-name').innerText = name.toUpperCase();
                this.listenRoom();
            },

            listenList() {
                window.fb.onValue(window.fb.ref(window.fb.db, 'chats'), snap => {
                    const l = document.getElementById('chat-list'); l.innerHTML = '';
                    if(!snap.exists()) return;
                    
                    Object.keys(snap.val()).forEach(k => {
                        if(k.includes(sys.u.nick)) {
                            const other = k.replace(sys.u.nick, '').replace('_', '');
                            const d = document.createElement('div'); d.className = 'chat-row card';
                            d.innerHTML = `<div class="ava-box"><img src="https://api.dicebear.com/7.x/identicon/svg?seed=${other}"></div><b>${other.toUpperCase()}</b>`;
                            d.onclick = () => { chat.curr = k; chat.openRoom(other); };
                            l.appendChild(d);
                        }
                    });
                });
            },

            listenRoom() {
                if(!this.curr) return;
                window.fb.onValue(window.fb.ref(window.fb.db, 'chats/'+this.curr), snap => {
                    const c = document.getElementById('room-msgs'); c.innerHTML = '';
                    if(snap.exists()) {
                        Object.values(snap.val()).forEach(m => {
                            let content = m.txt;
                            if(m.media) {
                                if(m.media.includes('video')) content = `<video src="${m.media}" controls style="width:100%; border-radius:10px;"></video><br>` + content;
                                else content = `<img src="${m.media}" style="width:100%; border-radius:10px;"><br>` + content;
                            }
                            c.innerHTML += `<div class="msg-bubble ${m.from===sys.u.nick?'msg-me':'msg-them'}">
                                <div style="font-size:9px; opacity:0.5;">${m.from}</div>${content}
                            </div>`;
                        });
                        c.scrollTop = c.scrollHeight;
                    }
                });
            },

            send() {
                const t = document.getElementById('msg-text').value;
                const f = document.getElementById('msg-file').files[0];
                if(!t && !f) return;

                const pushMsg = (url) => {
                    window.fb.push(window.fb.ref(window.fb.db, 'chats/'+this.curr), {
                        from: sys.u.nick, txt: t, media: url||'', ts: Date.now()
                    });
                    document.getElementById('msg-text').value = '';
                    document.getElementById('msg-file').value = '';
                };

                if(f) sys.fileToBase64(f, pushMsg);
                else pushMsg('');
            },

            sendSys(to, txt) {
                const id = [sys.u.nick, to].sort().join('_');
                window.fb.push(window.fb.ref(window.fb.db, 'chats/'+id), { from: sys.u.nick, txt: txt, ts: Date.now() });
            }
        };

        // --- ЛОГИКА КАРТЕЛЕЙ ---
        const cartel = {
            listen() {
                window.fb.onValue(window.fb.ref(window.fb.db, 'cartels'), snap => {
                    const cts = snap.val() ? Object.values(snap.val()) : [];
                    const my = cts.find(c => c.mems && c.mems.some(m => m.nick === sys.u.nick));
                    
                    if(my) {
                        document.getElementById('ct-none').style.display = 'none';
                        document.getElementById('ct-exist').style.display = 'block';
                        document.getElementById('ct-head').innerText = my.name;
                        document.getElementById('ct-owner').innerText = my.owner;
                        document.getElementById('ct-mems').innerHTML = my.mems.map(m => `
                            <div style="padding:10px; border-bottom:1px solid #222;">${m.nick.toUpperCase()}</div>
                        `).join('');
                        document.getElementById('btn-del-ct').style.display = (my.owner === sys.u.nick) ? 'block' : 'none';
                    } else {
                        document.getElementById('ct-none').style.display = 'block';
                        document.getElementById('ct-exist').style.display = 'none';
                    }
                });
            },

            create() {
                const n = document.getElementById('ct-new-name').value;
                if(!n || sys.u.bal < 500) return alert("НУЖНО 500 $");
                sys.u.bal -= 500; sys.sync();
                const k = window.fb.push(window.fb.ref(window.fb.db, 'cartels')).key;
                window.fb.set(window.fb.ref(window.fb.db, 'cartels/'+k), {
                    id: k, name: n, owner: sys.u.nick, mems: [{nick: sys.u.nick}]
                });
            },

            add() {
                const target = document.getElementById('add-mem-nick').value.toLowerCase();
                window.fb.get(window.fb.ref(window.fb.db, 'cartels')).then(snap => {
                    const cts = Object.values(snap.val() || {});
                    const my = cts.find(c => c.owner === sys.u.nick);
                    if(my) {
                        my.mems.push({nick: target});
                        window.fb.update(window.fb.ref(window.fb.db, 'cartels/'+my.id), { mems: my.mems });
                        alert("ДОБАВЛЕН");
                    }
                });
            },

            dissolve() {
                if(confirm("Удалить картель?")) {
                    window.fb.get(window.fb.ref(window.fb.db, 'cartels')).then(snap => {
                        const my = Object.values(snap.val()).find(c => c.owner === sys.u.nick);
                        if(my) window.fb.remove(window.fb.ref(window.fb.db, 'cartels/'+my.id));
                    });
                }
            }
        };

        window.onload = () => sys.init();
    </script>
</body>
</html>
