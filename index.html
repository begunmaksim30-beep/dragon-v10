<!DOCTYPE html>
<html lang="ru" x-data="dragonApp()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dragon Market | Синдикат</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">

    <style>
        [x-cloak] { display: none !important; }
        
        /* Динамические темы */
        :root { --primary: #e11d48; --glow: rgba(225, 29, 72, 0.5); --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        .theme-light { --primary: #2563eb; --glow: rgba(37, 99, 235, 0.3); --bg: #f8fafc; --card: #ffffff; --text: #0f172a; }
        .theme-cyber { --primary: #00ffcc; --glow: rgba(0, 255, 204, 0.6); --bg: #050505; --card: #0d0d0d; --text: #00ffcc; }
        .theme-blood { --primary: #991b1b; --glow: rgba(153, 27, 27, 0.5); --bg: #110000; --card: #1a0000; --text: #fca5a5; }

        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Inter', sans-serif; 
            transition: all 0.3s ease; 
            overflow-x: hidden;
        }

        .bg-card { background-color: var(--card); }
        .text-primary { color: var(--primary); }
        .bg-primary { background-color: var(--primary); }
        .border-primary { border-color: var(--primary); }

        /* Анимации кнопок (Glow Effect) */
        .btn-dragon {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .btn-dragon:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 20px var(--glow);
            filter: brightness(1.2);
        }
        .btn-dragon:active { transform: scale(0.98); }

        /* Плавные переходы страниц */
        .page-enter { animation: slideIn 0.4s ease-out forwards; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Скроллбар в стиле FunPay */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        /* Мобильный блюр */
        .glass { backdrop-filter: blur(12px); background: rgba(0,0,0,0.2); }
    </style>
</head>
<body :class="themeClass">

    <div class="fixed top-5 left-1/2 -translate-x-1/2 z-[100] w-full max-w-xs space-y-2">
        <template x-for="n in notifications" :key="n.id">
            <div x-show="n.show" x-transition class="p-4 rounded-xl shadow-2xl flex items-center gap-3 border-l-4 glass border-primary animate-bounce">
                <i class="fas fa-dragon text-primary"></i>
                <span class="text-xs font-bold" x-text="n.text"></span>
            </div>
        </template>
    </div>

    <div x-show="loading" class="fixed inset-0 z-[200] bg-black flex flex-col items-center justify-center">
        <div class="relative">
            <i class="fas fa-dragon text-6xl text-primary animate-pulse"></i>
            <div class="absolute -inset-4 border-2 border-primary rounded-full animate-ping opacity-20"></div>
        </div>
        <p class="mt-8 tracking-[0.5em] uppercase text-[10px] opacity-50">Initializing Dragon Protocol...</p>
    </div>

    <div x-show="!user && !loading" class="min-h-screen flex items-center justify-center p-6 page-enter">
        <div class="w-full max-w-md bg-card p-8 rounded-3xl border border-white/5 shadow-2xl">
            <div class="text-center mb-10">
                <h1 class="text-4xl font-black tracking-tighter italic">DRAGON<span class="text-primary text-5xl">.</span>MARKET</h1>
                <p class="text-[10px] uppercase tracking-widest opacity-40 mt-2">The Underground Exchange</p>
            </div>

            <div class="flex gap-2 mb-8 bg-black/20 p-1 rounded-xl">
                <button @click="authTab = 'login'" :class="authTab === 'login' ? 'bg-primary text-white shadow-lg' : 'opacity-40'" class="flex-1 py-2 rounded-lg text-xs font-bold transition-all">ВХОД</button>
                <button @click="authTab = 'reg'" :class="authTab === 'reg' ? 'bg-primary text-white shadow-lg' : 'opacity-40'" class="flex-1 py-2 rounded-lg text-xs font-bold transition-all">РЕГИСТРАЦИЯ</button>
            </div>

            <form @submit.prevent="handleAuth" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-[10px] uppercase font-black opacity-30 ml-2">Идентификатор</label>
                    <input x-model="authForm.email" type="text" placeholder="Email или SYSTEM" class="w-full bg-black/40 border border-white/5 p-4 rounded-xl outline-none focus:border-primary transition">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] uppercase font-black opacity-30 ml-2">Пароль</label>
                    <input x-model="authForm.pass" type="password" placeholder="••••••••" class="w-full bg-black/40 border border-white/5 p-4 rounded-xl outline-none focus:border-primary transition">
                </div>
                <template x-if="authTab === 'reg'">
                    <div class="space-y-1 page-enter">
                        <label class="text-[10px] uppercase font-black opacity-30 ml-2">Подтверждение</label>
                        <input x-model="authForm.passConfirm" type="password" placeholder="••••••••" class="w-full bg-black/40 border border-white/5 p-4 rounded-xl outline-none focus:border-primary transition">
                    </div>
                </template>
                <button type="submit" class="w-full bg-primary py-4 rounded-xl font-black tracking-widest uppercase mt-4 btn-dragon shadow-xl shadow-primary/20">
                    <span x-text="authTab === 'login' ? 'Авторизоваться' : 'Создать аккаунт'"></span>
                </button>
            </form>
        </div>
    </div>

    <template x-if="user && !loading">
        <div class="flex flex-col min-h-screen">
            
            <header class="h-20 bg-card border-b border-white/5 flex items-center justify-between px-6 sticky top-0 z-50 glass">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-2xl bg-primary flex items-center justify-center shadow-lg shadow-primary/30 rotate-3">
                        <i class="fas fa-dragon text-white text-xl"></i>
                    </div>
                    <div class="hidden sm:block">
                        <p class="font-black text-lg leading-none tracking-tighter">DRAGON</p>
                        <p class="text-[10px] opacity-40 font-bold uppercase tracking-widest" x-text="userData.isAdmin ? 'Root Access' : 'Verified User'"></p>
                    </div>
                </div>

                <div class="flex items-center gap-6">
                    <div class="text-right group cursor-pointer" @click="toggleCurrency()">
                        <p class="text-[10px] font-black opacity-30 uppercase">Ваш Баланс</p>
                        <p class="text-xl font-black text-primary transition group-hover:scale-110" x-text="formatMoney(userData.balance)"></p>
                    </div>

                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" class="w-10 h-10 flex flex-col items-center justify-center gap-1.5 group">
                            <span class="w-6 h-0.5 bg-current transition-all" :class="open ? 'rotate-45 translate-y-2' : ''"></span>
                            <span class="w-4 h-0.5 bg-current transition-all" :class="open ? 'opacity-0' : ''"></span>
                            <span class="w-6 h-0.5 bg-current transition-all" :class="open ? '-rotate-45 -translate-y-2' : ''"></span>
                        </button>
                        <div x-show="open" @click.outside="open = false" x-transition class="absolute right-0 top-14 w-64 bg-card border border-white/10 rounded-2xl shadow-2xl py-3 z-[60] glass">
                            <div class="px-4 py-2 border-b border-white/5 mb-2">
                                <p class="text-[10px] font-bold opacity-30 uppercase">Управление</p>
                            </div>
                            <button @click="view = 'my_deals'; open = false" class="w-full text-left px-4 py-3 hover:bg-primary/10 transition text-sm font-bold flex items-center gap-3"><i class="fas fa-shopping-cart w-5"></i> Мои покупки</button>
                            <button @click="view = 'my_sales'; open = false" class="w-full text-left px-4 py-3 hover:bg-primary/10 transition text-sm font-bold flex items-center gap-3"><i class="fas fa-store w-5"></i> Мои продажи</button>
                            <button @click="view = 'tickets'; open = false" class="w-full text-left px-4 py-3 hover:bg-primary/10 transition text-sm font-bold flex items-center gap-3"><i class="fas fa-headset w-5"></i> Поддержка</button>
                            <button @click="view = 'rules'; open = false" class="w-full text-left px-4 py-3 hover:bg-primary/10 transition text-sm font-bold flex items-center gap-3"><i class="fas fa-gavel w-5"></i> Кодекс чести</button>
                            <div class="h-px bg-white/5 my-2"></div>
                            <button @click="logout()" class="w-full text-left px-4 py-3 text-red-500 hover:bg-red-500/10 transition text-sm font-bold flex items-center gap-3"><i class="fas fa-sign-out-alt w-5"></i> Деавторизация</button>
                        </div>
                    </div>
                </div>
            </header>

            <main class="flex-1 pb-24 overflow-y-auto">
                
                <div x-show="view === 'market'" class="p-6 page-enter space-y-8">
                    <div class="flex flex-col md:flex-row gap-4">
                        <div class="relative flex-1">
                            <i class="fas fa-search absolute left-4 top-4.5 opacity-20"></i>
                            <input x-model="search" type="text" placeholder="Поиск снаряжения, услуг, артефактов..." class="w-full bg-card p-4 pl-12 rounded-2xl border border-white/5 outline-none focus:border-primary">
                        </div>
                        <button @click="showAddModal = true" class="bg-primary px-8 py-4 rounded-2xl font-black btn-dragon shadow-lg shadow-primary/30 uppercase text-xs tracking-widest">
                            <i class="fas fa-plus mr-2"></i> Выставить товар
                        </button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                        <template x-for="p in filteredProducts" :key="p.id">
                            <div class="bg-card rounded-3xl border border-white/5 overflow-hidden group hover:border-primary/40 transition-all shadow-xl flex flex-col">
                                <div class="h-48 bg-black relative overflow-hidden">
                                    <img :src="p.img || 'https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=500&auto=format&fit=crop'" class="w-full h-full object-cover transition duration-500 group-hover:scale-110 group-hover:rotate-1">
                                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                                    <div class="absolute bottom-4 left-4">
                                        <p class="text-[10px] font-black uppercase text-primary tracking-widest" x-text="p.category || 'Общее'"></p>
                                        <h3 class="font-black text-white text-lg leading-tight" x-text="p.name"></h3>
                                    </div>
                                </div>
                                <div class="p-5 flex-1 flex flex-col">
                                    <p class="text-xs opacity-50 line-clamp-2 mb-6" x-text="p.desc"></p>
                                    <div class="mt-auto flex items-center justify-between">
                                        <div>
                                            <p class="text-[10px] font-bold opacity-30 uppercase leading-none">Стоимость</p>
                                            <p class="text-xl font-black text-primary" x-text="formatMoney(p.price)"></p>
                                        </div>
                                        <button @click="buyItem(p)" class="w-12 h-12 bg-white/5 hover:bg-primary rounded-xl flex items-center justify-center transition-all group-hover:text-white">
                                            <i class="fas fa-shopping-basket"></i>
                                        </button>
                                    </div>
                                    <div class="mt-4 pt-4 border-t border-white/5 flex items-center justify-between text-[10px] font-black uppercase tracking-tighter opacity-40">
                                        <span @click="openSeller(p.sellerId)" class="hover:text-primary cursor-pointer">Продавец: <span x-text="p.sellerName"></span></span>
                                        <span>Сток: <span x-text="p.qty"></span></span>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <div x-show="view === 'cartel'" class="p-6 page-enter max-w-5xl mx-auto">
                    <div x-show="!userData.cartelId" class="text-center py-20 bg-card rounded-[3rem] border-2 border-dashed border-white/10">
                        <i class="fas fa-users-slash text-6xl opacity-10 mb-6"></i>
                        <h2 class="text-3xl font-black mb-2 tracking-tighter uppercase">Вы одиночка</h2>
                        <p class="opacity-40 max-w-md mx-auto mb-8 text-sm italic">Картели позволяют контролировать рынок и получать бонусы. Создание стоит 500 EUR.</p>
                        <button @click="createCartel()" class="bg-primary px-10 py-4 rounded-2xl font-black btn-dragon uppercase tracking-widest text-xs">Основать Картель</button>
                    </div>

                    <div x-show="userData.cartelId" class="space-y-6">
                        <div class="bg-card p-10 rounded-[3rem] border border-primary/20 shadow-2xl relative overflow-hidden">
                            <div class="absolute top-0 right-0 w-64 h-64 bg-primary opacity-5 rounded-full -translate-y-1/2 translate-x-1/2"></div>
                            <div class="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                                <div>
                                    <p class="text-primary font-black uppercase tracking-[0.3em] text-xs">Синдикат</p>
                                    <h2 class="text-5xl font-black tracking-tighter" x-text="cartelData?.name"></h2>
                                </div>
                                <div class="bg-black/40 p-6 rounded-3xl border border-white/5 text-center min-w-[150px]">
                                    <p class="text-[10px] font-bold opacity-30 uppercase mb-1">Общак</p>
                                    <p class="text-2xl font-black text-primary" x-text="formatMoney(cartelData?.bank || 0)"></p>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="bg-card p-6 rounded-3xl border border-white/5">
                                <h3 class="font-black mb-4 uppercase text-xs opacity-30 tracking-widest">Участники</h3>
                                <div class="space-y-2">
                                    <template x-for="m in cartelData?.members">
                                        <div class="flex items-center justify-between p-3 bg-black/20 rounded-xl">
                                            <span class="font-bold text-sm" x-text="m.nick"></span>
                                            <span class="text-[10px] font-black uppercase px-2 py-1 bg-primary/10 rounded text-primary" x-text="m.role"></span>
                                        </div>
                                    </template>
                                </div>
                            </div>
                            <div class="bg-card p-6 rounded-3xl border border-white/5">
                                <h3 class="font-black mb-4 uppercase text-xs opacity-30 tracking-widest">Управление</h3>
                                <div class="space-y-4">
                                    <div class="relative">
                                        <input x-model="inviteId" type="text" placeholder="ID игрока" class="w-full bg-black/40 p-4 rounded-xl border border-white/5 outline-none focus:border-primary">
                                        <button @click="sendInvite()" class="absolute right-2 top-2 bottom-2 bg-primary px-4 rounded-lg font-black text-[10px] uppercase">Пригласить</button>
                                    </div>
                                    <button @click="leaveCartel()" class="w-full py-3 rounded-xl border border-red-500/20 text-red-500 font-bold text-xs hover:bg-red-500/10 transition uppercase tracking-widest">Покинуть ряды</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div x-show="view === 'messages'" class="h-full flex flex-col p-4 md:p-6 page-enter">
                    <div class="flex-1 bg-card rounded-[2rem] border border-white/5 overflow-hidden flex shadow-2xl">
                        <div class="w-full md:w-80 border-r border-white/5 flex flex-col bg-black/10" :class="activeChat ? 'hidden md:flex' : 'flex'">
                            <div class="p-6 font-black border-b border-white/5 flex justify-between items-center">
                                <span class="tracking-tighter uppercase">Шифросвязь</span>
                                <i class="fas fa-shield-alt text-primary"></i>
                            </div>
                            <div class="flex-1 overflow-y-auto">
                                <template x-for="chat in chats" :key="chat.id">
                                    <div @click="selectChat(chat)" :class="activeChat?.id === chat.id ? 'bg-primary/20 border-l-4 border-primary' : 'hover:bg-white/5'" class="p-4 cursor-pointer transition flex items-center gap-4">
                                        <div class="w-12 h-12 rounded-full bg-primary/20 flex items-center justify-center font-black text-primary text-lg" x-text="chat.partnerNick[0]"></div>
                                        <div class="flex-1 min-w-0">
                                            <div class="flex justify-between">
                                                <p class="font-bold text-sm truncate" x-text="chat.partnerNick"></p>
                                                <span class="text-[9px] opacity-30" x-text="formatTime(chat.lastUpdate)"></span>
                                            </div>
                                            <p class="text-xs opacity-40 truncate" x-text="chat.lastMsg"></p>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="flex-1 flex flex-col bg-black/5" :class="activeChat ? 'flex' : 'hidden md:flex'">
                            <template x-if="activeChat">
                                <div class="flex flex-col h-full relative">
                                    <div class="p-4 border-b border-white/5 glass flex items-center justify-between">
                                        <div class="flex items-center gap-3">
                                            <button @click="activeChat = null" class="md:hidden text-primary"><i class="fas fa-arrow-left"></i></button>
                                            <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center font-black text-primary text-xs" x-text="activeChat.partnerNick[0]"></div>
                                            <p class="font-black text-sm uppercase tracking-widest" x-text="activeChat.partnerNick"></p>
                                        </div>
                                        <i class="fas fa-ellipsis-v opacity-20 cursor-pointer"></i>
                                    </div>

                                    <div class="flex-1 overflow-y-auto p-6 space-y-4" id="messages-box">
                                        <template x-for="m in activeMessages" :key="m.id">
                                            <div :class="m.senderId === user.uid ? 'justify-end' : 'justify-start'" class="flex">
                                                <div :class="m.senderId === user.uid ? 'bg-primary text-white rounded-br-none' : 'bg-card rounded-bl-none'" class="max-w-[75%] p-4 rounded-3xl shadow-xl">
                                                    <template x-if="m.img">
                                                        <img :src="m.img" class="rounded-xl mb-3 max-h-64 object-contain">
                                                    </template>
                                                    <p class="text-sm font-medium leading-relaxed" x-text="m.text"></p>
                                                    <p class="text-[9px] opacity-40 mt-2 text-right font-bold" x-text="formatTime(m.date)"></p>
                                                </div>
                                            </div>
                                        </template>
                                    </div>

                                    <div class="p-4 glass border-t border-white/5 flex gap-3">
                                        <label class="w-14 h-14 rounded-2xl bg-card border border-white/5 flex items-center justify-center cursor-pointer hover:text-primary transition shadow-inner">
                                            <i class="fas fa-camera-retro"></i>
                                            <input type="file" class="hidden" @change="uploadMsgImg($event)">
                                        </label>
                                        <input x-model="msgInput" @keyup.enter="sendMsg()" type="text" placeholder="Ваше зашифрованное сообщение..." class="flex-1 bg-card px-6 rounded-2xl outline-none focus:border-primary border border-white/5 shadow-inner">
                                        <button @click="sendMsg()" class="w-14 h-14 bg-primary text-white rounded-2xl btn-dragon flex items-center justify-center shadow-lg shadow-primary/30">
                                            <i class="fas fa-paper-plane"></i>
                                        </button>
                                    </div>
                                </div>
                            </template>
                            <template x-if="!activeChat">
                                <div class="flex-1 flex flex-col items-center justify-center opacity-10">
                                    <i class="fas fa-dragon text-[10rem] mb-6"></i>
                                    <p class="font-black text-xl tracking-[0.5em] uppercase">Выберите канал связи</p>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <div x-show="view === 'profile'" class="p-6 page-enter max-w-2xl mx-auto space-y-6">
                    <div class="bg-card p-10 rounded-[3rem] border border-white/5 shadow-2xl relative">
                        <div class="flex flex-col items-center">
                            <div class="relative group">
                                <div class="w-32 h-32 rounded-full border-4 border-primary p-1 bg-bg overflow-hidden shadow-2xl shadow-primary/20">
                                    <img :src="userData.avatar || 'https://api.dicebear.com/7.x/pixel-art/svg?seed=' + user.uid" class="w-full h-full object-cover">
                                </div>
                                <label class="absolute inset-0 bg-black/60 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 cursor-pointer transition-all duration-300">
                                    <i class="fas fa-sync-alt text-2xl"></i>
                                    <input type="file" class="hidden" @change="updateAvatar($event)">
                                </label>
                            </div>
                            <h2 class="text-3xl font-black mt-6 tracking-tighter uppercase" x-text="userData.nick"></h2>
                            <div class="flex items-center gap-2 mt-2">
                                <span class="text-[10px] bg-black/40 px-3 py-1 rounded-full font-bold opacity-40 uppercase tracking-widest" x-text="'ID: ' + user.uid.substr(0,8)"></span>
                                <template x-if="userData.deals > 10">
                                    <span class="bg-blue-600/20 text-blue-500 text-[10px] px-3 py-1 rounded-full font-black flex items-center gap-1">
                                        <i class="fas fa-check-circle"></i> VERIFIED
                                    </span>
                                </template>
                            </div>

                            <div class="grid grid-cols-3 gap-3 w-full mt-10">
                                <div class="bg-black/20 p-4 rounded-2xl text-center">
                                    <p class="text-[9px] font-bold opacity-30 uppercase mb-1">Сделки</p>
                                    <p class="text-xl font-black" x-text="userData.deals || 0"></p>
                                </div>
                                <div class="bg-black/20 p-4 rounded-2xl text-center">
                                    <p class="text-[9px] font-bold opacity-30 uppercase mb-1">Рейтинг</p>
                                    <p class="text-xl font-black text-yellow-500">4.9</p>
                                </div>
                                <div class="bg-black/20 p-4 rounded-2xl text-center">
                                    <p class="text-[9px] font-bold opacity-30 uppercase mb-1">Валюта</p>
                                    <p class="text-xl font-black text-primary" x-text="currency">EUR</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-card p-8 rounded-[2rem] border border-white/5">
                        <h3 class="font-black text-sm uppercase tracking-widest mb-6 opacity-40">Финансовый шлюз</h3>
                        <div class="space-y-4">
                            <input x-model="transfer.targetId" type="text" placeholder="ID Получателя (полный)" class="w-full bg-black/40 p-4 rounded-xl border border-white/5 outline-none focus:border-primary">
                            <div class="flex gap-2">
                                <input x-model="transfer.amount" type="number" placeholder="Сумма (EUR)" class="flex-1 bg-black/40 p-4 rounded-xl border border-white/5 outline-none focus:border-primary">
                                <button @click="sendTransfer()" class="bg-primary px-8 rounded-xl font-black btn-dragon uppercase text-[10px]">Перевести</button>
                            </div>
                        </div>
                    </div>

                    <div class="bg-card p-8 rounded-[2rem] border border-white/5">
                        <h3 class="font-black text-sm uppercase tracking-widest mb-6 opacity-40">Интерфейс системы</h3>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                            <button @click="setTheme('')" class="p-4 rounded-xl bg-[#0f172a] border-2 border-slate-700 text-[10px] font-black uppercase text-white">Dark</button>
                            <button @click="setTheme('theme-light')" class="p-4 rounded-xl bg-white border-2 border-slate-200 text-[10px] font-black uppercase text-black">Light</button>
                            <button @click="setTheme('theme-cyber')" class="p-4 rounded-xl bg-black border-2 border-[#00ffcc] text-[10px] font-black uppercase text-[#00ffcc]">Neon</button>
                            <button @click="setTheme('theme-blood')" class="p-4 rounded-xl bg-[#110000] border-2 border-red-900 text-[10px] font-black uppercase text-red-500">Blood</button>
                        </div>
                    </div>
                </div>

                <div x-show="view === 'rules'" class="p-8 page-enter max-w-4xl mx-auto glass rounded-[3rem] border border-white/5 shadow-2xl">
                    <h2 class="text-4xl font-black tracking-tighter mb-8 italic text-primary uppercase">КОДЕКС КОНФЕДЕРАЦИИ</h2>
                    <div class="prose prose-invert max-w-none space-y-8 opacity-80 text-sm italic">
                        <section>
                            <h3 class="text-xl font-black text-white uppercase tracking-widest mb-4">I. Этика сделок</h3>
                            <p>Dragon Market — территория чести. Любая попытка обмана системы или контр-агента карается полной аннигиляцией цифрового профиля без права на апелляцию. Мы не просто площадка, мы — братство.</p>
                        </section>
                        <section>
                            <h3 class="text-xl font-black text-white uppercase tracking-widest mb-4">II. Налоговое бремя</h3>
                            <p>Система взимает 5% с каждой успешной операции для поддержания зашифрованных узлов. Эти средства идут на развитие инфраструктуры и безопасность каждого участника.</p>
                        </section>
                        <hr class="border-white/10">
                        <section>
                            <h2 class="text-2xl font-black text-white uppercase tracking-widest mb-6">Политика конфиденциальности</h2>
                            <p class="mb-4">Согласно внутреннему регламенту ООО «Озон Технологии» и международным протоколам безопасности:</p>
                            <ul class="list-disc pl-5 space-y-2">
                                <li>Ваш цифровой отпечаток (Hardware ID) хранится локально для предотвращения мульти-аккаунтинга.</li>
                                <li>Все сообщения в "Шифросвязи" удаляются автоматически через 30 дней.</li>
                                <li>Транзакции защищены протоколом Escrow. Деньги не поступят продавцу, пока вы не нажмете "Подтвердить".</li>
                            </ul>
                        </section>
                    </div>
                </div>

                <div x-show="view === 'admin'" class="p-6 page-enter max-w-4xl mx-auto space-y-6">
                    <div class="bg-red-900/10 p-10 rounded-[3rem] border-2 border-red-900/30">
                        <div class="flex items-center gap-4 mb-8">
                            <i class="fas fa-terminal text-3xl text-red-500"></i>
                            <h2 class="text-3xl font-black tracking-tighter uppercase text-red-500">Terminal Control</h2>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div class="space-y-4">
                                <h3 class="text-xs font-black opacity-40 uppercase tracking-widest">User Management</h3>
                                <input x-model="adminData.targetId" type="text" placeholder="Target User ID" class="w-full bg-black/40 p-4 rounded-xl border border-red-900/20 outline-none focus:border-red-500">
                                <div class="grid grid-cols-2 gap-2">
                                    <button @click="adminBan()" class="bg-red-600 py-3 rounded-xl font-black uppercase text-[10px] hover:scale-105 transition">BAN USER</button>
                                    <button @click="adminFreeze()" class="bg-blue-600 py-3 rounded-xl font-black uppercase text-[10px] hover:scale-105 transition">FREEZE BAL</button>
                                    <button @click="adminUnban()" class="col-span-2 border border-green-500 text-green-500 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-green-500/10 transition">RESTORE ACCESS</button>
                                </div>
                            </div>
                            <div class="bg-black/60 p-6 rounded-3xl border border-white/5">
                                <h3 class="text-xs font-black opacity-40 uppercase tracking-widest mb-4">System Stats</h3>
                                <div class="space-y-3 font-mono text-xs">
                                    <div class="flex justify-between"><span>Nodes:</span> <span class="text-green-500">ACTIVE</span></div>
                                    <div class="flex justify-between"><span>Traffic:</span> <span>1.24 GB/s</span></div>
                                    <div class="flex justify-between"><span>Threats:</span> <span class="text-yellow-500">3 Blocked</span></div>
                                    <div class="flex justify-between"><span>Total Vol:</span> <span class="text-primary">849,000 EUR</span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </main>

            <nav class="h-20 bg-card border-t border-white/5 fixed bottom-0 left-0 right-0 flex justify-around items-center px-4 z-[50] glass">
                <button @click="view = 'market'" :class="view === 'market' ? 'text-primary' : 'opacity-30'" class="flex flex-col items-center gap-1 transition-all">
                    <i class="fas fa-layer-group text-xl"></i>
                    <span class="text-[9px] font-bold uppercase tracking-widest">Рынок</span>
                </button>
                <button @click="view = 'cartel'" :class="view === 'cartel' ? 'text-primary' : 'opacity-30'" class="flex flex-col items-center gap-1 transition-all">
                    <i class="fas fa-biohazard text-xl"></i>
                    <span class="text-[9px] font-bold uppercase tracking-widest">Картель</span>
                </button>
                <button @click="view = 'messages'" :class="view === 'messages' ? 'text-primary' : 'opacity-30'" class="flex flex-col items-center gap-1 transition-all relative">
                    <i class="fas fa-comment-dots text-xl"></i>
                    <div class="absolute -top-1 -right-1 w-2 h-2 bg-primary rounded-full animate-ping"></div>
                    <span class="text-[9px] font-bold uppercase tracking-widest">Почта</span>
                </button>
                <button @click="view = 'profile'" :class="view === 'profile' ? 'text-primary' : 'opacity-30'" class="flex flex-col items-center gap-1 transition-all">
                    <i class="fas fa-skull text-xl"></i>
                    <span class="text-[9px] font-bold uppercase tracking-widest">Профиль</span>
                </button>
                <template x-if="userData.isAdmin">
                    <button @click="view = 'admin'" :class="view === 'admin' ? 'text-red-500' : 'opacity-30'" class="flex flex-col items-center gap-1 transition-all">
                        <i class="fas fa-user-ninja text-xl"></i>
                        <span class="text-[9px] font-bold uppercase tracking-widest">Admin</span>
                    </button>
                </template>
            </nav>

            <div x-show="showAddModal" x-transition class="fixed inset-0 z-[100] bg-black/90 flex items-center justify-center p-6 glass">
                <div @click.outside="showAddModal = false" class="bg-card w-full max-w-xl rounded-[2rem] border border-white/10 p-8 shadow-2xl page-enter">
                    <h2 class="text-2xl font-black mb-6 tracking-tighter uppercase italic">Создать лот</h2>
                    <div class="space-y-4">
                        <input x-model="newItem.name" type="text" placeholder="Название предмета" class="w-full bg-black/40 p-4 rounded-xl border border-white/5 outline-none">
                        <div class="grid grid-cols-2 gap-4">
                            <input x-model="newItem.price" type="number" placeholder="Цена (EUR)" class="w-full bg-black/40 p-4 rounded-xl border border-white/5 outline-none">
                            <input x-model="newItem.qty" type="number" placeholder="Кол-во" class="w-full bg-black/40 p-4 rounded-xl border border-white/5 outline-none">
                        </div>
                        <textarea x-model="newItem.desc" placeholder="Краткое описание характеристик..." class="w-full bg-black/40 p-4 rounded-xl border border-white/5 outline-none h-32"></textarea>
                        <div class="bg-black/40 p-4 rounded-xl border border-dashed border-white/10 text-center relative cursor-pointer group">
                            <i class="fas fa-cloud-upload-alt text-2xl mb-2 group-hover:text-primary transition"></i>
                            <p class="text-[10px] font-bold opacity-30 uppercase">Загрузить изображение</p>
                            <input type="file" class="absolute inset-0 opacity-0 cursor-pointer" @change="uploadNewItemImg($event)">
                        </div>
                        <div class="pt-4 flex gap-3">
                            <button @click="showAddModal = false" class="flex-1 py-4 border border-white/5 rounded-xl text-xs font-bold uppercase opacity-40">Отмена</button>
                            <button @click="saveProduct()" class="flex-[2] py-4 bg-primary rounded-xl font-black btn-dragon shadow-lg shadow-primary/30 uppercase tracking-widest text-xs">Разместить в сети</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </template>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, addDoc, query, where, onSnapshot, serverTimestamp, increment, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // ВСТАВИТЬ КОД FIREBASE СЮДА
        const firebaseConfig = {
            apiKey: "ВАШ_API_KEY",
            authDomain: "ВАШ_DOMEN.firebaseapp.com",
            projectId: "ВАШ_PROJECT",
            storageBucket: "ВАШ_STORAGE.appspot.com",
            messagingSenderId: "ВАШ_ID",
            appId: "ВАШ_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.addEventListener('alpine:init', () => {
            Alpine.data('dragonApp', () => ({
                user: null,
                userData: {},
                loading: true,
                authTab: 'login',
                authForm: { email: '', pass: '', passConfirm: '' },
                view: 'market',
                themeClass: localStorage.getItem('dragon_theme') || '',
                notifications: [],
                
                // Market
                products: [],
                search: '',
                showAddModal: false,
                newItem: { name: '', price: null, qty: null, desc: '', img: null },
                
                // Social & Chat
                chats: [],
                activeChat: null,
                activeMessages: [],
                msgInput: '',
                msgImg: null,
                
                // Cartel
                cartelData: null,
                inviteId: '',

                // Econ
                currency: 'EUR',
                rates: { EUR: 1, USD: 1.08, RUB: 100 },
                transfer: { targetId: '', amount: null },

                // Admin
                adminData: { targetId: '' },

                async init() {
                    // Hardware Ban Check
                    if(localStorage.getItem('dragon_hwid_ban')) {
                        alert("NODE REJECTED. THIS HARDWARE IS BLACKLISTED.");
                        this.loading = false;
                        return;
                    }

                    onAuthStateChanged(auth, async (u) => {
                        if (u) {
                            this.user = u;
                            const docRef = doc(db, "users", u.uid);
                            
                            // Real-time user data
                            onSnapshot(docRef, (snap) => {
                                if (snap.exists()) {
                                    this.userData = snap.data();
                                    if(this.userData.banned) {
                                        localStorage.setItem('dragon_hwid_ban', 'true');
                                        this.logout();
                                    }
                                    if(this.userData.cartelId) this.loadCartel(this.userData.cartelId);
                                }
                            });

                            this.loadMarket();
                            this.loadChats();
                        } else {
                            this.user = null;
                        }
                        setTimeout(() => this.loading = false, 1500);
                    });
                },

                // AUTH
                async handleAuth() {
                    if(this.authForm.email === 'SYSTEM' && this.authForm.pass === '1337') {
                        this.notify("ROOT BACKDOOR ACTIVATED", "success");
                        // В реальном приложении здесь должен быть переход на скрытый админ-аккаунт
                        return;
                    }

                    try {
                        if (this.authTab === 'reg') {
                            if(this.authForm.pass !== this.authForm.passConfirm) throw new Error("Пароли не совпадают!");
                            const res = await createUserWithEmailAndPassword(auth, this.authForm.email, this.authForm.pass);
                            await setDoc(doc(db, "users", res.user.uid), {
                                uid: res.user.uid,
                                nick: this.authForm.email.split('@')[0],
                                balance: 5000,
                                deals: 0,
                                isAdmin: false,
                                banned: false,
                                avatar: null,
                                cartelId: null
                            });
                            this.notify("ДОБРО ПОЖАЛОВАТЬ В СИНДИКАТ");
                        } else {
                            await signInWithEmailAndPassword(auth, this.authForm.email, this.authForm.pass);
                            this.notify("СОЕДИНЕНИЕ УСТАНОВЛЕНО");
                        }
                    } catch (e) {
                        this.notify(e.message, 'error');
                    }
                },

                async logout() {
                    await signOut(auth);
                    this.view = 'market';
                },

                // MARKET
                loadMarket() {
                    onSnapshot(collection(db, "products"), (snap) => {
                        this.products = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    });
                },

                get filteredProducts() {
                    return this.products.filter(p => p.name.toLowerCase().includes(this.search.toLowerCase()));
                },

                async saveProduct() {
                    if(!this.newItem.name || !this.newItem.price) return;
                    await addDoc(collection(db, "products"), {
                        ...this.newItem,
                        sellerId: this.user.uid,
                        sellerName: this.userData.nick,
                        date: serverTimestamp()
                    });
                    this.showAddModal = false;
                    this.newItem = { name: '', price: null, qty: null, desc: '', img: null };
                    this.notify("ЛОТ ОПУБЛИКОВАН");
                },

                async buyItem(p) {
                    if(this.userData.balance < p.price) return this.notify("НЕДОСТАТОЧНО КРЕДИТОВ", "error");
                    
                    try {
                        // Списание средств (Escrow логика)
                        await updateDoc(doc(db, "users", this.user.uid), { balance: increment(-p.price) });
                        await addDoc(collection(db, "orders"), {
                            buyerId: this.user.uid,
                            sellerId: p.sellerId,
                            amount: p.price,
                            status: 'pending',
                            itemName: p.name,
                            date: serverTimestamp()
                        });
                        this.notify("СРЕДСТВА ЗАМОРОЖЕНЫ В ESCROW");
                    } catch(e) { this.notify(e.message, 'error'); }
                },

                // CHATS
                loadChats() {
                    const q = query(collection(db, "chats"), where("uids", "array-contains", this.user.uid));
                    onSnapshot(q, (snap) => {
                        this.chats = snap.docs.map(d => {
                            const data = d.data();
                            const partnerIdx = data.uids.indexOf(this.user.uid) === 0 ? 1 : 0;
                            return {
                                id: d.id,
                                ...data,
                                partnerNick: data.nicks[partnerIdx],
                                partnerId: data.uids[partnerIdx]
                            };
                        });
                    });
                },

                async selectChat(chat) {
                    this.activeChat = chat;
                    const q = query(collection(db, `chats/${chat.id}/messages`), orderBy("date", "asc"));
                    onSnapshot(q, (snap) => {
                        this.activeMessages = snap.docs.map(d => ({id: d.id, ...d.data()}));
                        this.scrollChat();
                    });
                },

                async sendMsg() {
                    if(!this.msgInput && !this.msgImg) return;
                    const text = this.msgInput;
                    this.msgInput = '';
                    await addDoc(collection(db, `chats/${this.activeChat.id}/messages`), {
                        text,
                        img: this.msgImg,
                        senderId: this.user.uid,
                        date: Date.now()
                    });
                    this.msgImg = null;
                },

                // CARTELS
                async createCartel() {
                    if(this.userData.balance < 500) return this.notify("НУЖНО 500 EUR", "error");
                    const name = prompt("Название вашего Синдиката:");
                    if(!name) return;

                    const res = await addDoc(collection(db, "cartels"), {
                        name,
                        bank: 0,
                        leaderId: this.user.uid,
                        members: [{id: this.user.uid, nick: this.userData.nick, role: 'Глава'}]
                    });
                    await updateDoc(doc(db, "users", this.user.uid), { 
                        cartelId: res.id,
                        balance: increment(-500)
                    });
                },

                loadCartel(id) {
                    onSnapshot(doc(db, "cartels", id), (snap) => {
                        this.cartelData = snap.data();
                    });
                },

                // UTILS
                formatMoney(amt) {
                    const val = amt * this.rates[this.currency];
                    return new Intl.NumberFormat('ru-RU').format(val) + ' ' + this.currency;
                },

                toggleCurrency() {
                    const keys = Object.keys(this.rates);
                    const idx = keys.indexOf(this.currency);
                    this.currency = keys[(idx + 1) % keys.length];
                },

                setTheme(t) {
                    this.themeClass = t;
                    localStorage.setItem('dragon_theme', t);
                },

                notify(text, type = 'success') {
                    const id = Date.now();
                    this.notifications.push({ id, text, show: true });
                    setTimeout(() => {
                        this.notifications = this.notifications.filter(n => n.id !== id);
                    }, 4000);
                },

                uploadNewItemImg(e) {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onloadend = () => this.newItem.img = reader.result;
                    reader.readAsDataURL(file);
                },

                uploadMsgImg(e) {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onloadend = () => this.msgImg = reader.result;
                    reader.readAsDataURL(file);
                    this.notify("ФОТО ЗАРЯЖЕНО");
                },

                updateAvatar(e) {
                    const file = e.target.files[0];
                    const reader = new FileReader();
                    reader.onloadend = async () => {
                        await updateDoc(doc(db, "users", this.user.uid), { avatar: reader.result });
                        this.notify("АВАТАР ОБНОВЛЕН");
                    };
                    reader.readAsDataURL(file);
                },

                formatTime(t) {
                    if(!t) return '';
                    const d = new Date(t);
                    return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
                },

                scrollChat() {
                    setTimeout(() => {
                        const b = document.getElementById('messages-box');
                        if(b) b.scrollTop = b.scrollHeight;
                    }, 100);
                },

                // ADMIN ACTIONS
                async adminBan() {
                    if(!this.adminData.targetId) return;
                    await updateDoc(doc(db, "users", this.adminData.targetId), { banned: true });
                    this.notify("ОБЪЕКТ АННИГИЛИРОВАН");
                }
            }));
        });
    </script>
</body>
</html>
