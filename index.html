<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRAGON ULTIMATE | CLOUD & REVIEWS</title>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, onSnapshot, addDoc, query, orderBy, where, deleteDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBGz_5hQEOPOgZxob9cKQggeoMnGeODkPE",
            authDomain: "dragonmarket-ef97f.firebaseapp.com",
            projectId: "dragonmarket-ef97f",
            storageBucket: "dragonmarket-ef97f.firebasestorage.app",
            messagingSenderId: "733816628492",
            appId: "1:733816628492:web:58816f9330e9f5475d1529",
            measurementId: "G-82SSHP6H11"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // --- GLOBAL STATE ---
        window.state = {
            user: JSON.parse(localStorage.getItem('dg_user')) || null,
            db, storage
        };

        // --- CORE FUNCTIONS ---
        const upload = async (file, path) => {
            const sRef = ref(storage, `${path}/${Date.now()}_${file.name}`);
            await uploadBytes(sRef, file);
            return await getDownloadURL(sRef);
        };

        window.processAuth = async () => {
            const nick = document.getElementById('auth-nick').value.trim();
            const pass = document.getElementById('auth-pass').value;
            const isReg = !document.getElementById('reg-box').classList.contains('hidden');

            if (nick === 'system' && pass === '1337') {
                saveUser({ nick: 'Admin', balance: 999999, isAdmin: true, id: 777 });
                return;
            }

            const uRef = doc(db, "users", nick);
            const snap = await getDoc(uRef);

            if (isReg) {
                if(snap.exists()) return alert("Ник занят!");
                const newUser = { 
                    nick, pass, balance: 5000, lvl: 1, 
                    rating: 5.0, reviews: [], notifications: [],
                    avatar: '', type: 'image', verified: false 
                };
                await setDoc(uRef, newUser);
                saveUser(newUser);
            } else {
                if(snap.exists() && snap.data().pass === pass) saveUser(snap.data());
                else alert("Ошибка доступа");
            }
        };

        function saveUser(data) {
            window.state.user = data;
            localStorage.setItem('dg_user', JSON.stringify(data));
            location.reload();
        }

        window.updateAvatar = async () => {
            const file = document.getElementById('avatar-input').files[0];
            if(!file) return;
            const url = await upload(file, "avatars");
            const type = file.type.startsWith('video') ? 'video' : 'image';
            await updateDoc(doc(db, "users", window.state.user.nick), { avatar: url, type: type });
            location.reload();
        };

        // --- MARKET & REVIEWS ---
        window.loadMarket = () => {
            onSnapshot(collection(db, "products"), (snap) => {
                const grid = document.getElementById('market-grid');
                grid.innerHTML = '';
                snap.forEach(d => {
                    const p = d.data(); const id = d.id;
                    const isVerified = p.sellerRating > 4.5 && (p.reviewCount || 0) > 10;
                    grid.innerHTML += `
                        <div class="glass p-4 rounded-[32px] group hover:border-amber-500/50 transition-all">
                            <div class="h-48 rounded-2xl overflow-hidden mb-4 relative">
                                ${p.type === 'video' ? `<video src="${p.media}" autoplay loop muted class="w-full h-full object-cover"></video>` : `<img src="${p.media}" class="w-full h-full object-cover">`}
                                <div class="absolute top-3 left-3 bg-black/60 backdrop-blur px-2 py-1 rounded-lg text-[10px] font-bold">★ ${p.sellerRating.toFixed(1)}</div>
                            </div>
                            <h3 class="font-black uppercase italic truncate">${p.name}</h3>
                            <div class="flex justify-between items-center my-2">
                                <span class="text-amber-500 font-black text-lg">${p.price} $</span>
                                <div class="flex items-center gap-1 cursor-pointer" onclick="openReviews('${p.seller}')">
                                    <span class="text-[10px] opacity-50 font-bold">${p.seller}</span>
                                    ${isVerified ? '<i class="fa fa-check-circle text-blue-400 text-[10px]"></i>' : ''}
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="buy('${id}', ${p.price}, '${p.seller}')" class="flex-1 bg-white text-black py-3 rounded-xl font-black text-[10px] hover:bg-amber-400">КУПИТЬ</button>
                                <button onclick="openReviews('${p.seller}')" class="bg-white/5 px-4 rounded-xl hover:bg-white/10"><i class="fa fa-star text-amber-500"></i></button>
                            </div>
                        </div>
                    `;
                });
            });
        };

        window.openReviews = async (sellerNick) => {
            window.activeSeller = sellerNick;
            document.getElementById('rev-modal-title').innerText = `Продавец: ${sellerNick}`;
            const snap = await getDoc(doc(db, "users", sellerNick));
            const data = snap.data();
            const list = document.getElementById('rev-list');
            list.innerHTML = (data.reviews || []).map(r => `
                <div class="bg-white/5 p-4 rounded-2xl border border-white/5 mb-3">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-amber-500 font-bold text-xs">${r.from}</span>
                        <span class="text-xs">${'★'.repeat(r.stars)}</span>
                    </div>
                    <p class="text-sm opacity-80 italic">"${r.text}"</p>
                </div>
            `).reverse().join('') || '<p class="opacity-20 text-center py-10">Отзывов пока нет. Будьте первым!</p>';
            openModal('modal-reviews');
        };

        window.postReview = async () => {
            const text = document.getElementById('rev-input').value;
            const stars = parseInt(document.getElementById('rev-stars').value);
            if(!text) return;
            
            const sRef = doc(db, "users", window.activeSeller);
            const snap = await getDoc(sRef);
            const currentReviews = snap.data().reviews || [];
            const newReviews = [...currentReviews, { from: window.state.user.nick, text, stars, date: Date.now() }];
            
            // Расчет нового рейтинга
            const avg = newReviews.reduce((acc, r) => acc + r.stars, 0) / newReviews.length;
            
            await updateDoc(sRef, { reviews: newReviews, rating: avg });
            alert("Отзыв успешно добавлен!");
            closeModal('modal-reviews');
        };

        window.createListing = async () => {
            const name = document.getElementById('p-name').value;
            const price = Number(document.getElementById('p-price').value);
            const file = document.getElementById('p-file').files[0];
            if(!name || !price || !file) return alert("Заполни всё!");

            const btn = document.getElementById('p-submit');
            btn.innerText = "ЗАГРУЗКА В ОБЛАКО...";
            btn.disabled = true;

            const url = await upload(file, "products");
            await addDoc(collection(db, "products"), {
                name, price, media: url, 
                type: file.type.startsWith('video') ? 'video' : 'image',
                seller: window.state.user.nick, 
                sellerRating: window.state.user.rating || 5.0,
                reviewCount: (window.state.user.reviews || []).length
            });
            location.reload();
        };

        // --- NOTIFICATIONS ---
        window.checkNotifs = () => {
            onSnapshot(doc(db, "users", window.state.user.nick), (snap) => {
                const count = (snap.data().notifications || []).length;
                const dot = document.getElementById('notif-dot');
                if(count > 0) dot.classList.remove('hidden');
                else dot.classList.add('hidden');
            });
        };

        window.onload = () => {
            if(window.state.user) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('u-name').innerText = window.state.user.nick;
                document.getElementById('u-bal').innerText = window.state.user.balance + " $";
                
                const avBox = document.getElementById('u-avatar');
                if(window.state.user.avatar) {
                    avBox.innerHTML = window.state.user.type === 'video' 
                        ? `<video src="${window.state.user.avatar}" autoplay loop muted class="w-full h-full object-cover"></video>`
                        : `<img src="${window.state.user.avatar}" class="w-full h-full object-cover">`;
                }
                
                window.loadMarket();
                window.checkNotifs();
            }
        };

        // --- UI UTILS ---
        window.openModal = (id) => document.getElementById(id).style.display = 'flex';
        window.closeModal = (id) => document.getElementById(id).style.display = 'none';
        window.nav = (tab) => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.getElementById('tab-' + tab).classList.remove('hidden');
        };
        window.logout = () => { localStorage.clear(); location.reload(); };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;900&display=swap');
        body { background: #080a0f; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .font-title { font-family: 'Syncopate', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
        input, select, textarea { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.1) !important; padding: 15px; border-radius: 18px; outline: none; width: 100%; transition: 0.3s; }
        input:focus { border-color: #fbbf24; box-shadow: 0 0 15px rgba(251, 191, 36, 0.2); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-32">

    <div id="auth-screen" class="fixed inset-0 z-[200] bg-[#080a0f] flex items-center justify-center p-6">
        <div class="glass p-10 rounded-[50px] w-full max-w-md text-center">
            <h1 class="text-4xl font-title italic mb-2 text-amber-500 tracking-tighter">DRAGON</h1>
            <p class="text-[9px] uppercase tracking-[0.5em] mb-12 opacity-40">Ultimate Marketplace</p>
            <div class="space-y-4">
                <input type="text" id="auth-nick" placeholder="Username">
                <input type="password" id="auth-pass" placeholder="Password">
                <div id="reg-box" class="hidden text-amber-500 text-[10px] font-black uppercase tracking-widest">New Account Mode</div>
                <button onclick="processAuth()" class="w-full bg-white text-black py-5 rounded-2xl font-black uppercase hover:bg-amber-500 transition-all">Execute</button>
                <button onclick="document.getElementById('reg-box').classList.toggle('hidden')" class="text-[10px] opacity-30 font-bold uppercase">Toggle Register</button>
            </div>
        </div>
    </div>

    <header class="p-6 sticky top-0 z-50 glass flex justify-between items-center border-b border-white/5">
        <div class="flex items-center gap-4">
            <div id="u-avatar" class="w-14 h-14 rounded-full overflow-hidden border-2 border-amber-500 bg-white/5"></div>
            <div>
                <h2 id="u-name" class="font-black italic text-xl uppercase tracking-tighter">...</h2>
                <p id="u-bal" class="text-xs text-emerald-400 font-bold tracking-widest">0 $</p>
            </div>
        </div>
        <div class="flex gap-3">
            <button onclick="openModal('modal-add')" class="bg-amber-500 text-black px-6 py-3 rounded-2xl font-black text-[10px] uppercase shadow-lg shadow-amber-500/20">Sell</button>
            <div class="relative">
                <button class="bg-white/5 w-12 h-12 rounded-2xl"><i class="fa fa-bell"></i></button>
                <div id="notif-dot" class="hidden absolute top-0 right-0 w-3 h-3 bg-red-500 rounded-full border-2 border-[#080a0f]"></div>
            </div>
        </div>
    </header>

    <main class="p-4 max-w-7xl mx-auto mt-6">
        <div id="tab-market" class="tab-content">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-3xl font-title italic uppercase">Marketplace</h2>
                <span class="text-[10px] opacity-30 font-bold uppercase tracking-[0.3em]">Live Cloud Feed</span>
            </div>
            <div id="market-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
        </div>

        <div id="tab-settings" class="tab-content hidden">
            <div class="glass p-10 rounded-[40px] max-w-2xl mx-auto space-y-8">
                <h2 class="text-3xl font-title italic uppercase">Profile</h2>
                <div class="space-y-6">
                    <div>
                        <label class="text-[10px] font-black opacity-30 uppercase ml-2">Update Avatar (WebP/Video)</label>
                        <input type="file" id="avatar-input" accept="image/webp,image/*,video/*" onchange="updateAvatar()" class="mt-2">
                    </div>
                    <button onclick="logout()" class="w-full bg-red-500/10 text-red-500 py-5 rounded-2xl font-black uppercase text-xs border border-red-500/20">Sign Out</button>
                </div>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-8 left-1/2 -translate-x-1/2 glass px-12 py-5 flex gap-20 rounded-[40px] z-[100] border border-white/10">
        <button onclick="nav('market')" class="text-amber-500 hover:scale-125 transition-all"><i class="fa fa-fire-bolt text-2xl"></i></button>
        <button onclick="nav('settings')" class="opacity-30 hover:opacity-100 hover:scale-125 transition-all"><i class="fa fa-user-ninja text-2xl"></i></button>
    </nav>

    <div id="modal-add" class="fixed inset-0 z-[150] bg-black/95 hidden items-center justify-center p-6">
        <div class="glass p-10 rounded-[50px] w-full max-w-md space-y-5 relative">
            <button onclick="closeModal('modal-add')" class="absolute top-8 right-8 opacity-20 text-2xl">&times;</button>
            <h2 class="text-2xl font-title italic uppercase">New Listing</h2>
            <input type="text" id="p-name" placeholder="Listing Title">
            <input type="number" id="p-price" placeholder="Price (USD)">
            <input type="file" id="p-file" accept="image/webp,image/*,video/*">
            <button id="p-submit" onclick="createListing()" class="w-full bg-white text-black py-5 rounded-2xl font-black uppercase mt-4">Publish Now</button>
        </div>
    </div>

    <div id="modal-reviews" class="fixed inset-0 z-[150] bg-black/95 hidden items-center justify-center p-6">
        <div class="glass p-8 rounded-[50px] w-full max-w-xl max-h-[85vh] flex flex-col space-y-4">
            <div class="flex justify-between items-center">
                <h2 id="rev-modal-title" class="text-xl font-title italic uppercase tracking-tighter">Reviews</h2>
                <button onclick="closeModal('modal-reviews')" class="text-2xl opacity-20">&times;</button>
            </div>
            <div id="rev-list" class="flex-1 overflow-y-auto no-scrollbar pr-2 border-y border-white/5 py-6"></div>
            <div class="pt-4 space-y-4">
                <textarea id="rev-input" placeholder="Ваш отзыв..." class="h-24 resize-none"></textarea>
                <div class="flex gap-4 items-center">
                    <select id="rev-stars" class="flex-1">
                        <option value="5">★★★★★ (5/5)</option>
                        <option value="4">★★★★☆ (4/5)</option>
                        <option value="3">★★★☆☆ (3/5)</option>
                        <option value="2">★★☆☆☆ (2/5)</option>
                        <option value="1">★☆☆☆☆ (1/5)</option>
                    </select>
                    <button onclick="postReview()" class="bg-amber-500 text-black px-8 py-4 rounded-2xl font-black uppercase text-[10px]">Отправить</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
