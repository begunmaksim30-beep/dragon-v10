<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRAGON V16 | ULTIMATE CLOUD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyADkxXfNqpjBaqBvP4DlkNfB_4ki7MMTSk",
            authDomain: "dragonmarket-70400.firebaseapp.com",
            databaseURL: "https://dragonmarket-70400-default-rtdb.firebaseio.com",
            projectId: "dragonmarket-70400",
            storageBucket: "dragonmarket-70400.firebasestorage.app",
            messagingSenderId: "746821202210",
            appId: "1:746821202210:web:bf35404eca9f096c3eb57b"
        };

        const appFB = initializeApp(firebaseConfig);
        const db = getDatabase(appFB);
        window.fb = { db, ref, set, onValue, push, update, remove };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;700;900&display=swap');
        
        :root { --p: #d946ef; --bg: #050505; --c: #121212; --b: #222; --t: #fff; --s: #22c55e; }
        body.light { --bg: #f0f0f0; --t: #000; --c: #fff; --b: #ddd; }
        body.gold { --p: #fbbf24; --bg: #0f0b00; --c: #1a1500; }
        
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; transition: 0.2s; }
        body { background: var(--bg); color: var(--t); height: 100vh; overflow: hidden; }
        
        .screen { display:none; padding:70px 15px 100px; height: 100vh; overflow-y: auto; }
        .active { display:block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }

        .card { background: var(--c); border: 1px solid var(--b); border-radius: 20px; padding: 15px; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .btn { background: var(--p); color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: 900; width: 100%; cursor: pointer; text-transform: uppercase; font-size: 12px; }
        .btn:active { transform: scale(0.95); opacity: 0.8; }
        
        input, select, textarea { background: rgba(0,0,0,0.2); border: 1px solid var(--b); color: var(--t); padding: 12px; border-radius: 12px; width: 100%; margin-bottom: 10px; font-size: 14px; }
        
        header { position:fixed; top:0; width:100%; height:65px; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); display: flex; justify-content: space-between; align-items:center; padding: 0 20px; z-index: 1000; border-bottom: 1px solid var(--b); }
        nav { position:fixed; bottom:15px; left:50%; transform:translateX(-50%); width:92%; height:70px; background: rgba(18,18,18,0.95); border-radius: 25px; display:flex; justify-content: space-around; align-items:center; border: 1px solid var(--b); z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.5); }
        .nav-i { font-size: 24px; color: #444; cursor:pointer; }
        .nav-i.active { color: var(--p); text-shadow: 0 0 10px var(--p); }

        .p-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .p-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 15px; background: #000; }
        
        .msg-box { height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px; }
        .m { padding: 12px; border-radius: 15px; max-width: 85%; font-size: 14px; position: relative; }
        .m.my { align-self: flex-end; background: var(--p); border-bottom-right-radius: 2px; }
        .m.to { align-self: flex-start; background: var(--b); border-bottom-left-radius: 2px; }
        
        .star { color: #fbbf24; font-size: 10px; }
        .badge { background: var(--p); font-size: 9px; padding: 2px 7px; border-radius: 5px; font-weight: 900; }
    </style>
</head>
<body id="body-main">

    <div id="scr-auth" style="position:fixed; inset:0; background:var(--bg); z-index:10000; display:flex; align-items:center; justify-content:center; padding:20px;">
        <div class="card" style="width:100%; max-width:350px; text-align:center; border:none;">
            <h1 style="font-family:'Orbitron'; color:var(--p); font-size:35px; margin-bottom:5px;">DRAGON</h1>
            <p style="font-size:10px; opacity:0.5; margin-bottom:25px;">SUPREME CLOUD V16</p>
            <input id="in-nick" placeholder="Никнейм">
            <input id="in-pass" type="password" placeholder="Пароль (123456789)">
            <button class="btn" onclick="core.login()">ВОЙТИ В СИСТЕМУ</button>
        </div>
    </div>

    <header id="ui-h" style="display:none">
        <div onclick="ui.show('prof')" style="display:flex; align-items:center; gap:10px;">
            <img id="h-ava" src="" style="width:38px; height:38px; border-radius:50%; border:2px solid var(--p);">
            <div style="line-height:1;">
                <b id="h-nick" style="font-size:14px;"></b><br>
                <small style="font-size:9px; opacity:0.5;">ONLINE</small>
            </div>
        </div>
        <div id="h-bal" style="color:var(--s); font-weight:900; font-size:18px;"></div>
    </header>

    <div id="scr-market" class="screen active">
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <button class="btn" onclick="ui.modal('add')"><i class="fa fa-plus-circle"></i> ТОВАР</button>
            <button class="btn" style="background:var(--b); width:60px;" onclick="ui.show('fav')"><i class="fa fa-heart"></i></button>
        </div>
        <div class="p-grid" id="m-list"></div>
    </div>

    <div id="scr-cart" class="screen">
        <h2 style="margin-bottom:20px;">КОРЗИНА</h2>
        <div id="c-list"></div>
        <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <span>ИТОГО:</span>
            <b id="c-total" style="color:var(--s); font-size:22px;">0 €</b>
        </div>
        <button class="btn" style="background:var(--s); height:60px;" onclick="core.buyAll()">ОПЛАТИТЬ (СБП / БАЛАНС)</button>
    </div>

    <div id="scr-chat" class="screen">
        <div id="chat-ui" style="display:none;">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px;">
                <button class="btn" style="width:40px; background:var(--b);" onclick="ui.closeChat()"><</button>
                <h3 id="chat-with-name">Чат</h3>
            </div>
            <div class="card" style="padding:5px;">
                <div id="m-render" class="msg-box"></div>
                <div style="display:flex; gap:8px; padding:10px; border-top:1px solid var(--b);">
                    <label style="background:var(--b); padding:12px; border-radius:12px; cursor:pointer;">
                        <i class="fa fa-image"></i>
                        <input type="file" hidden onchange="core.sendImg(this)">
                    </label>
                    <input id="m-in" placeholder="Сообщение..." style="margin:0;">
                    <button class="btn" style="width:50px;" onclick="core.sendMsg()"><i class="fa fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
        <div id="d-list"><h3>ДИАЛОГИ</h3><div id="d-render" style="margin-top:15px;"></div></div>
    </div>

    <div id="scr-cartel" class="screen">
        <div id="ct-none">
            <div class="card" style="text-align:center; padding:40px 20px;">
                <i class="fa fa-shield-halved" style="font-size:50px; color:var(--p); margin-bottom:20px;"></i>
                <h2>СОЗДАТЬ КАРТЕЛЬ</h2>
                <p style="opacity:0.6; margin-bottom:20px;">Цена основания: 500 <span class="cur">€</span></p>
                <input id="ct-n" placeholder="Название группировки">
                <button class="btn" onclick="core.createCt()">ОСНОВАТЬ</button>
            </div>
        </div>
        <div id="ct-active" style="display:none;">
            <div class="card" style="background: linear-gradient(45deg, var(--c), #1a1a1a);">
                <h1 id="ct-title" style="font-family:'Orbitron';"></h1>
                <button class="btn" style="background:rgba(255,0,0,0.2); color:red; margin-top:10px; width:auto; padding:5px 15px;" onclick="core.delCt()">УДАЛИТЬ КАРТЕЛЬ</button>
            </div>
            <div class="card">
                <h4>СОСТАВ КАРТЕЛЯ</h4>
                <div style="display:flex; gap:5px; margin:10px 0;">
                    <input id="ct-m-n" placeholder="Ник" style="margin:0;">
                    <input id="ct-m-r" placeholder="Должность" style="margin:0;">
                    <button class="btn" style="width:50px;" onclick="core.addMember()">+</button>
                </div>
                <div id="ct-m-list"></div>
            </div>
        </div>
    </div>

    <div id="scr-prof" class="screen">
        <div class="card" style="text-align:center;">
            <div style="position:relative; display:inline-block;">
                <img id="p-ava" src="" style="width:120px; height:120px; border-radius:50%; object-fit:cover; border:4px solid var(--p); box-shadow: 0 0 20px var(--p);">
                <label style="position:absolute; bottom:5px; right:5px; background:var(--p); width:35px; height:35px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;">
                    <i class="fa fa-camera" style="font-size:14px;"></i>
                    <input type="file" hidden onchange="core.updAva(this)">
                </label>
            </div>
            <h2 id="p-nick" style="margin-top:15px;"></h2>
            <div id="p-rating" style="margin-top:5px;"></div>
        </div>
        <div class="card">
            <h4>НАСТРОЙКИ</h4>
            Валюта: <select onchange="core.setCur(this.value)"><option value="€">EUR (€)</option><option value="$">USD ($)</option><option value="₽">RUB (₽)</option></select>
            Тема: <select onchange="ui.theme(this.value)"><option value="dark">Тёмная</option><option value="light">Светлая</option><option value="gold">Золотая</option></select>
            <button class="btn" style="background:#ff4444; margin-top:20px;" onclick="location.reload()">ВЫЙТИ ИЗ АККАУНТА</button>
        </div>
    </div>

    <div id="mod-add" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:2000; padding:25px;">
        <div class="card">
            <h3 style="margin-bottom:20px;">ВЫСТАВИТЬ ТОВАР</h3>
            <input id="p-n" placeholder="Название товара">
            <input id="p-p" type="number" placeholder="Цена">
            <input id="p-am" type="number" placeholder="Количество">
            <textarea id="p-d" placeholder="Описание товара..."></textarea>
            <label class="btn" style="background:var(--b); margin-bottom:10px;">ВЫБРАТЬ ФОТО <input type="file" id="p-f" hidden></label>
            <button class="btn" onclick="core.addP()">ОПУБЛИКОВАТЬ</button>
            <button class="btn" style="background:none; margin-top:10px;" onclick="ui.modal('add')">ОТМЕНА</button>
        </div>
    </div>

    <nav id="ui-n" style="display:none">
        <div class="nav-i active" onclick="ui.show('market')"><i class="fa fa-home"></i></div>
        <div class="nav-i" onclick="ui.show('cartel')"><i class="fa fa-users"></i></div>
        <div class="nav-i" onclick="ui.show('cart')"><i class="fa fa-shopping-basket"></i></div>
        <div class="nav-i" onclick="ui.show('chat')"><i class="fa fa-comment-dots"></i></div>
        <div class="nav-i" onclick="ui.show('prof')"><i class="fa fa-user-gear"></i></div>
    </nav>

    <script>
        const core = {
            u: null, cur: '€', items: [], cartels: [], target: null,
            login() {
                const n = document.getElementById('in-nick').value;
                const p = document.getElementById('in-pass').value;
                if(!n || p !== '123456789') return alert("Пароль: 123456789");
                
                this.u = {
                    n, id: 'ID-'+Math.floor(Math.random()*9999),
                    b: (n === 'admin' ? 25000 : 5000),
                    a: 'https://api.dicebear.com/7.x/bottts/svg?seed='+n,
                    cart: []
                };

                document.getElementById('scr-auth').style.display = 'none';
                document.getElementById('ui-h').style.display = 'flex';
                document.getElementById('ui-n').style.display = 'flex';
                this.initFB();
                this.upd();
            },
            initFB() {
                const { ref, onValue } = window.fb;
                onValue(ref(window.fb.db, 'market'), s => { this.items = s.val() ? Object.values(s.val()) : []; this.renderM(); });
                onValue(ref(window.fb.db, 'cartels'), s => { this.cartels = s.val() ? Object.values(s.val()) : []; this.renderCt(); });
            },
            upd() {
                document.getElementById('h-nick').innerText = this.u.n;
                document.getElementById('p-nick').innerText = this.u.n;
                document.getElementById('h-ava').src = this.u.a;
                document.getElementById('p-ava').src = this.u.a;
                document.getElementById('h-bal').innerText = this.u.b + ' ' + this.cur;
                document.querySelectorAll('.cur').forEach(e => e.innerText = this.cur);
            },
            renderM() {
                const l = document.getElementById('m-list');
                l.innerHTML = this.items.map((it, i) => `
                    <div class="card">
                        <img src="${it.img}" class="p-img">
                        <div style="font-weight:900; margin:8px 0; font-size:14px;">${it.n}</div>
                        <div style="color:var(--s); font-size:16px; font-weight:900;">${it.p} ${this.cur}</div>
                        <div style="font-size:10px; opacity:0.5; margin-bottom:5px;">В наличии: ${it.am} шт.</div>
                        <div class="star">★ ${it.rating || 'Нет отзывов'}</div>
                        <div style="font-size:9px; margin:8px 0;">Продавец: <b>${it.sn}</b></div>
                        <div style="display:flex; gap:5px;">
                            <button class="btn" style="padding:8px;" onclick="core.toCart(${i})"><i class="fa fa-cart-plus"></i></button>
                            <button class="btn" style="padding:8px; background:var(--b);" onclick="core.openChat('${it.sid}','${it.sn}')"><i class="fa fa-envelope"></i></button>
                            ${(this.u.n === 'admin' || this.u.id === it.sid) ? `<button class="btn" style="padding:8px; background:rgba(255,0,0,0.5);" onclick="core.delP('${it.fid}')"><i class="fa fa-trash"></i></button>` : ''}
                        </div>
                    </div>
                `).join('');
            },
            addP() {
                const n = document.getElementById('p-n').value, p = document.getElementById('p-p').value, am = document.getElementById('p-am').value, f = document.getElementById('p-f').files[0];
                if(!n || !p || !f) return alert("Заполни всё!");
                const r = new FileReader(); r.onload = (e) => {
                    const { ref, push, set } = window.fb;
                    const newR = push(ref(window.fb.db, 'market'));
                    set(newR, { n, p: Number(p), am, img: e.target.result, sid: this.u.id, sn: this.u.n, fid: newR.key, rating: 0 });
                    ui.modal('add');
                }; r.readAsDataURL(f);
            },
            delP(id) { if(confirm("Удалить товар?")) window.fb.remove(window.fb.ref(window.fb.db, 'market/'+id)); },
            toCart(i) { this.u.cart.push(this.items[i]); alert("Добавлено в корзину!"); this.renderC(); },
            renderC() {
                let t = 0;
                document.getElementById('c-list').innerHTML = this.u.cart.map((it, i) => {
                    t += Number(it.p);
                    return `<div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                        <div><b>${it.n}</b><br><small>${it.p} ${this.cur}</small></div>
                        <i class="fa fa-trash" style="color:red;" onclick="core.remC(${i})"></i>
                    </div>`;
                }).join('');
                document.getElementById('c-total').innerText = t + ' ' + this.cur;
            },
            remC(i) { this.u.cart.splice(i, 1); this.renderC(); },
            buyAll() {
                let t = 0; this.u.cart.forEach(it => t += it.p);
                if(t > 0 && this.u.b >= t) {
                    this.u.b -= t; this.u.cart = []; alert("Успешная оплата!"); this.upd(); this.renderC();
                } else alert("Недостаточно средств!");
            },
            createCt() {
                const n = document.getElementById('ct-n').value;
                if(this.u.b < 500 || !n) return alert("Нужно 500 €");
                this.u.b -= 500;
                const { ref, push, set } = window.fb;
                const newR = push(ref(window.fb.db, 'cartels'));
                set(newR, { n, owner: this.u.id, fid: newR.key, members: [{n: this.u.n, r: 'БОСС'}] });
                this.upd();
            },
            renderCt() {
                const my = this.cartels.find(c => c.owner === this.u.id || c.members.some(m => m.n === this.u.n));
                if(my) {
                    document.getElementById('ct-none').style.display='none';
                    document.getElementById('ct-active').style.display='block';
                    document.getElementById('ct-title').innerText = my.n;
                    document.getElementById('ct-m-list').innerHTML = my.members.map(m => `
                        <div class="card" style="padding:10px; font-size:12px; display:flex; justify-content:space-between;">
                            <b>${m.n}</b> <span class="badge">${m.r}</span>
                        </div>
                    `).join('');
                } else {
                    document.getElementById('ct-none').style.display='block';
                    document.getElementById('ct-active').style.display='none';
                }
            },
            addMember() {
                const n = document.getElementById('ct-m-n').value, r = document.getElementById('ct-m-r').value;
                const my = this.cartels.find(c => c.owner === this.u.id);
                if(my && n) {
                    my.members.push({n, r});
                    window.fb.update(window.fb.ref(window.fb.db, 'cartels/'+my.fid), {members: my.members});
                }
            },
            delCt() {
                const my = this.cartels.find(c => c.owner === this.u.id);
                if(my && confirm("Удалить картель?")) window.fb.remove(window.fb.ref(window.fb.db, 'cartels/'+my.fid));
            },
            openChat(sid, sn) {
                ui.show('chat');
                document.getElementById('d-list').style.display='none';
                document.getElementById('chat-ui').style.display='block';
                document.getElementById('chat-with-name').innerText = sn;
                this.target = { sid, sn };
                this.loadMsg();
            },
            sendMsg() {
                const t = document.getElementById('m-in').value; if(!t) return;
                const id = [this.u.id, this.target.sid].sort().join('_');
                window.fb.push(window.fb.ref(window.fb.db, 'chats/'+id), { t, s: this.u.n, sid: this.u.id, time: Date.now() });
                document.getElementById('m-in').value = '';
            },
            loadMsg() {
                const id = [this.u.id, this.target.sid].sort().join('_');
                window.fb.onValue(window.fb.ref(window.fb.db, 'chats/'+id), s => {
                    const m = s.val() ? Object.values(s.val()) : [];
                    document.getElementById('m-render').innerHTML = m.map(msg => `
                        <div class="m ${msg.sid === this.u.id ? 'my' : 'to'}">
                            <b>${msg.s}:</b><br>${msg.t}
                        </div>
                    `).join('');
                    document.getElementById('m-render').scrollTop = 9999;
                });
            },
            updAva(i) {
                const f = i.files[0]; const r = new FileReader();
                r.onload = (e) => { this.u.a = e.target.result; this.upd(); };
                r.readAsDataURL(f);
            },
            setCur(v) { this.cur = v; this.upd(); this.renderM(); }
        };

        const ui = {
            show(id) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById('scr-'+id).classList.add('active');
                document.querySelectorAll('.nav-i').forEach(i => i.classList.remove('active'));
                const m = {market:0, cartel:1, cart:2, chat:3, prof:4};
                document.querySelectorAll('.nav-i')[m[id]].classList.add('active');
            },
            modal(id) {
                const m = document.getElementById('mod-'+id);
                m.style.display = m.style.display === 'block' ? 'none' : 'block';
            },
            theme(v) { document.getElementById('body-main').className = v; },
            closeChat() {
                document.getElementById('d-list').style.display='block';
                document.getElementById('chat-ui').style.display='none';
            }
        };
    </script>
</body>
</html>
