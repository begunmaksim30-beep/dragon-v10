<!DOCTYPE html>
<html lang="ru"
      x-data="appData()"
      :data-theme="theme"
      :style="customBg ? `background-image:url('${customBg}');background-size:cover;background-attachment:fixed;background-position:center;` : ''">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DragonMarket — Cyberpunk Marketplace</title>

<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  DRAGONMARKET — Firebase Realtime Database Edition           ║
  ║                                                              ║
  ║  ⚠️  FIREBASE RTDB SECURITY RULES (для разработки):          ║
  ║  {                                                           ║
  ║    "rules": { ".read": true, ".write": true }               ║
  ║  }                                                           ║
  ║                                                              ║
  ║  ADMIN: login: system  |  password: 1337                     ║
  ╚══════════════════════════════════════════════════════════════╝
-->

<!-- Firebase compat SDK v10 -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<!-- Alpine.js -->
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root{--pr:#e11d48;--pr-d:#9f1239;--ac:#38bdf8;--gl:rgba(255,255,255,0.06);--gl-b:rgba(255,255,255,0.12);--bg:#05050f;}
[data-theme="matrix"]{--pr:#00ff41;--pr-d:#00aa2b;--ac:#00ffcc;}
[data-theme="blood"]{--pr:#ff1a1a;--pr-d:#cc0000;--ac:#ff6666;}
[data-theme="gold"]{--pr:#ffd700;--pr-d:#cc9900;--ac:#ffaa00;}
[data-theme="silver"]{--pr:#a8b2c8;--pr-d:#6b7a99;--ac:#e2e8f0;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:#e2e8f0;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(135deg,#05050f 0%,#0a0520 50%,#05050f 100%);z-index:-2;pointer-events:none;}
body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);background-size:40px 40px;z-index:-1;pointer-events:none;animation:gridMove 20s linear infinite;}
@keyframes gridMove{0%{background-position:0 0;}100%{background-position:40px 40px;}}
.glass{background:var(--gl);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--gl-b);}
.glass-dark{background:rgba(0,0,0,0.45);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.08);}
.neon{color:var(--pr);text-shadow:0 0 10px var(--pr),0 0 20px var(--pr);}
.btn-pr{background:var(--pr);color:#fff;border:1px solid var(--pr);transition:all .2s;font-family:'Rajdhani',sans-serif;font-weight:600;letter-spacing:.05em;cursor:pointer;}
.btn-pr:hover:not(:disabled){background:var(--pr-d);box-shadow:0 0 15px var(--pr);transform:translateY(-1px);}
.btn-pr:disabled{opacity:.5;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--pr);border:1px solid var(--pr);transition:all .2s;font-family:'Rajdhani',sans-serif;font-weight:600;cursor:pointer;}
.btn-ghost:hover{background:rgba(225,29,72,0.15);box-shadow:0 0 10px var(--pr);}
.card-hover{transition:all .3s;}
.card-hover:hover{transform:translateY(-4px);box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 20px rgba(225,29,72,.2);}
.font-orb{font-family:'Orbitron',sans-serif;}
.font-mono{font-family:'Share Tech Mono',monospace;}
.verified{color:#3b82f6;filter:drop-shadow(0 0 4px #3b82f6);}
.badge-bronze{background:linear-gradient(135deg,#cd7f32,#8b4513);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700;}
.badge-silver{background:linear-gradient(135deg,#c0c0c0,#808080);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700;}
.badge-elite{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700;}
.gold-nick{color:#ffd700;text-shadow:0 0 8px #ffd700;}
.scrollbar-thin::-webkit-scrollbar{width:4px;}
.scrollbar-thin::-webkit-scrollbar-track{background:rgba(0,0,0,.2);}
.scrollbar-thin::-webkit-scrollbar-thumb{background:var(--pr);border-radius:2px;}
.modal-enter{animation:modalIn .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes modalIn{0%{opacity:0;transform:scale(.85) translateY(20px);}100%{opacity:1;transform:scale(1) translateY(0);}}
.page-enter{animation:fadeSlide .3s ease-out;}
@keyframes fadeSlide{0%{opacity:0;transform:translateX(8px);}100%{opacity:1;transform:translateX(0);}}
.shake{animation:shake .4s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
.star-filled{color:#ffd700;}
.star-empty{color:#374151;}
input,textarea,select{font-family:'Rajdhani',sans-serif;}
input:focus,textarea:focus,select:focus{outline:2px solid var(--pr);}
.loading-screen{position:fixed;inset:0;background:#05050f;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .6s;}
.chat-me{background:rgba(225,29,72,.25);border:1px solid rgba(225,29,72,.4);border-radius:12px 12px 4px 12px;}
.chat-them{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px 12px 12px 4px;}
.notif-in{animation:nIn .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes nIn{0%{opacity:0;transform:translateX(120%);}100%{opacity:1;transform:translateX(0);}}
.wheel-pointer{position:absolute;right:-20px;top:50%;transform:translateY(-50%);width:0;height:0;border-top:14px solid transparent;border-bottom:14px solid transparent;border-left:24px solid var(--pr);filter:drop-shadow(0 0 6px var(--pr));}
@media(max-width:768px){body{padding-bottom:70px;}}
</style>
</head>

<body x-init="init()">

<!-- LOADING SCREEN -->
<div class="loading-screen" :class="{'opacity-0 pointer-events-none': !loading}">
  <svg viewBox="0 0 180 80" width="150" xmlns="http://www.w3.org/2000/svg">
    <defs><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <path d="M90,38 L76,8 L54,2 L65,22 L32,14 L54,34 L18,40 L52,50 L42,66 L70,56 L80,68 L88,42" fill="#cc0000" filter="url(#glow)"/>
    <path d="M90,38 L104,8 L126,2 L115,22 L148,14 L126,34 L162,40 L128,50 L138,66 L110,56 L100,68 L92,42" fill="#cc0000" filter="url(#glow)"/>
    <ellipse cx="90" cy="36" rx="12" ry="14" fill="#770000"/>
    <circle cx="85" cy="32" r="3" fill="#ff4400"/><circle cx="95" cy="32" r="3" fill="#ff4400"/>
  </svg>
  <div class="font-orb text-2xl neon tracking-widest">DRAGONMARKET</div>
  <div class="flex gap-1.5">
    <div class="w-2 h-2 rounded-full bg-red-500 animate-bounce" style="animation-delay:0s"></div>
    <div class="w-2 h-2 rounded-full bg-red-500 animate-bounce" style="animation-delay:.15s"></div>
    <div class="w-2 h-2 rounded-full bg-red-500 animate-bounce" style="animation-delay:.3s"></div>
  </div>
  <p x-show="dbError" class="text-red-400 text-xs max-w-xs text-center px-4" x-text="dbError"></p>
</div>

<!-- NOTIFICATIONS -->
<div class="fixed top-4 right-4 z-50 flex flex-col gap-2" style="max-width:320px;">
  <template x-for="n in notifications" :key="n.id">
    <div class="notif-in glass-dark rounded-xl p-3 flex items-start gap-3 shadow-2xl"
         :class="n.type==='success'?'border-l-4 border-green-500':n.type==='error'?'border-l-4 border-red-500':'border-l-4 border-yellow-500'">
      <i class="fas mt-0.5 text-sm" :class="n.type==='success'?'fa-check-circle text-green-400':n.type==='error'?'fa-times-circle text-red-400':'fa-info-circle text-yellow-400'"></i>
      <p class="text-sm flex-1" x-text="n.text"></p>
      <button @click="removeNotif(n.id)" class="text-gray-400 hover:text-white text-xs"><i class="fas fa-times"></i></button>
    </div>
  </template>
</div>

<!-- HEADER -->
<header class="glass-dark fixed top-0 left-0 right-0 z-40 border-b border-white/10">
  <div class="max-w-7xl mx-auto px-3 md:px-6 h-14 flex items-center justify-between gap-3">
    <button @click="page='home'" class="flex items-center gap-2 flex-shrink-0">
      <svg viewBox="0 0 120 50" width="80" xmlns="http://www.w3.org/2000/svg">
        <defs><filter id="gl1"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
        <path d="M60,25 L51,5 L36,1 L43,15 L21,9 L36,23 L12,27 L35,34 L28,44 L47,38 L54,46 L59,28" fill="var(--pr)" filter="url(#gl1)"/>
        <path d="M60,25 L69,5 L84,1 L77,15 L99,9 L84,23 L108,27 L85,34 L92,44 L73,38 L66,46 L61,28" fill="var(--pr)" filter="url(#gl1)"/>
        <ellipse cx="60" cy="24" rx="8" ry="9" fill="#880000"/>
        <circle cx="56.5" cy="21" r="2" fill="#ff4400"/><circle cx="63.5" cy="21" r="2" fill="#ff4400"/>
      </svg>
      <span class="font-orb text-sm font-bold neon hidden sm:block">DRAGON<span class="text-white">MARKET</span></span>
    </button>

    <nav class="hidden md:flex items-center gap-0.5 text-sm font-semibold">
      <button @click="page='home'" :class="page==='home'?'neon':'text-gray-400 hover:text-white'" class="px-3 py-1.5 rounded transition" x-text="t('home')"></button>
      <button @click="page='market'" :class="page==='market'?'neon':'text-gray-400 hover:text-white'" class="px-3 py-1.5 rounded transition" x-text="t('market')"></button>
      <button @click="gotoPage('messenger')" :class="page==='messenger'?'neon':'text-gray-400 hover:text-white'" class="px-3 py-1.5 rounded transition relative">
        <span x-text="t('chat')"></span>
        <span x-show="unreadCount>0" class="absolute -top-1 -right-1 bg-red-600 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center font-mono" x-text="unreadCount"></span>
      </button>
      <button @click="page='wheel'" :class="page==='wheel'?'neon':'text-gray-400 hover:text-white'" class="px-3 py-1.5 rounded transition" x-text="t('wheel')"></button>
      <button @click="page='premium'" :class="page==='premium'?'neon':'text-gray-400 hover:text-white'" class="px-3 py-1.5 rounded transition">Premium</button>
      <template x-if="currentUser && currentUser.isAdmin">
        <button @click="page='admin'" :class="page==='admin'?'neon':'text-gray-400 hover:text-white'" class="px-3 py-1.5 rounded transition" x-text="t('admin')"></button>
      </template>
    </nav>

    <div class="flex items-center gap-2 flex-shrink-0">
      <template x-if="!currentUser">
        <button @click="openAuth('login')" class="btn-pr px-4 py-1.5 rounded-lg text-sm" x-text="t('login')"></button>
      </template>
      <template x-if="currentUser">
        <div class="flex items-center gap-2">
          <div class="hidden sm:flex items-center gap-1.5 glass rounded-lg px-3 py-1.5">
            <i class="fas fa-euro-sign text-green-400 text-xs"></i>
            <span class="font-mono text-sm font-bold text-green-400" x-text="fNum(currentUser.balance)"></span>
          </div>
          <button @click="page='profile'" class="flex items-center gap-1.5 hover:opacity-80 transition">
            <div class="w-8 h-8 rounded-full border-2 overflow-hidden flex items-center justify-center text-xs font-bold"
                 :class="currentUser.premium==='elite'?'border-yellow-500':currentUser.premium==='silver'?'border-gray-400':currentUser.verified?'border-blue-500':'border-red-700'">
              <img x-show="currentUser.avatar" :src="currentUser.avatar" class="w-full h-full object-cover">
              <span x-show="!currentUser.avatar" class="neon" x-text="(currentUser.username||'?')[0].toUpperCase()"></span>
            </div>
          </button>
          <button @click="page='settings'" class="text-gray-400 hover:text-white p-1.5 rounded"><i class="fas fa-cog text-sm"></i></button>
        </div>
      </template>
    </div>
  </div>
</header>

<!-- MOBILE NAV -->
<nav class="fixed bottom-0 left-0 right-0 z-40 glass-dark border-t border-white/10 md:hidden">
  <div class="flex items-center justify-around h-16">
    <button @click="page='home'" :class="page==='home'?'neon':'text-gray-500'" class="flex flex-col items-center gap-0.5 py-2 px-3">
      <i class="fas fa-home text-base"></i><span class="text-xs font-semibold" x-text="t('home')"></span>
    </button>
    <button @click="page='market'" :class="page==='market'?'neon':'text-gray-500'" class="flex flex-col items-center gap-0.5 py-2 px-3">
      <i class="fas fa-store text-base"></i><span class="text-xs font-semibold" x-text="t('market')"></span>
    </button>
    <button @click="gotoPage('messenger')" :class="page==='messenger'?'neon':'text-gray-500'" class="flex flex-col items-center gap-0.5 py-2 px-3 relative">
      <i class="fas fa-comments text-base"></i><span class="text-xs font-semibold" x-text="t('chat')"></span>
      <span x-show="unreadCount>0" class="absolute top-1 right-1 bg-red-600 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center font-mono" x-text="unreadCount"></span>
    </button>
    <button @click="page='wheel'" :class="page==='wheel'?'neon':'text-gray-500'" class="flex flex-col items-center gap-0.5 py-2 px-3">
      <i class="fas fa-dharmachakra text-base"></i><span class="text-xs font-semibold" x-text="t('wheel')"></span>
    </button>
    <button @click="page='profile'" :class="page==='profile'?'neon':'text-gray-500'" class="flex flex-col items-center gap-0.5 py-2 px-3">
      <i class="fas fa-user text-base"></i><span class="text-xs font-semibold" x-text="t('profile')"></span>
    </button>
  </div>
</nav>

<!-- MAIN -->
<main class="pt-16 max-w-7xl mx-auto px-3 md:px-6 pb-6">

  <!-- HOME PAGE -->
  <div x-show="page==='home'" class="page-enter">
    <div class="glass rounded-2xl p-6 md:p-10 mt-4 relative overflow-hidden text-center">
      <div class="absolute inset-0 opacity-10" style="background:radial-gradient(ellipse at center,var(--pr) 0%,transparent 70%);"></div>
      <div class="relative z-10">
        <div class="font-orb text-3xl md:text-5xl font-black mb-2"><span class="neon">DRAGON</span><span class="text-white">MARKET</span></div>
        <p class="text-gray-300 text-lg mb-6" x-text="t('heroSub')"></p>
        <div class="flex flex-wrap gap-3 justify-center">
          <button @click="page='market'" class="btn-pr px-6 py-2.5 rounded-xl text-base"><i class="fas fa-store mr-2"></i><span x-text="t('browse')"></span></button>
          <button x-show="!currentUser" @click="openAuth('register')" class="btn-ghost px-6 py-2.5 rounded-xl text-base"><i class="fas fa-user-plus mr-2"></i><span x-text="t('register')"></span></button>
          <button x-show="currentUser" @click="openAddProduct()" class="btn-ghost px-6 py-2.5 rounded-xl text-base"><i class="fas fa-plus mr-2"></i><span x-text="t('addLot')"></span></button>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-3 mt-4">
      <div class="glass rounded-xl p-4 text-center">
        <div class="font-orb text-2xl font-bold neon" x-text="products.filter(p=>p.status==='active').length"></div>
        <div class="text-xs text-gray-400 mt-1" x-text="t('activeLots')"></div>
      </div>
      <div class="glass rounded-xl p-4 text-center">
        <div class="font-orb text-2xl font-bold text-green-400" x-text="usersArr.length"></div>
        <div class="text-xs text-gray-400 mt-1" x-text="t('users')"></div>
      </div>
      <div class="glass rounded-xl p-4 text-center">
        <div class="font-orb text-2xl font-bold text-blue-400" x-text="transactions.filter(t=>t.status==='completed').length"></div>
        <div class="text-xs text-gray-400 mt-1" x-text="t('deals')"></div>
      </div>
    </div>

    <h2 class="font-orb text-lg font-bold mt-6 mb-3 neon"><i class="fas fa-fire mr-2"></i><span x-text="t('latest')"></span></h2>
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
      <template x-for="p in products.filter(x=>x.status==='active').slice(0,8)" :key="p.id">
        <div class="glass card-hover rounded-xl overflow-hidden cursor-pointer" @click="openProduct(p)">
          <div class="h-32 bg-gradient-to-br from-red-900/30 to-purple-900/30 relative overflow-hidden flex items-center justify-center">
            <img x-show="p.image" :src="p.image" class="w-full h-full object-cover opacity-80">
            <i x-show="!p.image" class="fas text-4xl opacity-20" :class="catIcon(p.category)"></i>
            <div class="absolute top-2 right-2"><span class="text-xs glass rounded px-1.5 py-0.5 capitalize" x-text="t(p.category)||p.category"></span></div>
            <button @click.stop="toggleFav(p.id)" class="absolute top-2 left-2 w-7 h-7 rounded-full glass flex items-center justify-center transition hover:scale-110"
                    :class="isFav(p.id)?'text-red-500':'text-gray-400'"><i class="fas fa-heart text-xs"></i></button>
          </div>
          <div class="p-3">
            <p class="font-semibold text-sm truncate" x-text="p.title"></p>
            <div class="flex items-center justify-between mt-2">
              <span class="font-mono font-bold text-green-400 text-sm">€<span x-text="fNum(p.price)"></span></span>
              <button @click.stop="quickBuy(p)" class="btn-pr text-xs px-2.5 py-1 rounded-lg" x-text="t('buy')"></button>
            </div>
          </div>
        </div>
      </template>
    </div>
    <div x-show="products.filter(x=>x.status==='active').length===0" class="text-center py-12 text-gray-500">
      <i class="fas fa-store text-4xl mb-3 block opacity-20"></i>
      <p x-text="t('noLots')"></p>
    </div>
    <div x-show="products.filter(x=>x.status==='active').length>8" class="text-center mt-4">
      <button @click="page='market'" class="btn-ghost px-8 py-2 rounded-xl" x-text="t('viewAll')"></button>
    </div>
  </div>

  <!-- MARKET PAGE -->
  <div x-show="page==='market'" class="page-enter">
    <div class="flex flex-col md:flex-row gap-3 mt-4 mb-4">
      <div class="flex-1 relative">
        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
        <input x-model="searchQ" :placeholder="t('search')" class="w-full glass rounded-xl pl-9 pr-4 py-2.5 text-sm text-white placeholder-gray-500 border border-white/10">
      </div>
      <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-thin">
        <template x-for="c in cats" :key="c">
          <button @click="selCat=c" class="flex-shrink-0 px-3 py-2 rounded-xl text-xs font-semibold border transition"
                  :class="selCat===c?'btn-pr border-transparent':'glass border-white/10 text-gray-400 hover:text-white'">
            <i class="fas mr-1" :class="catIcon(c)"></i><span x-text="t(c)||c"></span>
          </button>
        </template>
      </div>
    </div>
    <div class="flex items-center justify-between mb-4">
      <span class="text-sm text-gray-400"><span x-text="filteredProducts.length"></span> <span x-text="t('lots')"></span></span>
      <div class="flex items-center gap-2">
        <select x-model="sortBy" class="glass rounded-lg px-3 py-1.5 text-xs text-gray-300 border border-white/10 bg-transparent">
          <option value="newest">⬇ <span x-text="t('newest')"></span></option>
          <option value="price_asc">💲 Дешевле</option>
          <option value="price_desc">💲 Дороже</option>
        </select>
        <button x-show="currentUser" @click="openAddProduct()" class="btn-pr px-3 py-1.5 rounded-xl text-xs"><i class="fas fa-plus mr-1"></i><span x-text="t('addLot')"></span></button>
      </div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
      <template x-for="p in filteredProducts" :key="p.id">
        <div class="glass card-hover rounded-xl overflow-hidden cursor-pointer" @click="openProduct(p)">
          <div class="h-32 bg-gradient-to-br from-slate-900/60 to-purple-900/30 relative overflow-hidden flex items-center justify-center">
            <img x-show="p.image" :src="p.image" class="w-full h-full object-cover opacity-80">
            <i x-show="!p.image" class="fas text-5xl opacity-20" :class="catIcon(p.category)"></i>
            <div x-show="p.status!=='active'" class="absolute inset-0 bg-black/60 flex items-center justify-center">
              <span class="font-orb text-xs font-bold" :class="p.status==='sold'?'text-red-400':'text-yellow-400'" x-text="t(p.status)"></span>
            </div>
            <div class="absolute top-2 right-2"><span class="text-xs glass rounded px-1.5 py-0.5 capitalize" x-text="t(p.category)||p.category"></span></div>
            <button @click.stop="toggleFav(p.id)" class="absolute top-2 left-2 w-7 h-7 rounded-full glass flex items-center justify-center hover:scale-110 transition"
                    :class="isFav(p.id)?'text-red-500':'text-gray-400'"><i class="fas fa-heart text-xs"></i></button>
          </div>
          <div class="p-3">
            <p class="font-semibold text-sm truncate" x-text="p.title"></p>

                  <div class="flex items-center gap-1">
                    <p class="font-semibold text-sm truncate" x-text="c.otherUser?.username||'?'"></p>

            <div x-show="myChats.length===0" class="text-center py-10 text-gray-500 text-sm"><i class="fas fa-comment-slash text-2xl mb-2 block opacity-30"></i><p x-text="t('noChats')"></p></div>
          </div>

            <div class="flex flex-col h-full">
              <div class="p-4 border-b border-white/10 flex items-center gap-3">
                <button @click="activeChat=null" class="md:hidden text-gray-400 hover:text-white mr-1"><i class="fas fa-arrow-left"></i></button>
                <div class="w-9 h-9 rounded-full border overflow-hidden flex items-center justify-center font-bold text-sm"
                     :class="activeChat.otherUser?.verified?'border-blue-500':'border-red-700'">
                  <img x-show="activeChat.otherUser?.avatar" :src="activeChat.otherUser?.avatar" class="w-full h-full object-cover">
                  <span x-show="!activeChat.otherUser?.avatar" class="neon" x-text="(activeChat.otherUser?.username||'?')[0].toUpperCase()"></span>
                </div>
                <div>
                  <p class="font-semibold flex items-center gap-1">
                    <span x-text="activeChat.otherUser?.username||'?'"></span>
                    <span x-show="activeChat.otherUser?.verified"><i class="fas fa-check-circle verified text-xs"></i></span>
                  </p>
                  <p class="text-xs text-gray-400 font-mono">ID: #<span x-text="activeChat.otherUser?.shortId||activeChat.otherUser?.id?.slice(-5)||'?'"></span></p>
                </div>

              <div class="flex-1 overflow-y-auto p-4 space-y-3 scrollbar-thin" id="chatMsgs">
                <template x-for="msg in activeChatMsgs" :key="msg.id">

                    <div class="max-w-[75%] px-3 py-2" :class="msg.senderId===currentUser.id?'chat-me':'chat-them'">

                <div x-show="activeChatMsgs.length===0" class="text-center text-gray-500 text-sm py-8"><i class="fas fa-comment-dots text-3xl mb-2 block opacity-20"></i><p x-text="t('startChat')"></p></div>

        <div class="absolute top-3 right-3 badge-bronze">BRONZE</div>
        <div class="w-14 h-14 rounded-full flex items-center justify-center mb-4 mx-auto" style="background:linear-gradient(135deg,#cd7f32,#8b4513)"><i class="fas fa-medal text-2xl text-white"></i></div>
        <h3 class="font-orb text-xl font-bold text-center" style="color:#cd7f32">BRONZE</h3>
        <div class="text-center my-4"><span class="font-orb text-3xl font-black neon" x-text="premCur==='eur'?'€10':premCur==='usd'?'$12':'₽1000'"></span></div>
        <ul class="space-y-2 text-sm mb-6">
          <li class="flex items-center gap-2"><i class="fas fa-check text-green-400 text-xs"></i><span x-text="t('blueCheck')"></span></li>
          <li class="flex items-center gap-2"><i class="fas fa-check text-green-400 text-xs"></i><span x-text="t('verBadge')"></span></li>
          <li class="flex items-center gap-2 text-gray-500"><i class="fas fa-times text-red-400 text-xs"></i><span x-text="t('goldNick')"></span></li>
          <li class="flex items-center gap-2 text-gray-500"><i class="fas fa-times text-red-400 text-xs"></i><span x-text="t('noFee')"></span></li>
        </ul>
        <button @click="buyPremium('bronze',10)" class="w-full btn-pr py-2.5 rounded-xl font-semibold" :disabled="currentUser&&currentUser.premium==='bronze'">
          <span x-text="currentUser&&currentUser.premium==='bronze'?t('current'):t('subscribe')"></span>
        </button>
      </div>
      <div class="glass card-hover rounded-2xl p-6 border border-gray-400/40 relative" style="box-shadow:0 0 20px rgba(168,178,200,.15)">
        <div class="absolute top-3 right-3 badge-silver">SILVER</div>
        <div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-blue-600 text-white text-xs px-3 py-1 rounded-full font-bold" x-text="t('popular')"></div>
        <div class="w-14 h-14 rounded-full flex items-center justify-center mb-4 mx-auto" style="background:linear-gradient(135deg,#c0c0c0,#808080)"><i class="fas fa-crown text-2xl text-white"></i></div>
        <h3 class="font-orb text-xl font-bold text-center text-gray-300">SILVER</h3>
        <div class="text-center my-4"><span class="font-orb text-3xl font-black neon" x-text="premCur==='eur'?'€25':premCur==='usd'?'$28':'₽2500'"></span></div>
        <ul class="space-y-2 text-sm mb-6">
          <li class="flex items-center gap-2"><i class="fas fa-check text-green-400 text-xs"></i><span x-text="t('blueCheck')"></span></li>
          <li class="flex items-center gap-2"><i class="fas fa-check text-green-400 text-xs"></i><span x-text="t('goldNick')"></span></li>
          <li class="flex items-center gap-2"><i class="fas fa-check text-green-400 text-xs"></i><span x-text="t('exThemes')"></span></li>
          <li class="flex items-center gap-2 text-gray-500"><i class="fas fa-times text-red-400 text-xs"></i><span x-text="t('noFee')"></span></li>
        </ul>
        <button @click="buyPremium('silver',25)" class="w-full btn-pr py-2.5 rounded-xl font-semibold">
          <span x-text="currentUser&&currentUser.premium==='silver'?t('current'):t('subscribe')"></span>
        </button>
      </div>
      <div class="glass card-hover rounded-2xl p-6 relative overflow-hidden" style="border:1px solid rgba(255,215,0,.4);box-shadow:0 0 25px rgba(255,215,0,.15)">
        <div class="absolute inset-0 opacity-5" style="background:linear-gradient(135deg,#ffd700,#ff8c00)"></div>
        <div class="absolute top-3 right-3 badge-elite">ELITE</div>
        <div class="w-14 h-14 rounded-full flex items-center justify-center mb-4 mx-auto relative z-10" style="background:linear-gradient(135deg,#ffd700,#ff8c00)"><i class="fas fa-gem text-2xl text-black"></i></div>
        <h3 class="font-orb text-xl font-bold text-center relative z-10" style="color:#ffd700">ELITE</h3>
        <div class="text-center my-4 relative z-10"><span class="font-orb text-3xl font-black" style="color:#ffd700" x-text="premCur==='eur'?'€50':premCur==='usd'?'$55':'₽5000'"></span></div>
        <ul class="space-y-2 text-sm mb-6 relative z-10">
          <li class="flex items-center gap-2"><i class="fas fa-check text-green-400 text-xs"></i><span x-text="t('blueCheck')"></span></li>
          <li class="flex items-center gap-2"><i class="fas fa-check text-green-400 text-xs"></i><span x-text="t('goldNick')"></span></li>
          <li class="flex items-center gap-2"><i class="fas fa-check text-green-400 text-xs"></i><span x-text="t('exThemes')"></span></li>
          <li class="flex items-center gap-2"><i class="fas fa-check text-green-400 text-xs"></i><span x-text="t('noFee')"></span></li>
          <li class="flex items-center gap-2"><i class="fas fa-check text-green-400 text-xs"></i><span class="badge-elite">PRIORITY</span></li>
        </ul>
        <button @click="buyPremium('elite',50)" class="w-full py-2.5 rounded-xl font-semibold relative z-10" style="background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000;">
          <span x-text="currentUser&&currentUser.premium==='elite'?t('current'):t('subscribe')"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- SETTINGS PAGE -->
  <div x-show="page==='settings'" class="page-enter mt-4">
    <div x-show="!currentUser" class="text-center py-20 text-gray-400"><i class="fas fa-lock text-4xl mb-3 block opacity-30"></i><p x-text="t('loginReq')"></p></div>
    <template x-if="currentUser">
      <div class="max-w-xl mx-auto space-y-4">
        <h2 class="font-orb text-xl font-bold neon mb-4" x-text="t('settings')"></h2>

        <div class="glass rounded-xl p-4">
          <h3 class="font-semibold mb-3"><i class="fas fa-palette mr-2 neon"></i><span x-text="t('theme')"></span></h3>
          <div class="grid grid-cols-2 gap-2">
            <template x-for="th in themes" :key="th.id">
              <button @click="setTheme(th.id)" class="glass rounded-xl p-3 border-2 transition text-sm font-semibold"
                      :class="theme===th.id?'border-red-600':'border-white/10 hover:border-white/30'"
                      :disabled="th.premium && !(currentUser.premium==='silver'||currentUser.premium==='elite')">
                <i class="fas mr-1" :class="th.icon"></i><span x-text="th.name"></span>
                <span x-show="th.premium && !(currentUser.premium==='silver'||currentUser.premium==='elite')" class="block text-xs text-yellow-500 mt-0.5">Silver+</span>
              </button>
            </template>
          </div>
        </div>

        <div class="glass rounded-xl p-4">
          <h3 class="font-semibold mb-3"><i class="fas fa-language mr-2 neon"></i><span x-text="t('language')"></span></h3>
          <div class="grid grid-cols-4 gap-2">
            <template x-for="l in langs" :key="l.code">
              <button @click="setLang(l.code)" class="glass rounded-xl py-2 px-3 text-sm font-semibold border-2 transition"
                      :class="lang===l.code?'border-red-600':'border-white/10 hover:border-white/30'" x-text="l.label"></button>
            </template>
          </div>
        </div>

        <div class="glass rounded-xl p-4">
          <h3 class="font-semibold mb-3"><i class="fas fa-image mr-2 neon"></i><span x-text="t('bg')"></span></h3>
          <div class="flex gap-3">
            <label class="btn-ghost px-4 py-2 rounded-xl text-sm cursor-pointer">
              <i class="fas fa-upload mr-1"></i><span x-text="t('uploadBg')"></span>
              <input type="file" accept="image/*" class="hidden" @change="uploadBg($event)">
            </label>
            <button x-show="customBg" @click="removeBg()" class="glass border border-red-800/40 text-red-400 hover:bg-red-900/20 px-4 py-2 rounded-xl text-sm transition" x-text="t('removeBg')"></button>
          </div>
        </div>

        <div class="glass rounded-xl p-4">
          <h3 class="font-semibold mb-3"><i class="fas fa-ticket-alt mr-2 neon"></i><span x-text="t('promo')"></span></h3>
          <div class="flex gap-2">
            <input x-model="promoIn" :placeholder="t('enterPromo')" class="flex-1 glass rounded-xl px-4 py-2 text-sm border border-white/10 uppercase">
            <button @click="applyPromo()" class="btn-pr px-4 py-2 rounded-xl text-sm" x-text="t('apply')"></button>
          </div>
        </div>

        <div class="glass rounded-xl p-4">
          <h3 class="font-semibold mb-3"><i class="fas fa-exchange-alt mr-2 neon"></i><span x-text="t('transfer')"></span></h3>
          <div class="space-y-2">
            <input x-model="xferForm.to" :placeholder="t('recipientId')" class="w-full glass rounded-xl px-4 py-2 text-sm border border-white/10">
            <div class="flex gap-2">
              <input x-model.number="xferForm.amount" type="number" :placeholder="t('amount')" class="flex-1 glass rounded-xl px-4 py-2 text-sm border border-white/10">
              <button @click="doTransfer()" class="btn-pr px-4 py-2 rounded-xl text-sm" x-text="t('send')"></button>
            </div>
          </div>
        </div>

        <div class="glass rounded-xl p-4 border border-red-900/40">
          <h3 class="font-semibold mb-3 text-red-400"><i class="fas fa-skull-crossbones mr-2"></i><span x-text="t('danger')"></span></h3>
          <button @click="logout()" class="glass border border-red-800/50 text-red-400 hover:bg-red-900/30 px-4 py-2 rounded-xl text-sm transition" x-text="t('logout')"></button>
        </div>
      </div>
    </template>
  </div>

  <!-- ADMIN PAGE -->
  <div x-show="page==='admin'" class="page-enter mt-4">
    <div x-show="!(currentUser && currentUser.isAdmin)" class="text-center py-20 text-gray-400"><i class="fas fa-skull-crossbones text-4xl mb-3 block opacity-30 neon"></i><p x-text="t('noAccess')"></p></div>
    <template x-if="currentUser && currentUser.isAdmin">
      <div>
        <div class="flex items-center gap-3 mb-4">
          <div class="w-8 h-8 rounded-full bg-red-700 flex items-center justify-center"><i class="fas fa-shield-alt text-sm"></i></div>
          <h2 class="font-orb text-xl font-bold neon" x-text="t('admin')"></h2>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
          <div class="glass rounded-xl p-3 text-center"><div class="font-orb text-2xl font-bold neon" x-text="usersArr.length"></div><div class="text-xs text-gray-400" x-text="t('users')"></div></div>
          <div class="glass rounded-xl p-3 text-center"><div class="font-orb text-2xl font-bold text-green-400" x-text="products.length"></div><div class="text-xs text-gray-400" x-text="t('lots')"></div></div>
          <div class="glass rounded-xl p-3 text-center"><div class="font-orb text-2xl font-bold text-yellow-400" x-text="transactions.filter(t=>t.status==='pending').length"></div><div class="text-xs text-gray-400" x-text="t('pending')"></div></div>
          <div class="glass rounded-xl p-3 text-center"><div class="font-orb text-2xl font-bold text-blue-400" x-text="promos.length"></div><div class="text-xs text-gray-400" x-text="t('promos')"></div></div>
        </div>

        <div class="flex gap-1 glass rounded-xl p-1 mb-4 overflow-x-auto">
          <button @click="adminTab='users'" :class="adminTab==='users'?'btn-pr':'text-gray-400 hover:text-white'" class="flex-shrink-0 px-4 py-2 rounded-xl text-sm font-semibold transition" x-text="t('users')"></button>
          <button @click="adminTab='promos'" :class="adminTab==='promos'?'btn-pr':'text-gray-400 hover:text-white'" class="flex-shrink-0 px-4 py-2 rounded-xl text-sm font-semibold transition" x-text="t('promos')"></button>
          <button @click="adminTab='txs'" :class="adminTab==='txs'?'btn-pr':'text-gray-400 hover:text-white'" class="flex-shrink-0 px-4 py-2 rounded-xl text-sm font-semibold transition" x-text="t('deals')"></button>
        </div>

        <!-- Admin: Users -->
        <div x-show="adminTab==='users'" class="space-y-2">
          <template x-for="u in usersArr.filter(x=>!x.isAdmin)" :key="u.id">
            <div class="glass rounded-xl p-4 flex flex-col sm:flex-row gap-3 items-start sm:items-center justify-between"
                 :class="u.banned?'border border-red-900/50 opacity-60':u.frozen?'border border-yellow-900/50':''">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full border overflow-hidden flex items-center justify-center font-bold text-sm"
                     :class="u.verified?'border-blue-500 text-blue-400':'border-red-700 text-red-400'">
                  <img x-show="u.avatar" :src="u.avatar" class="w-full h-full object-cover">
                  <span x-show="!u.avatar" x-text="(u.username||'?')[0].toUpperCase()"></span>
                </div>
                <div>
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="font-semibold" :class="u.premium==='silver'||u.premium==='elite'?'gold-nick':''" x-text="u.username"></span>
                    <span x-show="u.verified"><i class="fas fa-check-circle verified text-xs"></i></span>
                    <span x-show="u.banned" class="bg-red-900/60 text-red-400 text-xs px-1.5 rounded">BANNED</span>
                    <span x-show="u.frozen" class="bg-yellow-900/60 text-yellow-400 text-xs px-1.5 rounded">FROZEN</span>
                  </div>
                  <p class="text-xs text-gray-400 font-mono">ID: #<span x-text="u.shortId||u.id.slice(-5)"></span> | €<span x-text="fNum(u.balance)"></span></p>
                </div>
              </div>
              <div class="flex flex-wrap gap-1.5">
                <button @click="adminBan(u)" class="glass border text-xs px-2 py-1 rounded-xl transition"
                        :class="u.banned?'border-green-700/50 text-green-400 hover:bg-green-900/20':'border-red-700/50 text-red-400 hover:bg-red-900/20'"
                        x-text="u.banned?t('unban'):t('ban')"></button>
                <button @click="adminFreeze(u)" class="glass border text-xs px-2 py-1 rounded-xl transition"
                        :class="u.frozen?'border-green-700/50 text-green-400 hover:bg-green-900/20':'border-yellow-700/50 text-yellow-400 hover:bg-yellow-900/20'"
                        x-text="u.frozen?t('unfreeze'):t('freeze')"></button>
                <button @click="adminVerify(u)" class="glass border text-xs px-2 py-1 rounded-xl transition"
                        :class="u.verified?'border-gray-700/50 text-gray-400 hover:bg-gray-900/20':'border-blue-700/50 text-blue-400 hover:bg-blue-900/20'"
                        x-text="u.verified?t('rmCheck'):t('giveCheck')"></button>
                <button @click="adminDelete(u)" class="glass border border-red-900/50 text-red-500 hover:bg-red-900/30 text-xs px-2 py-1 rounded-xl transition" x-text="t('delete')"></button>
              </div>
            </div>
          </template>
          <div x-show="usersArr.filter(x=>!x.isAdmin).length===0" class="text-center py-10 text-gray-500"><i class="fas fa-users text-3xl mb-2 block opacity-30"></i><p class="text-sm">Нет пользователей</p></div>
        </div>

        <!-- Admin: Promos -->
        <div x-show="adminTab==='promos'">
          <div class="glass rounded-xl p-4 mb-4">
            <h3 class="font-semibold mb-3 neon" x-text="t('createPromo')"></h3>
            <div class="flex flex-col sm:flex-row gap-2">
              <input x-model="newPromoCode" :placeholder="t('promoCode')" class="flex-1 glass rounded-xl px-4 py-2 text-sm border border-white/10 uppercase">
              <input x-model.number="newPromoAmt" type="number" :placeholder="t('amount')" class="w-28 glass rounded-xl px-4 py-2 text-sm border border-white/10">
              <button @click="createPromo()" class="btn-pr px-4 py-2 rounded-xl text-sm" x-text="t('create')"></button>
            </div>
          </div>
          <div class="space-y-2">
            <template x-for="p in promos" :key="p.code">
              <div class="glass rounded-xl p-4 flex items-center justify-between">
                <div>
                  <span class="font-mono font-bold text-yellow-400 text-lg" x-text="p.code"></span>
                  <p class="text-sm text-gray-400">€<span x-text="p.amount"></span> · <span x-text="t('used')"></span>: <span x-text="Object.keys(p.usedBy||{}).length"></span></p>
                </div>
                <button @click="deletePromo(p.code)" class="text-red-400 hover:text-red-300 transition"><i class="fas fa-trash"></i></button>
              </div>
            </template>
            <div x-show="promos.length===0" class="text-center py-6 text-gray-500 text-sm">Нет промокодов</div>
          </div>
        </div>

        <!-- Admin: Transactions -->
        <div x-show="adminTab==='txs'" class="space-y-2">
          <template x-for="tx in [...transactions].reverse().slice(0,50)" :key="tx.id">
            <div class="glass rounded-xl p-3">
              <div class="flex flex-col sm:flex-row gap-2 items-start sm:items-center justify-between">
                <div class="text-sm">
                  <p class="font-semibold" x-text="tx.productTitle||t('deletedLot')"></p>
                  <p class="text-xs text-gray-400"><span x-text="tx.buyerName||'?'"></span> → <span x-text="tx.sellerName||'?'"></span></p>
                  <p class="text-xs text-gray-400 font-mono" x-text="fDate(tx.createdAt)"></p>
                </div>
                <div class="flex items-center gap-2">
                  <span class="font-mono font-bold text-green-400">€<span x-text="fNum(tx.amount)"></span></span>
                  <span class="text-xs px-2 py-1 rounded font-bold"
                        :class="tx.status==='pending'?'bg-yellow-900/50 text-yellow-400':tx.status==='completed'?'bg-green-900/50 text-green-400':'bg-red-900/50 text-red-400'"
                        x-text="t(tx.status)"></span>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>
  </div>

</main>

<!-- ===== MODALS ===== -->

<!-- Auth Modal -->
<div x-show="showAuth" @click.self="showAuth=false" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
  <div class="modal-enter glass-dark rounded-2xl p-6 w-full max-w-sm border border-white/10">
    <div class="flex items-center justify-between mb-6">
      <h2 class="font-orb text-xl font-bold neon" x-text="authMode==='login'?t('login'):t('register')"></h2>
      <button @click="showAuth=false" class="text-gray-400 hover:text-white w-8 h-8 rounded-full glass flex items-center justify-center"><i class="fas fa-times text-sm"></i></button>
    </div>
    <div class="space-y-3">
      <div>
        <label class="text-xs text-gray-400 mb-1 block" x-text="t('username')"></label>
        <input x-model="authForm.username" :placeholder="t('username')" @keydown.enter="authMode==='login'?doLogin():doRegister()" class="w-full glass rounded-xl px-4 py-2.5 text-sm border border-white/10">
      </div>
      <div>
        <label class="text-xs text-gray-400 mb-1 block" x-text="t('password')"></label>
        <div class="relative">
          <input x-model="authForm.password" :type="showPwd?'text':'password'" @keydown.enter="authMode==='login'?doLogin():doRegister()" :placeholder="t('password')" class="w-full glass rounded-xl px-4 py-2.5 text-sm border border-white/10 pr-10">
          <button @click="showPwd=!showPwd" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"><i class="fas" :class="showPwd?'fa-eye-slash':'fa-eye'"></i></button>
        </div>
      </div>
      <div x-show="authMode==='register'">
        <label class="text-xs text-gray-400 mb-1 block" x-text="t('confirm')"></label>
        <input x-model="authForm.confirm" type="password" :placeholder="t('confirm')" @keydown.enter="doRegister()" class="w-full glass rounded-xl px-4 py-2.5 text-sm border border-white/10">
      </div>
      <div x-show="authErr" class="text-red-400 text-xs glass rounded-xl px-3 py-2 shake" x-text="authErr"></div>
      <div x-show="authLoading" class="text-center text-gray-400 text-sm"><i class="fas fa-spinner animate-spin mr-2"></i>Загрузка...</div>
      <button @click="authMode==='login'?doLogin():doRegister()" :disabled="authLoading" class="w-full btn-pr py-2.5 rounded-xl font-semibold" x-text="authMode==='login'?t('login'):t('register')"></button>
      <p class="text-center text-sm text-gray-400">
        <span x-text="authMode==='login'?t('noAccount'):t('haveAccount')"></span>
        <button @click="authMode=authMode==='login'?'register':'login';authErr=''" class="text-red-400 hover:underline ml-1" x-text="authMode==='login'?t('register'):t('login')"></button>
      </p>
      <div x-show="authMode==='login'" class="text-center text-xs text-gray-500 border-t border-white/10 pt-3">Admin: <span class="text-red-400 font-mono">system / 1337</span></div>
    </div>
  </div>
</div>

<!-- Product Detail Modal -->
<div x-show="showProduct && selProduct" @click.self="showProduct=false" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
  <div class="modal-enter glass-dark rounded-2xl w-full max-w-lg border border-white/10 my-4" x-show="selProduct">
    <template x-if="selProduct">
      <div>
        <div class="h-48 rounded-t-2xl bg-gradient-to-br from-slate-900 to-purple-900 relative overflow-hidden flex items-center justify-center">
          <img x-show="selProduct.image" :src="selProduct.image" class="w-full h-full object-cover opacity-80">
          <i x-show="!selProduct.image" class="fas text-6xl opacity-20" :class="catIcon(selProduct.category)"></i>
          <button @click="showProduct=false" class="absolute top-3 right-3 w-8 h-8 rounded-full glass flex items-center justify-center text-gray-300 hover:text-white"><i class="fas fa-times text-sm"></i></button>
          <div class="absolute top-3 left-3"><span class="glass text-xs px-2 py-1 rounded capitalize" x-text="t(selProduct.category)||selProduct.category"></span></div>
        </div>
        <div class="p-5">
          <h2 class="text-xl font-bold mb-1" x-text="selProduct.title"></h2>
          <p class="text-gray-400 text-sm mb-4" x-text="selProduct.description"></p>
          <div class="flex items-center justify-between mb-4">
            <button @click="showProduct=false; openPublicProfile(selProduct.sellerId)" class="flex items-center gap-2 hover:opacity-80 transition">
              <div class="w-9 h-9 rounded-full border overflow-hidden flex items-center justify-center text-xs font-bold"
                   :class="isVerified(selProduct.sellerId)?'border-blue-500 text-blue-400':'border-red-700 text-red-400'">
                <img x-show="getUserById(selProduct.sellerId)?.avatar" :src="getUserById(selProduct.sellerId)?.avatar" class="w-full h-full object-cover">
                <span x-show="!getUserById(selProduct.sellerId)?.avatar" x-text="(selProduct.sellerName||'?')[0].toUpperCase()"></span>
              </div>

<!-- ALPINE APP -->
<script>
function appData() {
  return {
    // ── App State ──
    loading: true,
    dbError: '',
    page: 'home',
    theme: 'default',
    lang: 'ru',
    customBg: null,

    // ── Auth ──
    currentUser: null,
    currentUserKey: null,
    showAuth: false,
    authMode: 'login',
    authForm: { username: '', password: '', confirm: '' },
    authErr: '',
    authLoading: false,
    showPwd: false,

    // ── Data (Firebase listeners) ──
    products: [],
    transactions: [],
    reviews: [],
    usersMap: {},
    usersArr: [],
    promos: [],
    chatsMap: {},

    // ── Market ──
    searchQ: '',
    selCat: 'all',
    sortBy: 'newest',
    cats: ['all', 'games', 'accounts', 'software', 'services', 'other'],

    // ── Modals ──
    showProduct: false,
    selProduct: null,
    showProfile: false,
    viewUser: null,
    showAddProd: false,
    newProd: { title: '', description: '', price: 0, category: 'games', image: '' },
    prodLoading: false,
    showReviewMod: false,
    reviewForm: { stars: 5, text: '' },
    pendingReviewTx: null,
    showImgViewer: false,
    viewerImg: null,

    // ── Profile ──
    profTab: 'listings',

    // ── Admin ──
    adminTab: 'users',
    newPromoCode: '',
    newPromoAmt: 100,

    // ── Messenger ──
    activeChat: null,
    activeChatMsgs: [],
    chatInput: '',
    _chatRef: null,

    // ── Wheel ──
    spinning: false,
    wheelResult: null,
    wheelAngle: 0,
    wheelPrizes: [10, 25, 50, 100, 150, 200, 500, 1000],

    // ── Premium ──
    premCur: 'eur',

    // ── Settings ──
    promoIn: '',
    xferForm: { to: '', amount: 0 },

    // ── Notifications ──
    notifications: [],

    // ── Themes / Langs ──
    themes: [
      { id: 'default', name: 'Cyber Red', icon: 'fa-fire', premium: false },
      { id: 'matrix', name: 'Matrix', icon: 'fa-terminal', premium: true },
      { id: 'blood', name: 'Blood', icon: 'fa-tint', premium: true },
      { id: 'gold', name: 'Gold', icon: 'fa-crown', premium: true },
      { id: 'silver', name: 'Silver', icon: 'fa-circle', premium: true },
    ],
    langs: [
      { code: 'ru', label: '🇷🇺 RU' },
      { code: 'en', label: '🇬🇧 EN' },
      { code: 'es', label: '🇪🇸 ES' },
      { code: 'pt', label: '🇧🇷 PT' },
    ],

    // ═══════════════════════════════════
    //  COMPUTED GETTERS
    // ═══════════════════════════════════

    get filteredProducts() {
      let p = this.products.filter(x => x.status === 'active');
      if (this.selCat !== 'all') p = p.filter(x => x.category === this.selCat);
      if (this.searchQ.trim()) {
        const q = this.searchQ.toLowerCase();
        p = p.filter(x => (x.title||'').toLowerCase().includes(q) || (x.description||'').toLowerCase().includes(q));
      }
      if (this.sortBy === 'price_asc') p.sort((a, b) => a.price - b.price);
      else if (this.sortBy === 'price_desc') p.sort((a, b) => b.price - a.price);
      else p.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      return p;
    },
    get myProducts() {
      if (!this.currentUser) return [];
      return this.products.filter(p => p.sellerId === this.currentUser.id);
    },
    get myPurchases() {
      if (!this.currentUser) return [];
      return this.transactions.filter(t => t.buyerId === this.currentUser.id)
                              .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    },
    get mySales() {
      if (!this.currentUser) return [];
      return this.transactions.filter(t => t.sellerId === this.currentUser.id)
                              .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    },
    get favProducts() {
      if (!this.currentUser) return [];
      const favs = this.currentUser.favorites || {};
      return this.products.filter(p => favs[p.id]);
    },
    get myChats() {
      if (!this.currentUser) return [];
      const result = [];
      for (const [key, chat] of Object.entries(this.chatsMap)) {
        const otherId = Object.keys(chat.participants || {}).find(id => id !== this.currentUser.id);
        const otherUser = this.getUserById(otherId);
        const msgs = Object.values(chat.messages || {});
        const sorted = msgs.sort((a, b) => a.timestamp - b.timestamp);
        const lastMsg = sorted.length ? (sorted[sorted.length - 1].text || '📷 Фото') : null;
        const unread = msgs.filter(m => m.senderId !== this.currentUser.id && !m.read).length;
        result.push({ key, otherUser, otherUserId: otherId, lastMsg, unread });
      }
      return result.sort((a, b) => {
        const aLast = Object.values(this.chatsMap[a.key]?.messages || {}).sort((x,y)=>y.timestamp-x.timestamp)[0]?.timestamp || 0;
        const bLast = Object.values(this.chatsMap[b.key]?.messages || {}).sort((x,y)=>y.timestamp-x.timestamp)[0]?.timestamp || 0;
        return bLast - aLast;
      });
    },
    get unreadCount() {
      if (!this.currentUser) return 0;
      return this.myChats.reduce((sum, c) => sum + (c.unread || 0), 0);
    },
    get canSpin() {
      if (!this.currentUser) return false;
      return this.currentUser.lastSpin !== new Date().toDateString();
    },

    // ═══════════════════════════════════
    //  INIT
    // ═══════════════════════════════════

    async init() {
      this.lang = localStorage.getItem('dm_lang') || 'ru';
      this.theme = localStorage.getItem('dm_theme') || 'default';
      this.customBg = localStorage.getItem('dm_bg') || null;

      try {
        // Test connection
        await db.ref('.info/connected').once('value');

        // Ensure admin exists
        await this.ensureAdmin();

        // Setup global realtime listeners
        this.setupListeners();

        // Restore session
        const savedKey = localStorage.getItem('dm_session');
        if (savedKey) {
          const snap = await db.ref('users/' + savedKey).once('value');
          if (snap.exists()) {
            const u = snap.val();
            if (!u.banned) {
              this.currentUserKey = savedKey;
              this.currentUser = { id: savedKey, ...u };
              this.setupChatListener();
            } else {
              localStorage.removeItem('dm_session');
            }
          } else {
            localStorage.removeItem('dm_session');
          }
        }
      } catch (e) {
        this.dbError = '⚠️ Ошибка подключения к Firebase. Проверьте правила базы данных (Rules: read/write = true).';
        console.error('Firebase error:', e);
      }

      this.$watch('page', v => {
        if (v === 'wheel') this.$nextTick(() => this.drawWheel(this.wheelAngle));
        if (v === 'messenger' && !this.currentUser) this.openAuth('login');
      });

      setTimeout(() => { this.loading = false; }, 1500);
    },

    async ensureAdmin() {
      const snap = await db.ref('users/admin_root').once('value');
      if (!snap.exists()) {
        await db.ref('users/admin_root').set({
          username: 'system',
          password: '1337',
          balance: 25000,
          avatar: null,
          verified: true,
          banned: false,
          frozen: false,
          premium: 'elite',
          isAdmin: true,
          lastSpin: null,
          favorites: {},
          joinDate: new Date().toISOString(),
          shortId: '00001',
        });
        await db.ref('usernames/system').set('admin_root');
      }
    },

    setupListeners() {
      db.ref('products').on('value', snap => {
        const val = snap.val() || {};
        this.products = Object.entries(val).map(([id, p]) => ({ id, ...p }))
                             .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      });
      db.ref('reviews').on('value', snap => {
        const val = snap.val() || {};
        this.reviews = Object.entries(val).map(([id, r]) => ({ id, ...r }));
      });
      db.ref('users').on('value', snap => {
        const val = snap.val() || {};
        this.usersMap = val;
        this.usersArr = Object.entries(val).map(([id, u]) => ({ id, ...u }));
        if (this.currentUserKey && val[this.currentUserKey]) {
          const me = val[this.currentUserKey];
          if (me.banned) { this.logout(); return; }
          this.currentUser = { id: this.currentUserKey, ...me };
        }
      });
      db.ref('transactions').on('value', snap => {
        const val = snap.val() || {};
        this.transactions = Object.entries(val).map(([id, t]) => ({ id, ...t }))
                                  .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      });
      db.ref('promos').on('value', snap => {
        const val = snap.val() || {};
        this.promos = Object.entries(val).map(([code, p]) => ({ code, ...p }));
      });
    },

    setupChatListener() {
      if (this._chatRef) this._chatRef.off();
      if (!this.currentUserKey) return;
      this._chatRef = db.ref('chats');
      this._chatRef.on('value', snap => {
        const val = snap.val() || {};
        const myChats = {};
        for (const [key, chat] of Object.entries(val)) {
          if (chat.participants && chat.participants[this.currentUserKey]) {
            myChats[key] = chat;
          }
        }
        this.chatsMap = myChats;
        // Update active chat messages
        if (this.activeChat && myChats[this.activeChat.key]) {
          const msgs = Object.entries(myChats[this.activeChat.key].messages || {})
                             .map(([id, m]) => ({ id, ...m }))
                             .sort((a, b) => a.timestamp - b.timestamp);
          this.activeChatMsgs = msgs;
          this.$nextTick(() => this.scrollChat());
        }
      });
    },

    // ═══════════════════════════════════
    //  AUTH
    // ═══════════════════════════════════

    openAuth(mode = 'login') {
      if (this.currentUser) return;
      this.authMode = mode;
      this.authErr = '';
      this.authForm = { username: '', password: '', confirm: '' };
      this.showAuth = true;
    },

    async doLogin() {
      const { username, password } = this.authForm;
      if (!username.trim() || !password) { this.authErr = this.t('fillAll'); return; }
      this.authLoading = true;
      this.authErr = '';
      try {
        // Lookup user key by username
        const keySnap = await db.ref('usernames/' + username.trim().toLowerCase()).once('value');
        if (!keySnap.exists()) { this.authErr = this.t('wrongCreds'); this.authLoading = false; return; }
        const userKey = keySnap.val();
        const userSnap = await db.ref('users/' + userKey).once('value');
        if (!userSnap.exists()) { this.authErr = this.t('wrongCreds'); this.authLoading = false; return; }
        const u = userSnap.val();
        if (u.password !== password) { this.authErr = this.t('wrongCreds'); this.authLoading = false; return; }
        if (u.banned) { this.authErr = this.t('banned'); this.authLoading = false; return; }
        this.currentUserKey = userKey;
        this.currentUser = { id: userKey, ...u };
        localStorage.setItem('dm_session', userKey);
        this.setupChatListener();
        this.showAuth = false;
        this.notify(this.t('welcome') + ' ' + u.username + '!', 'success');
      } catch (e) {
        this.authErr = 'Ошибка соединения с Firebase';
        console.error(e);
      }
      this.authLoading = false;
    },

    async doRegister() {
      const { username, password, confirm } = this.authForm;
      if (!username.trim() || !password || !confirm) { this.authErr = this.t('fillAll'); return; }
      if (username.trim().length < 3) { this.authErr = this.t('shortName'); return; }
      if (password.length < 4) { this.authErr = this.t('shortPass'); return; }
      if (password !== confirm) { this.authErr = this.t('passMismatch'); return; }
      this.authLoading = true;
      this.authErr = '';
      try {
        const uname = username.trim().toLowerCase();
        // Check username taken
        const taken = await db.ref('usernames/' + uname).once('value');
        if (taken.exists()) { this.authErr = this.t('userExists'); this.authLoading = false; return; }
        // Generate short ID
        const shortId = String(Math.floor(10000 + Math.random() * 90000));
        const newUser = {
          username: username.trim(),
          password,
          balance: 5000,
          avatar: null,
          verified: false,
          banned: false,
          frozen: false,
          premium: null,
          isAdmin: false,
          lastSpin: null,
          favorites: {},
          joinDate: new Date().toISOString(),
          shortId,
        };
        const ref = await db.ref('users').push(newUser);
        await db.ref('usernames/' + uname).set(ref.key);
        this.currentUserKey = ref.key;
        this.currentUser = { id: ref.key, ...newUser };
        localStorage.setItem('dm_session', ref.key);
        this.setupChatListener();
        this.showAuth = false;
        this.notify(this.t('registered') + '! ID: #' + shortId, 'success');
      } catch (e) {
        this.authErr = 'Ошибка создания аккаунта';
        console.error(e);
      }
      this.authLoading = false;
    },

    logout() {
      if (this._chatRef) { this._chatRef.off(); this._chatRef = null; }
      this.currentUser = null;
      this.currentUserKey = null;
      this.chatsMap = {};
      this.activeChat = null;
      this.activeChatMsgs = [];
      localStorage.removeItem('dm_session');
      this.page = 'home';
      this.notify(this.t('loggedOut'), 'info');

    quickBuy(p) {

    async buyProduct(p) {
      if (!this.currentUser) { this.openAuth('login'); return; }
      if (!p || p.status !== 'active') { this.notify(this.t('notAvail'), 'error'); return; }
      if (this.currentUser.id === p.sellerId) { this.notify(this.t('cantBuyOwn'), 'error'); return; }
      if (this.currentUser.frozen) { this.notify(this.t('frozen'), 'error'); return; }
      if (this.currentUser.balance < p.price) { this.notify(this.t('noFunds'), 'error'); return; }
      if (!confirm(this.t('confirmBuy') + ' ' + p.title + ' (€' + this.fNum(p.price) + ')?')) return;
      try {
        // Deduct buyer balance
        await db.ref('users/' + this.currentUser.id + '/balance').set(this.currentUser.balance - p.price);
        // Create escrow transaction
        const tx = {
          buyerId: this.currentUser.id,
          buyerName: this.currentUser.username,
          sellerId: p.sellerId,
          sellerName: p.sellerName,
          productId: p.id,
          productTitle: p.title,
          amount: p.price,
          status: 'pending',
          createdAt: new Date().toISOString(),
        };
        await db.ref('transactions').push(tx);
        // Mark product as pending
        await db.ref('products/' + p.id + '/status').set('pending');
        this.showProduct = false;
        this.notify(this.t('buySuccess'), 'success');
        this.page = 'profile';
        this.profTab = 'purchases';
        setTimeout(() => this.openChat(p.sellerId), 600);
      } catch (e) {
        this.notify('Ошибка покупки', 'error');
        console.error(e);
      }
    },

    async confirmPurchase(tx) {
      if (!confirm(this.t('confirmDeal'))) return;
      try {
        const seller = this.getUserById(tx.sellerId);
        if (seller) {
          await db.ref('users/' + tx.sellerId + '/balance').set((seller.balance || 0) + tx.amount);
        }
        await db.ref('transactions/' + tx.id + '/status').set('completed');
        await db.ref('products/' + tx.productId + '/status').set('sold');
        this.notify(this.t('dealDone'), 'success');
        this.pendingReviewTx = tx;
        this.reviewForm = { stars: 5, text: '' };
        this.showReviewMod = true;
      } catch (e) {
        this.notify('Ошибка подтверждения', 'error');
        console.error(e);
      }
    },

    async refundPurchase(tx) {
      if (!confirm(this.t('confirmRefund'))) return;
      try {
        const buyer = this.getUserById(tx.buyerId);
        if (buyer) {
          await db.ref('users/' + tx.buyerId + '/balance').set((buyer.balance || 0) + tx.amount);
        }
        await db.ref('transactions/' + tx.id + '/status').set('refunded');
        const prod = this.products.find(p => p.id === tx.productId);
        if (prod && prod.status === 'pending') {
          await db.ref('products/' + tx.productId + '/status').set('active');
        }
        this.notify(this.t('refundDone'), 'success');
      } catch (e) {
        this.notify('Ошибка возврата', 'error');
        console.error(e);
      }
    },

    async openChat(userId) {
      if (!this.currentUser || !userId || userId === this.currentUser.id) return;
      const key = [this.currentUserKey, userId].sort().join('_');
      const chatSnap = await db.ref('chats/' + key).once('value');
      if (!chatSnap.exists()) {
        await db.ref('chats/' + key).set({
          participants: { [this.currentUserKey]: true, [userId]: true },
          messages: {},
        });
      }
      const otherUser = this.getUserById(userId);
      this.activeChat = { key, otherUser, otherUserId: userId };
      // Load messages
      const msgs = Object.entries((await db.ref('chats/' + key + '/messages').once('value')).val() || {})
                         .map(([id, m]) => ({ id, ...m }))
                         .sort((a, b) => a.timestamp - b.timestamp);
      this.activeChatMsgs = msgs;
      // Mark read
      const updates = {};
      msgs.forEach(m => {
        if (m.senderId !== this.currentUser.id && !m.read) {
          updates['chats/' + key + '/messages/' + m.id + '/read'] = true;
        }
      });
      if (Object.keys(updates).length) await db.ref().update(updates);
      this.page = 'messenger';
      this.$nextTick(() => this.scrollChat());
    },

    async setActiveChat(c) {
      this.activeChat = c;
      const key = c.key;
      const chatSnap = await db.ref('chats/' + key + '/messages').once('value');
      const msgs = Object.entries(chatSnap.val() || {})
                         .map(([id, m]) => ({ id, ...m }))
                         .sort((a, b) => a.timestamp - b.timestamp);
      this.activeChatMsgs = msgs;
      // Mark read
      const updates = {};
      msgs.forEach(m => {
        if (m.senderId !== this.currentUser.id && !m.read) {
          updates['chats/' + key + '/messages/' + m.id + '/read'] = true;
        }
      });
      if (Object.keys(updates).length) await db.ref().update(updates);
      this.$nextTick(() => this.scrollChat());
    },

    // ═══════════════════════════════════
    //  WHEEL OF FORTUNE
    // ═══════════════════════════════════

    drawWheel(rotation) {
      const canvas = document.getElementById('fortuneWheel');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const prizes = this.wheelPrizes;
      const arc = (2 * Math.PI) / prizes.length;
      const cx = 140, cy = 140, r = 130;
      const colors = ['#1a0520','#200a10','#0a1530','#18051a','#051a20','#1a1505','#201505','#050a20'];
      const tColors = ['#ff4477','#ff6644','#44aaff','#ff44cc','#44ffee','#ffee44','#ff8844','#8844ff'];
      ctx.clearRect(0, 0, 280, 280);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation * Math.PI / 180);
      prizes.forEach((prize, i) => {
        const s = arc * i, e = arc * (i + 1);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, s, e);
        ctx.fillStyle = colors[i]; ctx.fill();
        ctx.strokeStyle = 'rgba(225,29,72,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.save(); ctx.rotate(s + arc / 2);
        ctx.fillStyle = tColors[i]; ctx.font = 'bold 13px "Share Tech Mono"';
        ctx.textAlign = 'center'; ctx.shadowColor = tColors[i]; ctx.shadowBlur = 6;
        ctx.fillText('€' + prize, r * 0.65, 5); ctx.restore();
      });
      ctx.restore();
      // Center
      ctx.beginPath(); ctx.arc(cx, cy, 18, 0, 2 * Math.PI);
      const cg = ctx.createRadialGradient(cx-4,cy-4,2,cx,cy,18);
      cg.addColorStop(0,'#ff4477'); cg.addColorStop(1,'#990022');
      ctx.fillStyle = cg; ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '12px Arial'; ctx.textAlign = 'center';
      ctx.fillText('🐉', cx, cy + 4);
    },

    async spinWheel() {
      if (this.spinning || !this.canSpin) return;
      this.spinning = true;
      this.wheelResult = null;
      const prizes = this.wheelPrizes;
      const winIdx = Math.floor(Math.random() * prizes.length);
      const prize = prizes[winIdx];
      const segAngle = 360 / prizes.length;
      const target = 360 - (winIdx * segAngle) - segAngle / 2;
      const startAngle = this.wheelAngle;
      const endAngle = startAngle + 360 * 6 + (target - startAngle % 360);
      const duration = 4500;
      let startTime = null;
      const animate = (ts) => {
        if (!startTime) startTime = ts;
        const progress = Math.min((ts - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 4);
        this.wheelAngle = startAngle + (endAngle - startAngle) * eased;
        this.drawWheel(this.wheelAngle);
        if (progress < 1) { requestAnimationFrame(animate); }
        else {
          this.spinning = false;
          this.wheelResult = prize;
          const newBal = (this.currentUser.balance || 0) + prize;
          db.ref('users/' + this.currentUser.id).update({
            balance: newBal,
            lastSpin: new Date().toDateString(),
          });
          this.notify('🎉 ' + this.t('youWon') + ' €' + prize + '!', 'success');
        }
      };
      requestAnimationFrame(animate);
    },

    // ═══════════════════════════════════

    async applyPromo() {
      if (!this.currentUser) { this.openAuth('login'); return; }
      const code = this.promoIn.trim().toUpperCase();
      if (!code) { this.notify(this.t('enterPromo'), 'error'); return; }
      const snap = await db.ref('promos/' + code).once('value');
      if (!snap.exists()) { this.notify(this.t('promoNotFound'), 'error'); return; }
      const promo = snap.val();
      if (promo.usedBy && promo.usedBy[this.currentUser.id]) { this.notify(this.t('promoUsed'), 'error'); return; }
      await db.ref('promos/' + code + '/usedBy/' + this.currentUser.id).set(true);
      await db.ref('users/' + this.currentUser.id + '/balance').set(this.currentUser.balance + promo.amount);
      this.promoIn = '';
      this.notify('💰 +€' + promo.amount + ' ' + this.t('promoApplied'), 'success');
    },

    //  TRANSFER
    // ═══════════════════════════════════

    async doTransfer() {
      if (!this.currentUser) { this.openAuth('login'); return; }
      if (this.currentUser.frozen) { this.notify(this.t('frozen'), 'error'); return; }
      const { to, amount } = this.xferForm;
      if (!to || !amount || amount <= 0) { this.notify(this.t('fillAll'), 'error'); return; }
      // Find target by username or shortId
      const target = this.usersArr.find(u =>
        u.username.toLowerCase() === to.toLowerCase() || u.shortId === to
      );
      if (!target) { this.notify(this.t('userNotFound'), 'error'); return; }
      if (target.id === this.currentUser.id) { this.notify(this.t('cantSelf'), 'error'); return; }
      if (this.currentUser.balance < amount) { this.notify(this.t('noFunds'), 'error'); return; }
      await db.ref('users/' + this.currentUser.id + '/balance').set(this.currentUser.balance - amount);
      await db.ref('users/' + target.id + '/balance').set((target.balance || 0) + amount);
      this.xferForm = { to: '', amount: 0 };
      this.notify('✅ €' + amount + ' → ' + target.username, 'success');
    },

    fNum(n) { return Number(n||0).toLocaleString('ru-RU'); },
    fDate(d) { if (!d) return '?'; try { return new Date(d).toLocaleDateString(this.lang); } catch { return d; } },
    fTime(ts) { if (!ts) return ''; try { return new Date(ts).toLocaleTimeString(this.lang, {hour:'2-digit',minute:'2-digit'}); } catch { return ''; } },

    notify(text, type = 'info') {
      const id = Date.now() + Math.random();
      this.notifications.push({ id, text, type });
      setTimeout(() => this.removeNotif(id), 4500);
    },
    removeNotif(id) { this.notifications = this.notifications.filter(n => n.id !== id); },

    async compressImg(file, maxW = 400, quality = 0.75) {
      return new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    },
