<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRAGON V27 | EXECUTIVE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, update, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyADkxXfNqpjBaqBvP4DlkNfB_4ki7MMTSk",
            authDomain: "dragonmarket-70400.firebaseapp.com",
            databaseURL: "https://dragonmarket-70400-default-rtdb.firebaseio.com",
            projectId: "dragonmarket-70400",
            storageBucket: "dragonmarket-70400.firebasestorage.app",
            appId: "1:746821202210:web:bf35404eca9f096c3eb57b"
        };

        const appFB = initializeApp(firebaseConfig);
        const db = getDatabase(appFB);
        window.fb = { db, ref, set, onValue, push, update, remove, get };
    </script>

    <style>
        :root { --p: #d946ef; --bg: #060606; --c: #111; --b: #222; --t: #fff; --s: #22c55e; --h: #f43f5e; --gold: #fbbf24; }
        
        /* Темы */
        body.red { --p: #ef4444; }
        body.green { --p: #22c55e; }
        body.gold { --p: #fbbf24; --bg: #0c0b00; --c: #1a1900; }
        body.glass { 
            --bg: url('https://source.unsplash.com/random/1600x900/?dark,abstract'); 
            --c: rgba(255,255,255,0.1); 
            backdrop-filter: blur(10px); 
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; transition: background 0.3s, color 0.3s; }
        body { background: var(--bg); background-size: cover; color: var(--t); height: 100vh; overflow: hidden; }
        
        .screen { display:none; padding:80px 15px 100px; height: 100vh; overflow-y: auto; scroll-behavior: smooth; }
        .active { display:block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--c); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 15px; margin-bottom: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .btn { background: var(--p); color: #fff; border: none; padding: 14px; border-radius: 14px; font-weight: 700; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .btn:active { transform: scale(0.96); }
        .btn-sec { background: var(--b); color: var(--t); }

        input, select, textarea { background: rgba(255,255,255,0.05); border: 1px solid var(--b); color: var(--t); padding: 14px; border-radius: 14px; width: 100%; margin-bottom: 12px; font-size: 16px; outline: none; }
        input:focus { border-color: var(--p); }

        header { position:fixed; top:0; width:100%; height:75px; background: rgba(0,0,0,0.7); backdrop-filter: blur(20px); display: flex; justify-content: space-between; align-items:center; padding: 0 20px; z-index: 1000; border-bottom: 1px solid var(--b); }
        nav { position:fixed; bottom:15px; left:50%; transform:translateX(-50%); width:94%; height:70px; background: rgba(10,10,10,0.9); backdrop-filter: blur(15px); border-radius: 25px; display:flex; justify-content: space-around; align-items:center; border: 1px solid var(--b); z-index: 1000; }
        .nav-i { font-size: 24px; color: #555; cursor: pointer; transition: 0.3s; }
        .nav-i.active { color: var(--p); transform: translateY(-5px); text-shadow: 0 0 15px var(--p); }

        /* Market */
        #m-render { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 900px) { #m-render { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); } }
        .p-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 15px; background: #000; }
        .stock-badge { position: absolute; top: 20px; right: 20px; background: var(--s); padding: 2px 8px; border-radius: 7px; font-size: 10px; font-weight: 900; }

        /* Chat */
        .chat-wrap { height: 450px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 12px; border-radius: 18px; font-size: 14px; line-height: 1.4; }
        .msg.me { align-self: flex-end; background: var(--p); border-bottom-right-radius: 4px; }
        .msg.them { align-self: flex-start; background: var(--b); border-bottom-left-radius: 4px; }
    </style>
</head>
<body id="main-body">

    <div id="scr-auth" style="position:fixed; inset:0; background:var(--bg); z-index:10001; display:flex; align-items:center; justify-content:center; padding:20px;">
        <div class="card" style="width:100%; max-width:380px; text-align:center;">
            <h1 style="color:var(--p); font-size:35px; margin-bottom:5px;">DRAGON V27</h1>
            <p style="opacity:0.4; font-size:12px; margin-bottom:25px;">EXECUTIVE TRADING SYSTEM</p>
            <div id="auth-form">
                <input id="auth-n" placeholder="Введите никнейм">
                <input id="auth-p1" type="password" placeholder="Пароль">
                <div id="reg-ext" style="display:none;"><input id="auth-p2" type="password" placeholder="Повторите пароль"></div>
                <button class="btn" id="btn-auth-action" onclick="core.handleAuth()">ВОЙТИ</button>
                <p id="auth-toggle" onclick="ui.toggleAuth()" style="margin-top:20px; color:var(--p); font-size:13px; cursor:pointer;">Создать новый аккаунт</p>
            </div>
        </div>
    </div>

    <header id="ui-h" style="display:none">
        <div onclick="ui.show('prof')" style="display:flex; align-items:center; gap:12px; cursor:pointer;">
            <img id="h-ava" src="" style="width:48px; height:48px; border-radius:50%; border:2px solid var(--p); object-fit:cover;">
            <div><b id="h-nick"></b><br><small id="h-bal" style="color:var(--s); font-weight:bold;"></small></div>
        </div>
        <div style="text-align:right">
            <div id="h-id" style="font-size:11px; opacity:0.5;"></div>
            <div style="font-size:10px; color:var(--s);">● Online</div>
        </div>
    </header>

    <div id="scr-market" class="screen active">
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <button class="btn" style="flex:3" onclick="ui.modal('add')"><i class="fa fa-plus-circle"></i> ВЫСТАВИТЬ ТОВАР</button>
            <button class="btn btn-sec" style="flex:1" onclick="ui.show('fav')"><i class="fa fa-heart"></i></button>
        </div>
        <div id="m-render"></div>
    </div>

    <div id="scr-fav" class="screen">
        <h2>ИЗБРАННОЕ</h2>
        <div id="fav-render" style="margin-top:15px;"></div>
    </div>

    <div id="scr-deals" class="screen">
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <button class="btn" onclick="core.renderDeals('buy')">МОИ ПОКУПКИ</button>
            <button class="btn btn-sec" onclick="core.renderDeals('sell')">МОИ ПРОДАЖИ</button>
        </div>
        <div id="deals-render"></div>
    </div>

    <div id="scr-chat" class="screen">
        <div id="chat-list-ui">
            <h2>СООБЩЕНИЯ</h2>
            <div id="dialogs-list" style="margin-top:15px;"></div>
        </div>
        <div id="chat-active-ui" style="display:none;">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:15px;">
                <button class="btn btn-sec" style="width:45px;" onclick="ui.backToChats()"><i class="fa fa-arrow-left"></i></button>
                <h3 id="chat-with-nick"></h3>
            </div>
            <div class="card" style="padding:0; overflow:hidden;">
                <div id="chat-box" class="chat-wrap"></div>
                <div style="padding:15px; background:rgba(0,0,0,0.2); display:flex; gap:10px;">
                    <label style="cursor:pointer; padding:10px;"><i class="fa fa-image"></i><input type="file" hidden onchange="core.sendImg(this)"></label>
                    <input id="msg-input" placeholder="Ваше сообщение..." style="margin:0;">
                    <button class="btn" style="width:60px;" onclick="core.sendMsg()"><i class="fa fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="scr-cartel" class="screen">
        <div id="ct-setup" style="display:none;">
            <div class="card" style="text-align:center; padding:40px 20px;">
                <i class="fa fa-shield-halved" style="font-size:50px; color:var(--p); margin-bottom:20px;"></i>
                <h2>ОСНОВАТЬ КАРТЕЛЬ</h2>
                <p style="opacity:0.5; margin:10px 0;">Цена создания: 500 €</p>
                <input id="ct-new-name" placeholder="Название картеля">
                <button class="btn" onclick="core.ctCreate()">СОЗДАТЬ</button>
            </div>
        </div>
        <div id="ct-panel" style="display:none;">
            <div class="card" style="border-left: 5px solid var(--p);">
                <h1 id="ct-name"></h1>
                <p id="ct-owner-info" style="font-size:12px; opacity:0.5;"></p>
                <button id="ct-del-btn" class="btn" style="background:var(--h); width:auto; padding:5px 15px; margin-top:10px; font-size:11px; display:none;">РАСПУСТИТЬ КАРТЕЛЬ</button>
            </div>
            <div class="card" id="ct-admin-tools" style="display:none;">
                <h4>ДОБАВИТЬ БОЙЦА</h4>
                <div style="display:flex; gap:8px; margin-top:10px;">
                    <input id="ct-add-n" placeholder="Ник" style="margin:0;">
                    <input id="ct-add-r" placeholder="Должность" style="margin:0;">
                    <button class="btn" style="width:50px" onclick="core.ctAdd()">+</button>
                </div>
            </div>
            <div id="ct-members" style="margin-top:15px;"></div>
        </div>
    </div>

    <div id="scr-prof" class="screen">
        <div class="card" style="text-align:center;">
            <div style="position:relative; display:inline-block;">
                <img id="p-ava" src="" style="width:110px; height:110px; border-radius:50%; object-fit:cover; border:3px solid var(--p);">
                <label style="position:absolute; bottom:0; right:0; background:var(--p); width:35px; height:35px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; border:3px solid var(--c);"><i class="fa fa-camera"></i><input type="file" hidden onchange="core.updAva(this)"></label>
            </div>
            <h2 id="p-nick" style="margin-top:15px;"></h2>
            <div id="p-rate" style="color:var(--gold); font-weight:900; margin-top:5px;"></div>
            <div id="p-uid" style="font-size:11px; opacity:0.4; margin-top:5px;"></div>
        </div>
        <div class="card">
            <h4>БАНКОВСКИЙ ПЕРЕВОД</h4>
            <input id="bnk-to" placeholder="ID или Ник получателя">
            <input id="bnk-val" type="number" placeholder="Сумма">
            <button class="btn" onclick="core.transfer()"><i class="fa fa-paper-plane"></i> ОТПРАВИТЬ</button>
        </div>
        <div class="card">
            <h4>НАСТРОЙКИ</h4>
            Валюта: <select onchange="core.setCur(this.value)"><option value="€">EUR (€)</option><option value="$">USD ($)</option><option value="₽">RUB (₽)</option></select>
            Тема: <select onchange="ui.setTheme(this.value)">
                <option value="dark">Тёмная (Default)</option>
                <option value="red">Красная</option>
                <option value="green">Зелёная</option>
                <option value="gold">Золотая (Premium)</option>
                <option value="glass">Прозрачная (Cyber)</option>
            </select>
            <button class="btn btn-sec" style="margin-top:15px; color:var(--h);" onclick="core.logout()">ВЫЙТИ ИЗ СИСТЕМЫ</button>
        </div>
    </div>

    <div id="scr-ai" class="screen">
        <h2>AI SUPPORT</h2>
        <div class="card" style="margin-top:20px;">
            <div id="ai-chat" style="height:300px; overflow-y:auto; margin-bottom:15px;">
                <div class="msg them">Привет! Я помощник Dragon V27. Задавай любой вопрос по работе площадки.</div>
            </div>
            <div style="display:flex; gap:10px;">
                <input id="ai-in" placeholder="Ваш вопрос..." style="margin:0;">
                <button class="btn" style="width:60px;" onclick="core.aiAsk()"><i class="fa fa-robot"></i></button>
            </div>
        </div>
    </div>

    <div id="mod-add" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:2000; padding:20px; align-items:center; justify-content:center;">
        <div class="card" style="width:100%; max-width:420px;">
            <h3>НОВЫЙ ЛОТ</h3>
            <input id="in-name" placeholder="Название товара">
            <div style="display:flex; gap:10px;">
                <input id="in-price" type="number" placeholder="Цена">
                <input id="in-stock" type="number" placeholder="Количество">
            </div>
            <textarea id="in-desc" placeholder="Описание, условия автодоставки..."></textarea>
            <input type="file" id="in-file">
            <button class="btn" onclick="core.publish()">ВЫСТАВИТЬ НА ПРОДАЖУ</button>
            <button class="btn btn-sec" style="margin-top:10px;" onclick="ui.modal('add')">ОТМЕНА</button>
        </div>
    </div>

    <nav id="ui-n" style="display:none">
        <div class="nav-i active" onclick="ui.show('market')"><i class="fa fa-store"></i></div>
        <div class="nav-i" onclick="ui.show('deals')"><i class="fa fa-handshake"></i></div>
        <div class="nav-i" onclick="ui.show('cartel')"><i class="fa fa-shield-virus"></i></div>
        <div class="nav-i" onclick="ui.show('chat')"><i class="fa fa-comments"></i></div>
        <div class="nav-i" onclick="ui.show('ai')"><i class="fa fa-microchip"></i></div>
        <div class="nav-i" onclick="ui.show('prof')"><i class="fa fa-user-circle"></i></div>
    </nav>

    <script>
        const core = {
            u: null, items: [], deals: [], cartels: [], cur: '€', isReg: false, targetChat: null,
            
            async handleAuth() {
                const n = document.getElementById('auth-n').value.trim(), p1 = document.getElementById('auth-p1').value, p2 = document.getElementById('auth-p2').value;
                if(!n || !p1) return alert("Заполни поля!");

                // Ролевой вход
                if(n === 'system' && p1 === '1337') {
                    alert("Система авторизована. Права Супер-Администратора подтверждены.");
                    return;
                }

                const s = await window.fb.get(window.fb.ref(window.fb.db, 'users/'+n));

                if(this.isReg) {
                    if(s.exists()) return alert("Никнейм уже занят!");
                    if(p1 !== p2) return alert("Пароли не совпадают!");
                    this.u = {
                        n, p: p1, uid: Math.floor(10000 + Math.random() * 89999),
                        b: (n === 'admin' ? 25000 : 5000), a: 'https://api.dicebear.com/7.x/bottts/svg?seed='+n,
                        favs: [], reviews: [], regDate: new Date().toLocaleDateString()
                    };
                    await window.fb.set(window.fb.ref(window.fb.db, 'users/'+n), this.u);
                } else {
                    if(!s.exists() || s.val().p !== p1) return alert("Ошибка доступа! Проверь логин/пароль.");
                    this.u = s.val();
                }
                localStorage.setItem('dr_sess', this.u.n);
                this.boot();
            },

            boot() {
                document.getElementById('scr-auth').style.display='none';
                document.getElementById('ui-h').style.display='flex';
                document.getElementById('ui-n').style.display='flex';
                this.initDB();
            },

            initDB() {
                const { ref, onValue } = window.fb;
                onValue(ref(window.fb.db, 'market'), s => { this.items = s.val() ? Object.values(s.val()) : []; this.renderM(); this.renderFav(); });
                onValue(ref(window.fb.db, 'users/'+this.u.n), s => { if(s.exists()){ this.u = s.val(); this.updUI(); } });
                onValue(ref(window.fb.db, 'deals'), s => { this.deals = s.val() ? Object.values(s.val()) : []; this.renderDeals('buy'); });
                onValue(ref(window.fb.db, 'cartels'), s => { this.cartels = s.val() ? Object.values(s.val()) : []; this.renderCt(); });
                this.loadDialogs();
            },

            updUI() {
                document.getElementById('h-nick').innerText = this.u.n;
                document.getElementById('p-nick').innerText = this.u.n;
                document.getElementById('h-bal').innerText = this.u.b.toLocaleString() + ' ' + this.cur;
                document.getElementById('h-id').innerText = 'ID: ' + this.u.uid;
                document.getElementById('p-uid').innerText = 'UID: ' + this.u.uid;
                document.getElementById('h-ava').src = this.u.a;
                document.getElementById('p-ava').src = this.u.a;
                const r = this.u.reviews?.length ? (this.u.reviews.reduce((a,b)=>a+b,0)/this.u.reviews.length).toFixed(1) : "0.0";
                document.getElementById('p-rate').innerHTML = `<i class="fa fa-star"></i> ${r} (${this.u.reviews?.length || 0} отз.)`;
            },

            renderM() {
                const l = document.getElementById('m-render');
                l.innerHTML = this.items.map((it, i) => `
                    <div class="card" style="position:relative;">
                        <span class="stock-badge">${it.stock || 0} шт.</span>
                        <img src="${it.img}" class="p-img" onclick="core.openChat('${it.seller}')">
                        <div style="margin-top:10px;">
                            <b style="font-size:14px; display:block; height:36px; overflow:hidden;">${it.name}</b>
                            <div style="color:var(--s); font-weight:900; margin:5px 0;">${it.price} ${this.cur}</div>
                            <div style="display:flex; gap:5px;">
                                <button class="btn" style="padding:8px; font-size:11px;" onclick="core.buy(${i})">КУПИТЬ</button>
                                <button class="btn btn-sec" style="width:35px;" onclick="core.toggleFav('${it.fid}')"><i class="fa fa-heart ${this.u.favs?.includes(it.fid)?'style="color:var(--h)"':''}"></i></button>
                                ${(this.u.n==='admin' || this.u.n===it.seller)?`<button class="btn btn-sec" style="width:35px; color:var(--h);" onclick="core.delLot('${it.fid}')"><i class="fa fa-trash"></i></button>`:''}
                            </div>
                        </div>
                    </div>
                `).join('');
            },

            async buy(i) {
                const it = this.items[i];
                if(it.stock <= 0) return alert("Товара нет в наличии!");
                if(this.u.b < it.price) return alert("Недостаточно средств!");
                if(it.seller === this.u.n) return alert("Нельзя покупать у самого себя!");

                if(confirm(`Оплатить ${it.price} ${this.cur}? Деньги будут заморожены в системе до подтверждения.`)) {
                    this.u.b -= it.price; await this.sync();
                    const nD = window.fb.push(window.fb.ref(window.fb.db, 'deals'));
                    await window.fb.set(nD, { fid: nD.key, title: it.name, price: it.price, buyer: this.u.n, seller: it.seller, status: 'ESCROW', ts: Date.now() });
                    await window.fb.update(window.fb.ref(window.fb.db, 'market/'+it.fid), { stock: it.stock - 1 });
                    ui.show('deals');
                }
            },

            renderDeals(mode) {
                const l = document.getElementById('deals-render');
                const list = mode === 'buy' ? this.deals.filter(d => d.buyer === this.u.n) : this.deals.filter(d => d.seller === this.u.n);
                l.innerHTML = list.map(d => `
                    <div class="card" style="border-left: 5px solid ${d.status==='ESCROW'?'var(--gold)':'var(--s)'}">
                        <div style="font-size:12px; opacity:0.6;">Сделка: ${d.fid}</div>
                        <b>${d.title}</b> — <b>${d.price} ${this.cur}</b>
                        <div style="margin-top:10px; display:flex; gap:10px;">
                            ${d.status==='ESCROW' && mode==='buy' ? `<button class="btn" style="background:var(--s); padding:8px;" onclick="core.confirmDeal('${d.fid}')">ПОДТВЕРДИТЬ</button>` : ''}
                            ${d.status==='ESCROW' && mode==='sell' ? `<button class="btn btn-sec" style="padding:8px;" onclick="core.refund('${d.fid}')">ВОЗВРАТ</button>` : ''}
                            ${d.status==='DONE' ? `<span style="color:var(--s)">✓ Выполнено</span>` : ''}
                        </div>
                    </div>
                `).join('');
            },

            async confirmDeal(fid) {
                const d = this.deals.find(x => x.fid === fid);
                const star = prompt("Оцените продавца (1-5 звёзд):", "5");
                const sRef = window.fb.ref(window.fb.db, 'users/'+d.seller);
                const snap = await window.fb.get(sRef);
                if(snap.exists()) {
                    let sD = snap.val(); sD.b += d.price; sD.reviews = sD.reviews || [];
                    if(star) sD.reviews.push(Number(star));
                    await window.fb.set(sRef, sD);
                }
                await window.fb.update(window.fb.ref(window.fb.db, 'deals/'+fid), { status: 'DONE' });
                alert("Сделка завершена, деньги переведены продавцу!");
            },

            async refund(fid) {
                const d = this.deals.find(x => x.fid === fid);
                const bRef = window.fb.ref(window.fb.db, 'users/'+d.buyer);
                const snap = await window.fb.get(bRef);
                if(snap.exists()) {
                    let bD = snap.val(); bD.b += d.price;
                    await window.fb.set(bRef, bD);
                }
                await window.fb.remove(window.fb.ref(window.fb.db, 'deals/'+fid));
                alert("Средства возвращены покупателю!");
            },

            loadDialogs() {
                window.fb.onValue(window.fb.ref(window.fb.db, 'chats'), s => {
                    const l = document.getElementById('dialogs-list'); l.innerHTML = "";
                    const data = s.val(); if(!data) return;
                    Object.keys(data).forEach(key => {
                        if(key.includes(this.u.n)) {
                            const other = key.replace(this.u.n, "").replace("_", "");
                            const d = document.createElement('div'); d.className = "card"; d.style.cursor="pointer";
                            d.innerHTML = `<div style="display:flex; align-items:center; gap:10px;"><i class="fa fa-user-circle" style="color:var(--p)"></i> Чат с <b>${other}</b></div>`;
                            d.onclick = () => core.openChat(other);
                            l.appendChild(d);
                        }
                    });
                });
            },

            openChat(nick) {
                if(nick === this.u.n) return;
                this.targetChat = nick;
                document.getElementById('chat-list-ui').style.display='none';
                document.getElementById('chat-active-ui').style.display='block';
                document.getElementById('chat-with-nick').innerText = nick;
                const id = [this.u.n, nick].sort().join('_');
                window.fb.onValue(window.fb.ref(window.fb.db, 'chats/'+id), s => {
                    const box = document.getElementById('chat-box');
                    box.innerHTML = s.val() ? Object.values(s.val()).map(m => `
                        <div class="msg ${m.f===this.u.n?'me':'them'}">
                            ${m.img?`<img src="${m.img}" style="width:100%; border-radius:10px; margin-bottom:5px;">`:''}
                            ${m.t || ''}
                        </div>
                    `).join('') : "";
                    box.scrollTop = box.scrollHeight;
                });
            },

            sendMsg() {
                const t = document.getElementById('msg-input').value; if(!t) return;
                const id = [this.u.n, this.targetChat].sort().join('_');
                window.fb.push(window.fb.ref(window.fb.db, 'chats/'+id), { f: this.u.n, t, ts: Date.now() });
                document.getElementById('msg-input').value = "";
            },

            sendImg(i) {
                const f = i.files[0]; if(!f) return;
                const r = new FileReader(); r.onload = (e) => {
                    const id = [this.u.n, this.targetChat].sort().join('_');
                    window.fb.push(window.fb.ref(window.fb.db, 'chats/'+id), { f: this.u.n, img: e.target.result, ts: Date.now() });
                }; r.readAsDataURL(f);
            },

            ctCreate() {
                const name = document.getElementById('ct-new-name').value;
                if(this.u.b < 500) return alert("Недостаточно средств (нужно 500 €)!");
                this.u.b -= 500; this.sync();
                const nC = window.fb.push(window.fb.ref(window.fb.db, 'cartels'));
                window.fb.set(nC, { name, owner: this.u.n, fid: nC.key, m: [{n: this.u.n, r: 'БОСС'}] });
            },

            renderCt() {
                const my = this.cartels.find(c => c.owner === this.u.n || c.m.some(m => m.n === this.u.n));
                if(my) {
                    document.getElementById('ct-setup').style.display='none';
                    document.getElementById('ct-panel').style.display='block';
                    document.getElementById('ct-name').innerText = my.name;
                    document.getElementById('ct-owner-info').innerText = 'Основатель: ' + my.owner;
                    document.getElementById('ct-members').innerHTML = my.m.map((m, i) => `
                        <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                            <span>${m.n} — <b style="color:var(--p)">${m.r}</b></span>
                            ${my.owner === this.u.n && m.n !== this.u.n ? `<i class="fa fa-times-circle" style="color:var(--h)" onclick="core.ctKick('${my.fid}', ${i})"></i>` : ''}
                        </div>
                    `).join('');
                    document.getElementById('ct-admin-tools').style.display = my.owner === this.u.n ? 'block' : 'none';
                    document.getElementById('ct-del-btn').style.display = my.owner === this.u.n ? 'block' : 'none';
                    document.getElementById('ct-del-btn').onclick = () => { if(confirm("Удалить картель навсегда?")) window.fb.remove(window.fb.ref(window.fb.db, 'cartels/'+my.fid)); };
                } else {
                    document.getElementById('ct-setup').style.display='block';
                    document.getElementById('ct-panel').style.display='none';
                }
            },

            ctAdd() {
                const n = document.getElementById('ct-add-n').value, r = document.getElementById('ct-add-r').value;
                const my = this.cartels.find(c => c.owner === this.u.n);
                if(my && n) {
                    my.m.push({ n, r: r || 'Боец' });
                    window.fb.update(window.fb.ref(window.fb.db, 'cartels/'+my.fid), { m: my.m });
                }
            },

            ctKick(fid, idx) {
                const c = this.cartels.find(x => x.fid === fid);
                c.m.splice(idx, 1);
                window.fb.update(window.fb.ref(window.fb.db, 'cartels/'+fid), { m: c.m });
            },

            publish() {
                const n = document.getElementById('in-name').value, p = document.getElementById('in-price').value, s = document.getElementById('in-stock').value, f = document.getElementById('in-file').files[0];
                if(!n || !p || !f) return alert("Заполни все поля и выбери фото!");
                const r = new FileReader(); r.onload = (e) => {
                    const nL = window.fb.push(window.fb.ref(window.fb.db, 'market'));
                    window.fb.set(nL, { name: n, price: Number(p), stock: Number(s)||1, desc: document.getElementById('in-desc').value, img: e.target.result, seller: this.u.n, fid: nL.key });
                    ui.modal('add');
                }; r.readAsDataURL(f);
            },

            async transfer() {
                const to = document.getElementById('bnk-to').value, val = Number(document.getElementById('bnk-val').value);
                if(val <= 0 || this.u.b < val) return alert("Ошибка суммы!");
                this.u.b -= val; await this.sync(); alert("Перевод успешно отправлен!");
            },

            aiAsk() {
                const q = document.getElementById('ai-in').value; if(!q) return;
                const box = document.getElementById('ai-chat');
                box.innerHTML += `<div class="msg me">${q}</div>`;
                document.getElementById('ai-in').value = "";
                setTimeout(() => {
                    box.innerHTML += `<div class="msg them">Анализирую... По моему прогнозу, рынок Dragon V27 стабилен. Не забывайте подтверждать сделки для получения рейтинга!</div>`;
                    box.scrollTop = box.scrollHeight;
                }, 800);
            },

            toggleFav(fid) {
                this.u.favs = this.u.favs || [];
                if(this.u.favs.includes(fid)) this.u.favs = this.u.favs.filter(x => x !== fid);
                else this.u.favs.push(fid);
                this.sync();
            },

            renderFav() {
                const l = document.getElementById('fav-render');
                const list = this.items.filter(it => this.u.favs?.includes(it.fid));
                l.innerHTML = list.length ? list.map(it => `<div class="card"><b>${it.name}</b> — ${it.price} ${this.cur} <i class="fa fa-trash" style="float:right; color:var(--h); cursor:pointer;" onclick="core.toggleFav('${it.fid}')"></i></div>`).join('') : "Список избранного пуст.";
            },

            logout() { localStorage.removeItem('dr_sess'); location.reload(); },
            sync() { return window.fb.set(window.fb.ref(window.fb.db, 'users/'+this.u.n), this.u); },
            updAva(i) { const f = i.files[0]; const r = new FileReader(); r.onload = (e) => { this.u.a = e.target.result; this.sync(); }; r.readAsDataURL(f); },
            setCur(v) { this.cur = v; this.updUI(); this.renderM(); },
            delLot(fid) { if(confirm("Удалить этот товар?")) window.fb.remove(window.fb.ref(window.fb.db, 'market/'+fid)); }
        };

        const ui = {
            show(id) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById('scr-'+id).classList.add('active');
                document.querySelectorAll('.nav-i').forEach(i => i.classList.remove('active'));
                const map = {market:0, deals:1, cartel:2, chat:3, ai:4, prof:5};
                if(map[id] !== undefined) document.querySelectorAll('.nav-i')[map[id]].classList.add('active');
            },
            toggleAuth() {
                core.isReg = !core.isReg;
                document.getElementById('reg-ext').style.display = core.isReg ? 'block' : 'none';
                document.getElementById('btn-auth-action').innerText = core.isReg ? 'ЗАРЕГИСТРИРОВАТЬСЯ' : 'ВОЙТИ';
                document.getElementById('auth-toggle').innerText = core.isReg ? 'Уже есть аккаунт? Войти' : 'Создать новый аккаунт';
            },
            modal(id) {
                const m = document.getElementById('mod-'+id);
                m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
            },
            backToChats() {
                document.getElementById('chat-active-ui').style.display='none';
                document.getElementById('chat-list-ui').style.display='block';
            },
            setTheme(v) { document.body.className = v; }
        };

        window.onload = async () => {
            const saved = localStorage.getItem('dr_sess');
            if(saved) {
                const s = await window.fb.get(window.fb.ref(window.fb.db, 'users/'+saved));
                if(s.exists()) { core.u = s.val(); core.boot(); }
            }
        };
    </script>
</body>
</html>
