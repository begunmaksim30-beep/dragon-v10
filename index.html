<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRAGON V11 | NETWORK</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Inter:wght@300;400;600;800&display=swap');
        
        :root { --primary: #d946ef; --accent: #22c55e; --bg: #030303; --card: #0f0f0f; --border: #1f1f1f; --text: #fff; }
        body.theme-blood { --primary: #ff0033; --bg: #0d0101; --border: #440000; }
        body.theme-gold { --primary: #facc15; --bg: #0d0d01; --border: #444400; }

        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background:var(--bg); color:var(--text); height: 100vh; overflow: hidden; }
        
        .notif { position: fixed; top: 15px; right: 15px; background: var(--card); border-left: 4px solid var(--primary); padding: 12px; border-radius: 8px; animation: slide 0.3s forwards; z-index: 10000; border: 1px solid var(--border); }
        @keyframes slide { from { transform: translateX(120%); } to { transform: translateX(0); } }

        .screen { display:none; padding:80px 15px 100px; height: 100vh; overflow-y: auto; }
        .screen.active { display:block; }

        .card { background:var(--card); border-radius:16px; padding:15px; margin-bottom:10px; border:1px solid var(--border); }
        .btn { background: var(--primary); color:white; border:none; padding:12px; border-radius:10px; font-weight:800; width:100%; font-size: 11px; text-transform: uppercase; cursor: pointer; }
        .btn:active { transform: scale(0.96); }
        .btn-sec { background: #1a1a1a; border: 1px solid var(--border); }
        
        input, select, textarea { background: #000; border: 1px solid var(--border); color:white; padding:12px; border-radius:10px; width:100%; margin-bottom:8px; outline:none; }
        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:5000; display:none; align-items:center; justify-content:center; padding:20px; }
        
        nav { position:fixed; bottom:15px; left:50%; transform: translateX(-50%); width:95%; max-width: 450px; height:60px; background: rgba(15,15,15,0.9); backdrop-filter: blur(10px); display:flex; justify-content:space-around; align-items:center; border-radius:20px; border:1px solid var(--border); z-index:1000; }
        .nav-btn { font-size:18px; color:#555; transition: 0.3s; }
        .nav-btn.active { color:var(--primary); transform: translateY(-2px); text-shadow: 0 0 10px var(--primary); }
        
        header { position:fixed; top:0; width:100%; height:60px; background: rgba(0,0,0,0.8); backdrop-filter:blur(10px); display:flex; justify-content:space-between; align-items:center; padding:0 15px; z-index:1000; border-bottom:1px solid var(--border); }
        
        .p-img { width: 100%; aspect-ratio: 1; border-radius: 10px; object-fit: cover; background: #111; }
        .chat-msg { padding: 8px 12px; border-radius: 12px; max-width: 80%; margin-bottom: 5px; font-size: 13px; }
        .me { align-self: flex-end; background: var(--primary); color: #fff; }
        .them { align-self: flex-start; background: #222; }

        /* СЕТЕВОЙ ИНДИКАТОР */
        .net-status { width: 10px; height: 10px; border-radius: 50%; background: #333; display: inline-block; margin-right: 5px; }
        .net-online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    </style>
</head>
<body>

    <div id="notif-container"></div>

    <div id="auth-screen" style="position:fixed; inset:0; background:#000; z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px;">
        <div class="card" style="width:100%; max-width:320px; text-align:center;">
            <h1 style="color:var(--primary); font-family: 'Orbitron'; margin-bottom:20px;">DRAGON V11</h1>
            <input type="text" id="l-name" placeholder="Логин">
            <input type="password" id="l-pass" placeholder="Пароль">
            <button class="btn" onclick="app.login()">ВОЙТИ</button>
            <p style="margin-top:15px; font-size:10px; opacity:0.5; cursor:pointer;" onclick="app.reg()">Нет аккаунта? Регистрация</p>
        </div>
    </div>

    <header id="main-header" style="display:none;">
        <div style="display:flex; align-items:center; gap:10px;" onclick="app.setScreen('profile')">
            <img id="h-img" src="" style="width:35px; height:35px; border-radius:8px; border:2px solid var(--primary);">
            <div><b id="h-name">User</b><div style="font-size:9px; opacity:0.7;"><span id="net-dot" class="net-status"></span><span id="net-text">OFFLINE</span></div></div>
        </div>
        <div id="h-bal" style="color:var(--accent); font-weight:900;">$0</div>
    </header>

    <div id="market-screen" class="screen">
        <button class="btn" style="margin-bottom:10px;" onclick="document.getElementById('sell-modal').style.display='flex'">+ ДОБАВИТЬ ТОВАР</button>
        <div id="p-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"></div>
    </div>

    <div id="cart-screen" class="screen">
        <h3>КОРЗИНА</h3><div id="cart-items" style="margin:15px 0;"></div>
        <div class="card">ИТОГО: <b id="cart-total" style="color:var(--accent)">0</b></div>
        <button class="btn" onclick="app.checkout()">КУПИТЬ</button>
    </div>

    <div id="cartel-screen" class="screen">
        <div id="c-none" class="card" style="text-align:center;">
            <h2>КАРТЕЛЬ</h2><p>Цена: 500</p>
            <input id="cn-name" placeholder="Название"><button class="btn" onclick="app.createCartel()">СОЗДАТЬ</button>
        </div>
        <div id="c-view" style="display:none;">
            <div class="card"><h2 id="cv-name"></h2></div>
            <input id="am-id" placeholder="ID Игрока"><input id="am-rank" placeholder="Ранг">
            <button class="btn btn-sec" onclick="app.addMember()">ДОБАВИТЬ</button>
            <div id="cartel-list" style="margin-top:10px;"></div>
        </div>
    </div>

    <div id="chat-screen" class="screen">
        <select id="chat-sel" onchange="app.openChat(this.value)" style="margin-bottom:10px;"></select>
        <div id="chat-box" class="card" style="height:300px; overflow-y:auto; display:flex; flex-direction:column; gap:5px;"></div>
        <div style="display:flex; gap:5px;">
            <input id="chat-in" placeholder="Сообщение..."><button class="btn" style="width:50px;" onclick="app.sendMsg()">></button>
        </div>
    </div>

    <div id="profile-screen" class="screen">
        <div class="card" style="text-align:center;">
            <img id="p-img" src="" style="width:80px; height:80px; border-radius:20px; margin-bottom:10px;">
            <h2 id="p-name">USER</h2>
            <p id="p-id" style="font-size:10px; opacity:0.5;">ID: 0</p>
        </div>
        
        <div class="card" style="border-color:var(--primary);">
            <h3>📡 СЕТЬ (МУЛЬТИПЛЕЕР)</h3>
            <p style="font-size:10px; opacity:0.7; margin-bottom:10px;">Чтобы играть вместе, один должен быть СЕРВЕРОМ, а другой ПОДКЛЮЧИТЬСЯ.</p>
            
            <div id="net-host-panel">
                <button class="btn" onclick="net.startHost()">СТАТЬ СЕРВЕРОМ (ДЛЯ ПК)</button>
            </div>
            <div id="net-join-panel" style="margin-top:10px;">
                <input id="net-dest-id" placeholder="Введите ID Сервера">
                <button class="btn btn-sec" onclick="net.connectToHost()">ПОДКЛЮЧИТЬСЯ (ДЛЯ ТЕЛЕФОНА)</button>
            </div>
            <div id="net-info" style="margin-top:10px; font-weight:bold; color:var(--accent);"></div>
        </div>

        <div class="card">
            <h3>Настройки</h3>
            <select onchange="app.setTheme(this.value)">
                <option value="">Тема: Стандарт</option><option value="blood">Тема: Кровь</option><option value="gold">Тема: Золото</option>
            </select>
            <button class="btn btn-danger" onclick="app.logout()">ВЫЙТИ</button>
        </div>
    </div>

    <div id="sell-modal" class="modal"><div class="m-content">
        <h3>Новый товар</h3>
        <input id="s-title" placeholder="Имя"><input id="s-price" placeholder="Цена"><input id="s-img" type="file" accept="image/*">
        <button class="btn" onclick="app.publish()">ОПУБЛИКОВАТЬ</button>
        <button class="btn btn-sec" onclick="document.getElementById('sell-modal').style.display='none'">X</button>
    </div></div>

    <script>
        // === БАЗА ДАННЫХ И ПРИЛОЖЕНИЕ ===
        const app = {
            db: { users: [], items: [], cart: [], cartel: null, msgs: [] },
            user: null, 
            chatTo: null,

            login() {
                const n = document.getElementById('l-name').value;
                const p = document.getElementById('l-pass').value;
                let u = (n === 'admin' && p === 'admin') 
                    ? { name: 'ADMIN', bal: 25000, id: 'ADMIN-X7' } 
                    : this.db.users.find(u => u.name === n);
                
                if(!u) return alert("Неверно!");
                this.user = u; this.boot();
            },
            reg() {
                const n = document.getElementById('l-name').value;
                const p = document.getElementById('l-pass').value;
                if(!n) return alert("Имя!");
                const u = { name: n, pass: p, bal: 5000, id: 'U-' + Math.floor(Math.random()*9000), ava: 'https://api.dicebear.com/7.x/pixel-art/svg?seed='+n };
                this.db.users.push(u); localStorage.setItem('V11DB', JSON.stringify(this.db)); alert("Создан!");
            },
            boot() {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-header').style.display = 'flex';
                this.upd(); this.setScreen('market');
            },
            async publish() {
                const t = document.getElementById('s-title').value, p = document.getElementById('s-price').value, f = document.getElementById('s-img').files[0];
                if(!f) return;
                const reader = new FileReader(); reader.onload = (e) => {
                    this.db.items.push({ id: Date.now(), name: t, price: Number(p), img: e.target.result, sid: this.user.id, sname: this.user.name });
                    net.sync(); this.upd(); document.getElementById('sell-modal').style.display='none';
                }; reader.readAsDataURL(f);
            },
            createCartel() {
                if(this.user.bal < 500) return alert("Мало денег!");
                this.user.bal -= 500;
                this.db.cartel = { name: document.getElementById('cn-name').value, owner: this.user.id, members: [{n:this.user.name, r:'BOSS'}] };
                net.sync(); this.upd();
            },
            addMember() {
                const mid = document.getElementById('am-id').value;
                if(this.db.cartel && this.db.cartel.owner === this.user.id) {
                    this.db.cartel.members.push({ n: 'Игрок '+mid, r: document.getElementById('am-rank').value });
                    net.sync(); this.upd();
                }
            },
            openChat(pid) {
                this.chatTo = pid;
                document.getElementById('chat-box').innerHTML = this.db.msgs
                    .filter(m => (m.f === this.user.id && m.t === pid) || (m.t === this.user.id && m.f === pid))
                    .map(m => `<div class="chat-msg ${m.f===this.user.id?'me':'them'}">${m.txt}</div>`).join('');
            },
            sendMsg() {
                const txt = document.getElementById('chat-in').value;
                if(!txt || !this.chatTo) return;
                this.db.msgs.push({ f: this.user.id, t: this.chatTo, txt, time: Date.now() });
                net.sync(); this.openChat(this.chatTo); document.getElementById('chat-in').value='';
            },
            upd() {
                document.getElementById('h-name').innerText = this.user.name;
                document.getElementById('h-bal').innerText = '$' + this.user.bal;
                document.getElementById('p-name').innerText = this.user.name;
                document.getElementById('p-id').innerText = 'ID: ' + this.user.id;
                
                // Рендер товаров
                document.getElementById('p-grid').innerHTML = this.db.items.map(i => `
                    <div class="card" style="padding:10px;">
                        <img src="${i.img}" class="p-img"><b>${i.name}</b><br><span style="color:#22c55e">$${i.price}</span>
                        <button class="btn" style="margin-top:5px;" onclick="app.cartAdd(${i.id})">В КОРЗИНУ</button>
                    </div>`).join('');

                // Картель
                const c = this.db.cartel;
                document.getElementById('c-none').style.display = c ? 'none' : 'block';
                document.getElementById('c-view').style.display = c ? 'block' : 'none';
                if(c) {
                    document.getElementById('cv-name').innerText = c.name;
                    document.getElementById('cartel-list').innerHTML = c.members.map(m=>`<div><b>${m.n}</b>: ${m.r}</div>`).join('');
                }

                // Чат селектор
                document.getElementById('chat-sel').innerHTML = '<option>Выбрать...</option>' + 
                    this.db.users.filter(u=>u.id!==this.user.id).map(u=>`<option value="${u.id}">${u.name}</option>`).join('');
            },
            cartAdd(id) { this.db.cart.push(id); alert("Добавлено!"); },
            checkout() { 
                let tot = 0; this.db.cart.forEach(id => { let i = this.db.items.find(x=>x.id===id); if(i) tot+=i.price; });
                if(this.user.bal >= tot) { this.user.bal -= tot; this.db.cart=[]; net.sync(); this.upd(); alert("Куплено!"); }
                else alert("Нет денег!");
            },
            setScreen(id) { document.querySelectorAll('.screen').forEach(s=>s.style.display='none'); document.getElementById(id+'-screen').style.display='block'; },
            setTheme(t) { document.body.className = 'theme-'+t; },
            logout() { location.reload(); }
        };

        // === СЕТЕВОЙ МОДУЛЬ (P2P) ===
        const net = {
            peer: null, conn: null, isHost: false,
            
            startHost() {
                this.peer = new Peer(null, { debug: 2 });
                this.peer.on('open', (id) => {
                    this.isHost = true;
                    document.getElementById('net-info').innerHTML = `ВАШ ID СЕРВЕРА:<br><span style="font-size:20px; color:#fff; background:#222; padding:5px;">${id}</span><br>(Скопируй это на телефон)`;
                    document.getElementById('net-dot').className = 'net-status net-online';
                    document.getElementById('net-text').innerText = 'СЕРВЕР (HOST)';
                });
                this.peer.on('connection', (c) => {
                    this.conn = c;
                    c.on('open', () => { 
                        alert("ТЕЛЕФОН ПОДКЛЮЧИЛСЯ!"); 
                        this.sync(); // Отправить базу телефону
                    });
                    c.on('data', (data) => {
                        if(data.type === 'SYNC_REQ') { app.db = data.db; app.upd(); } // Если телефон что-то изменил
                    });
                });
            },

            connectToHost() {
                const destId = document.getElementById('net-dest-id').value;
                if(!destId) return alert("Введите ID!");
                this.peer = new Peer();
                this.peer.on('open', () => {
                    this.conn = this.peer.connect(destId);
                    this.conn.on('open', () => {
                        document.getElementById('net-dot').className = 'net-status net-online';
                        document.getElementById('net-text').innerText = 'ПОДКЛЮЧЕН (CLIENT)';
                        document.getElementById('net-info').innerText = "Успешно подключено к ПК!";
                    });
                    this.conn.on('data', (data) => {
                        // Получили базу от сервера
                        if(data.type === 'DB_UPDATE') { app.db = data.db; app.upd(); }
                    });
                });
            },

            sync() {
                if(this.isHost && this.conn) {
                    this.conn.send({ type: 'DB_UPDATE', db: app.db });
                } else if (!this.isHost && this.conn) {
                    this.conn.send({ type: 'SYNC_REQ', db: app.db });
                }
                localStorage.setItem('V11DB', JSON.stringify(app.db));
            }
        };

        // Загрузка
        window.onload = () => {
            const saved = localStorage.getItem('V11DB');
            if(saved) app.db = JSON.parse(saved);
        };
    </script>
</body>
</html>
