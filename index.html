<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAGON MARKET | ULTIMATE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --accent: #f59e0b; --bg: #0b0f1a; }
        body { 
            background-color: var(--bg); 
            color: white; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            background-size: cover; 
            background-position: center;
            background-attachment: fixed;
            font-family: 'Inter', sans-serif;
        }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Themes */
        .gold-theme { --accent: #fbbf24; --bg: #1c1917; }
        .red-theme { --accent: #ef4444; --bg: #1a0505; }
        .green-theme { --accent: #22c55e; --bg: #051a05; }
        .gold-card { border: 1px solid #fbbf24; box-shadow: 0 0 15px rgba(251, 191, 36, 0.2); }
        
        .avatar-video { object-fit: cover; border-radius: 50%; width: 100%; height: 100%; }
        input[type="password"] { -webkit-text-security: disc; }
    </style>
</head>
<body class="min-h-screen pb-24">

    <div id="auth-screen" class="fixed inset-0 z-[100] bg-black flex items-center justify-center p-4">
        <div class="glass p-8 rounded-3xl w-full max-w-md shadow-2xl">
            <h1 class="text-5xl font-black mb-8 text-center text-amber-500 tracking-tighter">DRAGON<span class="text-white">ID</span></h1>
            <div class="space-y-4">
                <input type="text" id="auth-nick" placeholder="Никнейм" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none focus:border-amber-500 transition">
                <input type="password" id="auth-pass" placeholder="Пароль" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none focus:border-amber-500 transition">
                <input type="password" id="auth-pass-confirm" placeholder="Повторите пароль" class="w-full bg-white/5 p-4 rounded-2xl border border-white/10 outline-none focus:border-amber-500 transition hidden">
                <button onclick="processAuth()" class="w-full bg-amber-500 p-4 rounded-2xl font-black text-black hover:scale-[1.02] active:scale-95 transition" id="main-auth-btn">ВОЙТИ</button>
                <p id="auth-error" class="text-red-500 text-sm text-center hidden">Ошибка доступа</p>
                <p onclick="toggleAuthMode()" class="text-center text-gray-400 cursor-pointer text-sm" id="mode-toggle">Еще нет аккаунта? Создать</p>
            </div>
        </div>
    </div>

    <header class="p-4 glass sticky top-0 z-50 flex justify-between items-center border-b border-white/5">
        <div class="flex items-center gap-4">
            <div class="relative w-12 h-12" id="avatar-container">
                </div>
            <div>
                <p id="ui-nick" class="font-bold text-lg leading-tight">Загрузка...</p>
                <p id="ui-id" class="text-[10px] text-amber-500 font-mono tracking-widest uppercase">ID: 00000</p>
            </div>
        </div>
        <div class="text-right">
            <p id="ui-balance" class="text-2xl font-black text-green-400">0.00 €</p>
            <div class="flex items-center justify-end gap-2 text-[10px] opacity-60">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                ONLINE: <span id="online-val">2,481</span>
            </div>
        </div>
    </header>

    <main class="p-4 max-w-5xl mx-auto">
        <div id="tab-market" class="tab-content active">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-black uppercase italic">Витрина</h2>
                <button onclick="openSellModal()" class="bg-white text-black px-6 py-2 rounded-full font-bold hover:bg-amber-500 transition">+ ВЫСТАВИТЬ</button>
            </div>
            <div id="market-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                </div>
        </div>

        <div id="tab-chat" class="tab-content">
            <h2 class="text-3xl font-black mb-6 uppercase">Мессенджер</h2>
            <div class="glass rounded-3xl overflow-hidden flex flex-col h-[65vh]">
                <div id="chat-messages" class="flex-1 p-6 overflow-y-auto space-y-4 bg-black/20"></div>
                <div class="p-4 border-t border-white/5 flex gap-2 items-center bg-black/40">
                    <input type="text" id="chat-target" placeholder="Кому (Ник)" class="w-24 bg-white/5 p-3 rounded-xl text-xs outline-none">
                    <input type="text" id="chat-input" placeholder="Введите сообщение..." class="flex-1 bg-white/5 p-3 rounded-xl outline-none">
                    <button onclick="sendMsg()" class="bg-amber-500 text-black p-3 rounded-xl w-12"><i class="fa fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <div id="tab-cartel" class="tab-content">
            <h2 class="text-3xl font-black mb-6 text-red-500 uppercase italic">Картели</h2>
            <div id="cartel-main-ui"></div>
        </div>

        <div id="tab-settings" class="tab-content">
            <h2 class="text-3xl font-black mb-6 uppercase">Настройки</h2>
            <div class="space-y-4">
                <div class="glass p-6 rounded-3xl">
                    <p class="font-bold mb-4 opacity-50 uppercase text-xs tracking-widest">Персонализация</p>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="triggerFile('avatar-up')" class="bg-white/5 p-4 rounded-2xl hover:bg-white/10 transition">Сменить аватар (Видео/Фото)</button>
                        <button onclick="triggerFile('bg-up')" class="bg-white/5 p-4 rounded-2xl hover:bg-white/10 transition">Изменить фон</button>
                    </div>
                </div>
                <div class="glass p-6 rounded-3xl">
                    <p class="font-bold mb-4 opacity-50 uppercase text-xs tracking-widest">Тема и Валюта</p>
                    <select onchange="updateCurrency(this.value)" class="w-full bg-white/5 p-4 rounded-2xl mb-3 outline-none">
                        <option value="EUR">Валюта: EURO (€)</option>
                        <option value="USD">Валюта: USD ($)</option>
                        <option value="RUB">Валюта: RUB (₽)</option>
                    </select>
                    <div class="flex gap-2">
                        <div onclick="setGlobalTheme('default')" class="w-8 h-8 rounded-full bg-slate-800 cursor-pointer border-2 border-white"></div>
                        <div onclick="setGlobalTheme('gold')" class="w-8 h-8 rounded-full bg-amber-500 cursor-pointer"></div>
                        <div onclick="setGlobalTheme('red')" class="w-8 h-8 rounded-full bg-red-600 cursor-pointer"></div>
                        <div onclick="setGlobalTheme('green')" class="w-8 h-8 rounded-full bg-green-500 cursor-pointer"></div>
                    </div>
                </div>
                <button onclick="logout()" class="w-full p-4 text-red-500 font-bold opacity-50">Выйти из аккаунта</button>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 glass p-4 flex justify-around items-center border-t border-white/5 z-50">
        <button onclick="nav('market')" class="nav-btn text-amber-500"><i class="fa fa-dragon text-2xl"></i></button>
        <button onclick="nav('chat')" class="nav-btn"><i class="fa fa-comment-alt text-2xl"></i></button>
        <button onclick="nav('cartel')" class="nav-btn"><i class="fa fa-skull text-2xl"></i></button>
        <button onclick="nav('settings')" class="nav-btn"><i class="fa fa-user-ninja text-2xl"></i></button>
    </nav>

    <input type="file" id="avatar-up" class="hidden" accept="video/*,image/*" onchange="uploadMedia(this, 'avatar')">
    <input type="file" id="bg-up" class="hidden" accept="image/*" onchange="uploadMedia(this, 'bg')">

    <script>
        // --- DATABASE SYSTEM (LOCAL) ---
        let db = {
            users: JSON.parse(localStorage.getItem('dg_users')) || [],
            products: JSON.parse(localStorage.getItem('dg_prods')) || [],
            deals: JSON.parse(localStorage.getItem('dg_deals')) || [],
            cartels: JSON.parse(localStorage.getItem('dg_cartels')) || [],
            messages: JSON.parse(localStorage.getItem('dg_msgs')) || []
        };

        let currentSession = JSON.parse(localStorage.getItem('dg_session')) || null;
        let isRegister = false;

        function save() {
            localStorage.setItem('dg_users', JSON.stringify(db.users));
            localStorage.setItem('dg_prods', JSON.stringify(db.products));
            localStorage.setItem('dg_deals', JSON.stringify(db.deals));
            localStorage.setItem('dg_cartels', JSON.stringify(db.cartels));
            localStorage.setItem('dg_msgs', JSON.stringify(db.messages));
            localStorage.setItem('dg_session', JSON.stringify(currentSession));
        }

        // --- AUTH LOGIC ---
        function toggleAuthMode() {
            isRegister = !isRegister;
            document.getElementById('auth-pass-confirm').classList.toggle('hidden');
            document.getElementById('main-auth-btn').innerText = isRegister ? "СОЗДАТЬ АККАУНТ" : "ВОЙТИ";
            document.getElementById('mode-toggle').innerText = isRegister ? "Уже есть аккаунт? Войти" : "Еще нет аккаунта? Создать";
        }

        function processAuth() {
            const nick = document.getElementById('auth-nick').value.trim();
            const pass = document.getElementById('auth-pass').value;
            const err = document.getElementById('auth-error');

            if (!nick || !pass) {
                showErr("Заполните поля");
                return;
            }

            if (isRegister) {
                const conf = document.getElementById('auth-pass-confirm').value;
                if (pass !== conf) return showErr("Пароли не совпадают");
                if (db.users.find(u => u.nick === nick)) return showErr("Ник занят");

                const newUser = {
                    nick, pass,
                    id: Math.floor(10000 + Math.random() * 89999),
                    balance: nick.toLowerCase() === 'admin' ? 25000 : 5000,
                    avatar: '', is_video: false,
                    theme: 'default', currency: 'EUR',
                    favorites: [], rating: 5.0, reviews: [],
                    is_admin: nick.toLowerCase() === 'admin'
                };
                db.users.push(newUser);
                currentSession = newUser;
                save();
                enterSystem();
            } else {
                const user = db.users.find(u => u.nick === nick && u.pass === pass);
                if (user) {
                    currentSession = user;
                    save();
                    enterSystem();
                } else {
                    showErr("Ошибка: Неверный логин или пароль");
                }
            }
        }

        function showErr(t) {
            const e = document.getElementById('auth-error');
            e.innerText = t; e.classList.remove('hidden');
        }

        function enterSystem() {
            document.getElementById('auth-screen').style.display = 'none';
            renderAll();
        }

        // --- UI RENDERING ---
        function renderAll() {
            if (!currentSession) return;
            
            // Header
            document.getElementById('ui-nick').innerText = currentSession.nick;
            document.getElementById('ui-id').innerText = `ID: ${currentSession.id}`;
            document.getElementById('ui-balance').innerText = `${currentSession.balance.toLocaleString()} ${currentSession.currency === 'EUR' ? '€' : '$'}`;
            
            const avCont = document.getElementById('avatar-container');
            if (currentSession.avatar) {
                avCont.innerHTML = currentSession.is_video 
                    ? `<video src="${currentSession.avatar}" autoplay loop muted class="avatar-video border-2 border-amber-500"></video>`
                    : `<img src="${currentSession.avatar}" class="avatar-video border-2 border-amber-500">`;
            } else {
                avCont.innerHTML = `<div class="w-full h-full bg-amber-500 rounded-full flex items-center justify-center text-black font-bold">${currentSession.nick[0]}</div>`;
            }

            if (currentSession.customBG) {
                document.body.style.backgroundImage = `url(${currentSession.customBG})`;
            }

            renderMarket();
            renderCartels();
            renderChat();
        }

        function renderMarket() {
            const grid = document.getElementById('market-grid');
            grid.innerHTML = db.products.map(p => `
                <div class="glass rounded-3xl overflow-hidden group hover:border-amber-500/50 transition">
                    <div class="h-48 overflow-hidden relative">
                        <img src="${p.img}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                        <div class="absolute top-2 right-2 bg-black/60 px-3 py-1 rounded-full text-xs">★ ${p.rating || '5.0'}</div>
                    </div>
                    <div class="p-5">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-xl">${p.name}</h3>
                            <span class="text-green-400 font-black">${p.price} €</span>
                        </div>
                        <p class="text-gray-400 text-sm mb-4 line-clamp-2">${p.desc}</p>
                        <div class="flex items-center gap-2 mb-4">
                            <div class="w-6 h-6 rounded-full bg-white/10 flex items-center justify-center text-[10px]">${p.seller[0]}</div>
                            <span class="text-xs opacity-60">${p.seller}</span>
                            <span class="ml-auto text-[10px] bg-white/5 px-2 py-1 rounded uppercase tracking-tighter">Наличие: ${p.count}</span>
                        </div>
                        <button onclick="buyItem(${p.id})" class="w-full bg-white text-black py-3 rounded-2xl font-black hover:bg-amber-500 transition">КУПИТЬ СЕЙЧАС</button>
                    </div>
                </div>
            `).join('');
        }

        // --- MARKET LOGIC ---
        function openSellModal() {
            const name = prompt("Название товара:");
            const price = parseInt(prompt("Цена (€):"));
            const count = parseInt(prompt("Количество:"));
            if (!name || !price) return;

            // В реальном приложении тут был бы выбор файла, для прототипа используем заглушку
            const newProd = {
                id: Date.now(),
                name, price, count,
                desc: "Описание товара по умолчанию. Продавец гарантирует качество и быструю доставку.",
                seller: currentSession.nick,
                img: 'https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=500&auto=format&fit=crop',
                rating: 5.0
            };
            db.products.push(newProd);
            save();
            renderMarket();
        }

        function buyItem(id) {
            const p = db.products.find(x => x.id === id);
            if (p.seller === currentSession.nick) return alert("Свой товар купить нельзя");
            if (currentSession.balance < p.price) return alert("Недостаточно средств");

            // Escrow Logic
            currentSession.balance -= p.price;
            db.deals.push({
                id: Date.now(),
                buyer: currentSession.nick,
                seller: p.seller,
                amount: p.price,
                status: 'pending',
                item: p.name
            });
            
            p.count--;
            if(p.count <= 0) db.products = db.products.filter(x => x.id !== id);

            save();
            renderAll();
            alert("Сделка открыта! Деньги удержаны системой до вашего подтверждения.");
        }

        // --- CARTEL SYSTEM ---
        function renderCartels() {
            const cont = document.getElementById('cartel-main-ui');
            const myCartel = db.cartels.find(c => c.members.some(m => m.nick === currentSession.nick));

            if (!myCartel) {
                cont.innerHTML = `
                    <div class="glass p-10 rounded-3xl text-center border-dashed border-2 border-white/10">
                        <i class="fa fa-shield-virus text-6xl mb-6 text-red-600 opacity-20"></i>
                        <h3 class="text-2xl font-bold mb-2">Вне фракций</h3>
                        <p class="text-gray-400 mb-8 max-w-xs mx-auto">Создайте свой картель за 500 € и начните доминировать на рынке.</p>
                        <button onclick="createCartel()" class="bg-red-600 text-white px-8 py-4 rounded-2xl font-black hover:bg-red-500 transition shadow-lg shadow-red-900/20">ОСНОВАТЬ КАРТЕЛЬ (500 €)</button>
                    </div>
                `;
            } else {
                const isLeader = myCartel.leader === currentSession.nick;
                cont.innerHTML = `
                    <div class="glass p-6 rounded-3xl border-l-4 border-red-600">
                        <div class="flex justify-between items-center mb-6">
                            <div>
                                <h3 class="text-3xl font-black text-red-500 uppercase tracking-tighter">${myCartel.name}</h3>
                                <p class="text-[10px] opacity-40 uppercase">Боевая единица сформирована</p>
                            </div>
                            ${isLeader ? `<button onclick="disbandCartel(${myCartel.id})" class="text-[10px] text-red-800 hover:text-red-500">РАСПУСТИТЬ</button>` : ''}
                        </div>
                        <div class="space-y-2 mb-6">
                            ${myCartel.members.map(m => `
                                <div class="flex justify-between items-center bg-white/5 p-4 rounded-2xl">
                                    <div class="flex items-center gap-3">
                                        <div class="w-2 h-2 rounded-full bg-green-500"></div>
                                        <span class="font-bold">${m.nick}</span>
                                        <span class="text-[10px] bg-red-600/20 text-red-500 px-2 py-1 rounded uppercase font-black">${m.rank}</span>
                                    </div>
                                    ${(isLeader && m.nick !== currentSession.nick) ? `<button onclick="kickMember(${myCartel.id},'${m.nick}')" class="text-xs text-gray-500">ИСКЛЮЧИТЬ</button>` : ''}
                                </div>
                            `).join('')}
                        </div>
                        ${isLeader ? `
                            <div class="flex gap-2">
                                <input id="inv-nick" type="text" placeholder="Ник игрока" class="flex-1 bg-white/5 p-4 rounded-2xl outline-none border border-white/5 focus:border-red-500 transition">
                                <button onclick="addMember(${myCartel.id})" class="bg-white text-black px-6 rounded-2xl font-bold">ПРИГЛАСИТЬ</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }
        }

        function createCartel() {
            if (currentSession.balance < 500) return alert("Мало денег!");
            const name = prompt("Название вашего картеля:");
            if (!name) return;

            const c = {
                id: Date.now(),
                name: name.toUpperCase(),
                leader: currentSession.nick,
                members: [{ nick: currentSession.nick, rank: 'EL PATRON' }]
            };
            currentSession.balance -= 500;
            db.cartels.push(c);
            save();
            renderAll();
        }

        // --- UTILS ---
        function nav(t) {
            document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
            document.getElementById('tab-'+t).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('text-amber-500'));
            event.currentTarget.classList.add('text-amber-500');
        }

        function triggerFile(id) { document.getElementById(id).click(); }

        function uploadMedia(input, type) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                if (type === 'avatar') {
                    currentSession.avatar = e.target.result;
                    currentSession.is_video = file.type.includes('video');
                } else {
                    currentSession.customBG = e.target.result;
                }
                save();
                renderAll();
            };
            reader.readAsDataURL(file);
        }

        function logout() {
            currentSession = null;
            localStorage.removeItem('dg_session');
            location.reload();
        }

        function setGlobalTheme(t) {
            document.body.className = "min-h-screen pb-24 " + (t === 'default' ? '' : t + '-theme');
            currentSession.theme = t;
            save();
        }

        // Auto-login if session exists
        if (currentSession) {
            enterSystem();
        }
    </script>
</body>
</html>
