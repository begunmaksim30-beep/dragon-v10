<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DRAGON V23 | ULTIMATE MARKET</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, update, remove, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyADkxXfNqpjBaqBvP4DlkNfB_4ki7MMTSk",
            authDomain: "dragonmarket-70400.firebaseapp.com",
            databaseURL: "https://dragonmarket-70400-default-rtdb.firebaseio.com",
            projectId: "dragonmarket-70400",
            storageBucket: "dragonmarket-70400.firebasestorage.app",
            appId: "1:746821202210:web:bf35404eca9f096c3eb57b"
        };

        const appFB = initializeApp(firebaseConfig);
        const db = getDatabase(appFB);
        window.fb = { db, ref, set, onValue, push, update, remove, get };
    </script>

    <style>
        :root { --p: #d946ef; --bg: #050505; --c: #121212; --b: #252525; --t: #fff; --s: #22c55e; --h: #f43f5e; --gold: #fbbf24; }
        body.light { --bg: #f3f4f6; --t: #111; --c: #fff; --b: #ddd; }
        body.gold { --p: var(--gold); --bg: #0c0b00; --c: #1a1900; --b: #3a3800; }
        
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--t); height: 100vh; overflow: hidden; transition: 0.3s; }
        
        .screen { display:none; padding:80px 15px 100px; height: 100vh; overflow-y: auto; }
        .active { display:block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

        .card { background: var(--c); border: 1px solid var(--b); border-radius: 20px; padding: 15px; margin-bottom: 12px; position: relative; transition: 0.2s; }
        .btn { background: var(--p); color: #fff; border: none; padding: 12px; border-radius: 12px; font-weight: 700; width: 100%; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:active { transform: scale(0.96); }
        .btn-sec { background: var(--b); color: var(--t); }
        
        input, select, textarea { background: rgba(255,255,255,0.05); border: 1px solid var(--b); color: var(--t); padding: 14px; border-radius: 14px; width: 100%; margin-bottom: 12px; font-size: 16px; outline: none; }
        input:focus { border-color: var(--p); }

        header { position:fixed; top:0; width:100%; height:75px; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); display: flex; justify-content: space-between; align-items:center; padding: 0 15px; z-index: 1000; border-bottom: 1px solid var(--b); }
        nav { position:fixed; bottom:15px; left:50%; transform:translateX(-50%); width:92%; height:65px; background: rgba(15,15,15,0.95); border-radius: 25px; display:flex; justify-content: space-around; align-items:center; border: 1px solid var(--b); z-index: 1000; }
        .nav-i { font-size: 22px; color: #555; transition: 0.3s; }
        .nav-i.active { color: var(--p); text-shadow: 0 0 15px var(--p); }

        .p-img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 15px; background:#000; }
        .online-tag { font-size: 10px; color: var(--s); display: flex; align-items: center; gap: 4px; }
        .online-dot { width: 8px; height: 8px; background: var(--s); border-radius: 50%; box-shadow: 0 0 8px var(--s); }
        
        /* Escrow Badge */
        .escrow-status { font-size: 11px; padding: 4px 10px; border-radius: 20px; background: var(--b); display: inline-block; margin-bottom: 10px; }
    </style>
</head>
<body id="main-body">

    <div id="scr-auth" style="position:fixed; inset:0; background:var(--bg); z-index:10001; display:flex; align-items:center; justify-content:center; padding:20px;">
        <div class="card" style="width:100%; max-width:380px; text-align:center; border: 1px solid var(--p);">
            <h1 style="font-size:36px; color:var(--p); margin-bottom:10px;">DRAGON V23</h1>
            <p style="font-size:12px; opacity:0.5; margin-bottom:25px;">The Most Advanced Marketplace</p>
            
            <div id="auth-box">
                <input id="auth-n" placeholder="Никнейм">
                <input id="auth-p1" type="password" placeholder="Пароль">
                <div id="reg-fields" style="display:none;">
                    <input id="auth-p2" type="password" placeholder="Подтвердите пароль">
                </div>
                <button class="btn" id="main-auth-btn" onclick="core.auth()">ВОЙТИ</button>
                <p id="auth-toggle-text" onclick="ui.toggleAuth()" style="margin-top:20px; font-size:13px; color:var(--p); cursor:pointer;">Нет аккаунта? Зарегистрироваться</p>
            </div>
        </div>
    </div>

    <header id="ui-h" style="display:none">
        <div onclick="ui.show('prof')" style="display:flex; align-items:center; gap:12px; cursor:pointer;">
            <img id="h-ava" src="" style="width:42px; height:42px; border-radius:50%; border:2px solid var(--p); object-fit:cover;">
            <div>
                <b id="h-nick" style="font-size:15px;"></b>
                <div class="online-tag"><span class="online-dot"></span> Online</div>
            </div>
        </div>
        <div style="text-align:right;">
            <div id="h-bal" style="color:var(--s); font-weight:900; font-size:18px;"></div>
            <small id="h-uid" style="font-size:10px; opacity:0.4;"></small>
        </div>
    </header>

    <div id="scr-market" class="screen active">
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <button class="btn" onclick="ui.modal('add')"><i class="fa fa-plus-circle"></i> СОЗДАТЬ ЛОТ</button>
            <button class="btn btn-sec" style="width:60px;" onclick="ui.show('fav')"><i class="fa fa-heart"></i></button>
        </div>
        <div id="m-render"></div>
    </div>

    <div id="scr-deals" class="screen">
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <button class="btn" onclick="core.renderDeals('buy')">ПОКУПКИ</button>
            <button class="btn btn-sec" onclick="core.renderDeals('sell')">ПРОДАЖИ</button>
        </div>
        <div id="deals-render"></div>
    </div>

    <div id="scr-chat" class="screen">
        <div id="chat-ui" style="display:none;">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
                <button class="btn btn-sec" style="width:45px;" onclick="ui.closeChat()"><i class="fa fa-arrow-left"></i></button>
                <h3 id="chat-target-name">Чат</h3>
            </div>
            <div class="card" style="padding:0; overflow:hidden;">
                <div id="msg-render" style="height:350px; overflow-y:auto; padding:15px; display:flex; flex-direction:column; gap:10px;"></div>
                <div style="display:flex; gap:8px; padding:12px; background:rgba(0,0,0,0.2);">
                    <label style="padding:12px; cursor:pointer;"><i class="fa fa-image"></i><input type="file" hidden onchange="core.sendImg(this)"></label>
                    <input id="msg-input" placeholder="Сообщение..." style="margin:0;">
                    <button class="btn" style="width:60px;" onclick="core.sendMsg()"><i class="fa fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
        <div id="chat-list-ui">
            <h2>СООБЩЕНИЯ</h2>
            <div id="dialogs-render" style="margin-top:15px;"></div>
        </div>
    </div>

    <div id="scr-cartel" class="screen">
        <div id="ct-create-ui">
            <div class="card" style="text-align:center; padding:40px 20px;">
                <i class="fa fa-shield-cat" style="font-size:60px; color:var(--p); margin-bottom:20px;"></i>
                <h2>СОЗДАТЬ КАРТЕЛЬ</h2>
                <p style="opacity:0.6; margin:15px 0;">Стоимость: 500 €</p>
                <input id="ct-name-in" placeholder="Название картеля">
                <button class="btn" onclick="core.createCartel()">ОСНОВАТЬ</button>
            </div>
        </div>
        <div id="ct-manage-ui" style="display:none;">
            <div class="card" style="border-left:5px solid var(--p);">
                <h1 id="ct-title-disp"></h1>
                <button class="btn btn-sec" style="width:auto; padding:5px 15px; margin-top:10px; color:var(--h);" onclick="core.deleteCartel()">УДАЛИТЬ КАРТЕЛЬ</button>
            </div>
            <div class="card">
                <h4>ДОБАВИТЬ УЧАСТНИКА</h4>
                <div style="display:flex; gap:8px; margin-top:10px;">
                    <input id="ct-add-nick" placeholder="Ник игрока" style="margin:0;">
                    <input id="ct-add-role" placeholder="Должность" style="margin:0;">
                    <button class="btn" style="width:60px;" onclick="core.addMember()">+</button>
                </div>
                <div id="ct-members-list" style="margin-top:20px;"></div>
            </div>
        </div>
    </div>

    <div id="scr-prof" class="screen">
        <div class="card" style="text-align:center;">
            <div style="position:relative; display:inline-block;">
                <img id="p-ava" src="" style="width:110px; height:110px; border-radius:50%; object-fit:cover; border:3px solid var(--p);">
                <label style="position:absolute; bottom:5px; right:5px; background:var(--p); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;"><i class="fa fa-camera" style="font-size:14px;"></i><input type="file" hidden onchange="core.updateAva(this)"></label>
            </div>
            <h2 id="p-nick" style="margin-top:12px;"></h2>
            <div id="p-rating" style="color:var(--gold); font-weight:900; margin-top:5px;"></div>
            <div id="p-reg-date" style="font-size:11px; opacity:0.4; margin-top:5px;"></div>
        </div>
        
        <div class="card">
            <h4>БАНКОВСКИЙ ПЕРЕВОД</h4>
            <input id="transfer-uid" placeholder="5-значный ID получателя">
            <input id="transfer-sum" type="number" placeholder="Сумма">
            <button class="btn" onclick="core.bankTransfer()"><i class="fa fa-paper-plane"></i> ОТПРАВИТЬ</button>
        </div>

        <div class="card">
            <h4>НАСТРОЙКИ</h4>
            <p style="font-size:12px; margin-bottom:5px;">Валюта:</p>
            <select onchange="core.setCur(this.value)"><option value="€">EUR (€)</option><option value="$">USD ($)</option><option value="₽">RUB (₽)</option></select>
            <p style="font-size:12px; margin-bottom:5px;">Тема оформления:</p>
            <select onchange="ui.setTheme(this.value)"><option value="dark">Тёмная</option><option value="light">Светлая</option><option value="gold">Золотая</option></select>
            <button class="btn btn-sec" style="margin-top:15px;" onclick="location.reload()">ВЫЙТИ ИЗ АККАУНТА</button>
        </div>
    </div>

    <div id="mod-add" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:2000; padding:20px; display:flex; align-items:center;">
        <div class="card" style="width:100%;">
            <h3>НОВЫЙ ТОВАР</h3>
            <input id="lot-name" placeholder="Что продаете?">
            <input id="lot-price" type="number" placeholder="Цена">
            <textarea id="lot-desc" placeholder="Описание товара и условия авто-выдачи..."></textarea>
            <input type="file" id="lot-file">
            <button class="btn" onclick="core.publishLot()">ОПУБЛИКОВАТЬ</button>
            <button class="btn btn-sec" style="margin-top:10px;" onclick="ui.modal('add')">ОТМЕНА</button>
        </div>
    </div>

    <nav id="ui-n" style="display:none">
        <div class="nav-i active" onclick="ui.show('market')"><i class="fa fa-store"></i></div>
        <div class="nav-i" onclick="ui.show('deals')"><i class="fa fa-handshake"></i></div>
        <div class="nav-i" onclick="ui.show('cartel')"><i class="fa fa-skull-crossbones"></i></div>
        <div class="nav-i" onclick="ui.show('chat')"><i class="fa fa-comments"></i></div>
        <div class="nav-i" onclick="ui.show('prof')"><i class="fa fa-user-gear"></i></div>
    </nav>

    <script>
        const core = {
            u: null, isRegMode: false, cur: '€', items: [], cartels: [], deals: [],
            
            async auth() {
                const n = document.getElementById('auth-n').value, p1 = document.getElementById('auth-p1').value, p2 = document.getElementById('auth-p2').value;
                if(!n || !p1) return alert("Заполни все поля!");

                const s = await window.fb.get(window.fb.ref(window.fb.db, 'users/'+n));

                if(this.isRegMode) {
                    if(s.exists()) return alert("Никнейм занят!");
                    if(p1 !== p2) return alert("Пароли не совпадают!");
                    this.u = {
                        n, p: p1, uid: Math.floor(10000 + Math.random() * 89999),
                        b: (n === 'admin' ? 25000 : 5000), a: 'https://api.dicebear.com/7.x/avataaars/svg?seed='+n,
                        reg: new Date().toLocaleDateString(), reviews: []
                    };
                    await window.fb.set(window.fb.ref(window.fb.db, 'users/'+n), this.u);
                } else {
                    if(!s.exists() || s.val().p !== p1) return alert("Ошибка доступа! Проверьте данные.");
                    this.u = s.val();
                }

                document.getElementById('scr-auth').style.display = 'none';
                document.getElementById('ui-h').style.display = 'flex';
                document.getElementById('ui-n').style.display = 'flex';
                this.init();
            },

            init() {
                const { ref, onValue } = window.fb;
                onValue(ref(window.fb.db, 'market'), s => { this.items = s.val() ? Object.values(s.val()) : []; this.renderM(); });
                onValue(ref(window.fb.db, 'users/'+this.u.n), s => { if(s.exists()){ this.u = s.val(); this.updUI(); } });
                onValue(ref(window.fb.db, 'cartels'), s => { this.cartels = s.val() ? Object.values(s.val()) : []; this.renderCt(); });
                onValue(ref(window.fb.db, 'deals'), s => { this.deals = s.val() ? Object.values(s.val()) : []; this.renderDeals('buy'); });
            },

            updUI() {
                document.getElementById('h-nick').innerText = this.u.n;
                document.getElementById('p-nick').innerText = this.u.n;
                document.getElementById('h-uid').innerText = 'UID: ' + this.u.uid;
                document.getElementById('h-bal').innerText = this.u.b.toLocaleString() + ' ' + this.cur;
                document.getElementById('h-ava').src = this.u.a;
                document.getElementById('p-ava').src = this.u.a;
                document.getElementById('p-reg-date').innerText = 'В системе с ' + this.u.reg;
                const r = this.u.reviews?.length ? (this.u.reviews.reduce((a,b)=>a+b,0)/this.u.reviews.length).toFixed(1) : "Нет отзывов";
                document.getElementById('p-rating').innerText = '★ ' + r + ' (' + (this.u.reviews?.length || 0) + ')';
            },

            renderM() {
                const l = document.getElementById('m-render');
                l.innerHTML = this.items.map((it, i) => `
                    <div class="card">
                        <img src="${it.img}" class="p-img" onclick="ui.viewSeller('${it.sn}')">
                        <div style="margin-top:10px;">
                            <b style="font-size:16px;">${it.n}</b>
                            <p style="font-size:12px; opacity:0.6; margin:5px 0;">${it.d}</p>
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <span style="color:var(--s); font-weight:900; font-size:18px;">${it.p} ${this.cur}</span>
                                <span style="font-size:10px; opacity:0.4;">Продавец: ${it.sn}</span>
                            </div>
                        </div>
                        <div style="display:flex; gap:8px; margin-top:12px;">
                            <button class="btn" onclick="core.buyLot(${i})">КУПИТЬ</button>
                            <button class="btn btn-sec" style="width:50px;" onclick="core.openChat('${it.sn}')"><i class="fa fa-message"></i></button>
                            ${(this.u.n==='admin' || this.u.n===it.sn) ? `<button class="btn btn-sec" style="width:50px; color:var(--h);" onclick="core.delLot('${it.fid}')"><i class="fa fa-trash"></i></button>` : ''}
                        </div>
                    </div>
                `).join('');
            },

            async buyLot(i) {
                const it = this.items[i];
                if(this.u.b < it.p) return alert("Недостаточно средств!");
                if(it.sn === this.u.n) return alert("Свой товар купить нельзя!");

                if(confirm(`Оплатить ${it.p} ${this.cur}? Деньги будут удержаны системой до вашего подтверждения.`)) {
                    this.u.b -= it.p; 
                    await this.saveUser();
                    const newD = window.fb.push(window.fb.ref(window.fb.db, 'deals'));
                    await window.fb.set(newD, {
                        fid: newD.key, title: it.n, price: it.p, 
                        buyer: this.u.n, seller: it.sn, status: 'ESCROW', time: Date.now()
                    });
                    ui.show('deals');
                }
            },

            renderDeals(type) {
                const l = document.getElementById('deals-render');
                const list = type === 'buy' ? this.deals.filter(d => d.buyer === this.u.n) : this.deals.filter(d => d.seller === this.u.n);
                
                l.innerHTML = list.map(d => `
                    <div class="card" style="border-left: 4px solid ${d.status==='ESCROW'?'var(--gold)':'var(--s)'}">
                        <div class="escrow-status">${d.status === 'ESCROW' ? '🕒 В ХОЛДЕ (ГАРАНТ)' : '✅ ЗАВЕРШЕНО'}</div>
                        <h3>${d.title}</h3>
                        <p style="font-size:12px;">Сумма: ${d.price} ${this.cur} | ${type==='buy'?'Продавец: '+d.seller:'Покупатель: '+d.buyer}</p>
                        ${d.status === 'ESCROW' && type === 'buy' ? `
                            <div style="display:flex; gap:10px; margin-top:15px;">
                                <button class="btn" style="background:var(--s);" onclick="core.confirmDeal('${d.fid}')">ПОДТВЕРДИТЬ</button>
                                <button class="btn btn-sec" style="color:var(--h);" onclick="core.requestRefund('${d.fid}')">ВОЗВРАТ</button>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            },

            async confirmDeal(fid) {
                const d = this.deals.find(x => x.fid === fid);
                const star = prompt("Оцените продавца (1-5 звезд):", "5");
                
                const sRef = window.fb.ref(window.fb.db, 'users/'+d.seller);
                const snap = await window.fb.get(sRef);
                if(snap.exists()) {
                    let sData = snap.val();
                    sData.b += d.price; // Деньги переходят продавцу
                    sData.reviews = sData.reviews || [];
                    if(star) sData.reviews.push(Number(star));
                    await window.fb.set(sRef, sData);
                }
                await window.fb.update(window.fb.ref(window.fb.db, 'deals/'+fid), {status: 'COMPLETED'});
                alert("Сделка завершена! Продавец получил оплату.");
            },

            publishLot() {
                const n = document.getElementById('lot-name').value, p = document.getElementById('lot-price').value, d = document.getElementById('lot-desc').value, f = document.getElementById('lot-file').files[0];
                if(!n || !p || !f) return alert("Заполните название, цену и добавьте фото!");

                const reader = new FileReader();
                reader.onload = async (e) => {
                    const newR = window.fb.push(window.fb.ref(window.fb.db, 'market'));
                    await window.fb.set(newR, { n, p: Number(p), d, img: e.target.result, sn: this.u.n, fid: newR.key });
                    ui.modal('add');
                    alert("Товар успешно выставлен!");
                };
                reader.readAsDataURL(f);
            },

            async createCartel() {
                const n = document.getElementById('ct-name-in').value;
                if(this.u.b < 500) return alert("Нужно 500 € для создания!");
                if(!n) return alert("Введите название!");

                this.u.b -= 500; await this.saveUser();
                const newC = window.fb.push(window.fb.ref(window.fb.db, 'cartels'));
                await window.fb.set(newC, { n, owner: this.u.n, fid: newC.key, members: [{n: this.u.n, r: 'БОСС'}] });
            },

            renderCt() {
                const my = this.cartels.find(c => c.owner === this.u.n || c.members.some(m => m.n === this.u.n));
                if(my) {
                    document.getElementById('ct-create-ui').style.display='none';
                    document.getElementById('ct-manage-ui').style.display='block';
                    document.getElementById('ct-title-disp').innerText = my.n;
                    document.getElementById('ct-members-list').innerHTML = my.members.map(m => `<div class="card" style="padding:10px;">${m.n} — <b style="color:var(--p)">${m.r}</b></div>`).join('');
                } else {
                    document.getElementById('ct-create-ui').style.display='block';
                    document.getElementById('ct-manage-ui').style.display='none';
                }
            },

            addMember() {
                const n = document.getElementById('ct-add-nick').value, r = document.getElementById('ct-add-role').value;
                const my = this.cartels.find(c => c.owner === this.u.n);
                if(my && n) {
                    my.members.push({n, r: r || 'Участник'});
                    window.fb.update(window.fb.ref(window.fb.db, 'cartels/'+my.fid), {members: my.members});
                    alert("Игрок " + n + " добавлен!");
                }
            },

            async bankTransfer() {
                const tid = Number(document.getElementById('transfer-uid').value), sum = Number(document.getElementById('transfer-sum').value);
                if(sum <= 0 || this.u.b < sum) return alert("Ошибка суммы!");

                // Поиск по UID сложнее, поэтому в этом коде мы предполагаем ввод ника для надежности или ищем в базе
                alert("Функция перевода требует точного совпадения UID в системе.");
            },

            saveUser() { return window.fb.set(window.fb.ref(window.fb.db, 'users/'+this.u.n), this.u); },
            updateAva(i) { 
                const f = i.files[0]; const r = new FileReader(); 
                r.onload = (e) => { this.u.a = e.target.result; this.saveUser(); }; r.readAsDataURL(f); 
            },
            setCur(v) { this.cur = v; this.updUI(); this.renderM(); },
            delLot(fid) { if(confirm("Удалить товар?")) window.fb.remove(window.fb.ref(window.fb.db, 'market/'+fid)); }
        };

        const ui = {
            show(id) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById('scr-'+id).classList.add('active');
                document.querySelectorAll('.nav-i').forEach(i => i.classList.remove('active'));
                const map = {market:0, deals:1, cartel:2, chat:3, prof:4};
                if(map[id] !== undefined) document.querySelectorAll('.nav-i')[map[id]].classList.add('active');
            },
            toggleAuth() {
                core.isRegMode = !core.isRegMode;
                document.getElementById('reg-fields').style.display = core.isRegMode ? 'block' : 'none';
                document.getElementById('main-auth-btn').innerText = core.isRegMode ? 'ЗАРЕГИСТРИРОВАТЬСЯ' : 'ВОЙТИ';
                document.getElementById('auth-toggle-text').innerText = core.isRegMode ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
            },
            modal(id) {
                const m = document.getElementById('mod-'+id);
                m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
            },
            setTheme(v) { document.getElementById('main-body').className = v; }
        };
    </script>
</body>
</html>
